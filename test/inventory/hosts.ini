# =============================================================================
# 로컬 Vagrant 테스트 전용 인벤토리 (spec 6.2절 — ansible_connection=ssh 로 대체)
#   운영용은 ansible/inventory/hosts.ini.example 참고 (ansible_connection=aws_ssm)
#   control(VM1) 안에서 실행하는 걸 전제로 IP는 private_network 고정값 사용.
# =============================================================================

[server_targets]
vm2-server ansible_host=192.168.56.11

# U-64(패치 최신성)가 워커노드/NAT 인스턴스별로 다른 AMI 기준을 비교하기 위해 참조하는
# 그룹 — 로컬 테스트 VM은 EKS 워커노드 역할로 간주(ansible/group_vars/all.yml 2026-09-13 개정 참고)
[eks_worker_nodes]
vm2-server

[server_targets:vars]
ansible_connection=ssh
ansible_user=vagrant
ansible_ssh_private_key_file=~/.ssh/id_ed25519_infracheck
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
ansible_become_method=sudo

# DBMS 플레이(hosts: localhost)를 --limit 으로 단독 실행하려면 인벤토리에 localhost가
# 명시돼 있어야 함(암묵적 localhost는 --limit 매칭 대상에서 빠짐). server_targets가 죽어있을 때
# (예: 리소스 절약을 위해 server VM을 내려둔 상태) DBMS/kind 검증만 돌리려는 목적.
[local]
localhost ansible_connection=local
