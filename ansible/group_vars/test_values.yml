---
# =============================================================================
# ⚠ 테스트 전용 — 실제 값 아님, all.yml에 반영 금지 (spec 6.4절)
#   로컬 VM 테스트 시에만 `-e @group_vars/test_values.yml` 로 얹어서 사용.
#   all.yml 의 TODO(null) 값을 임의값으로 채워 SKIP 게이트가 풀렸을 때의
#   PASS/FAIL 판정 로직이 정상 동작하는지 확인하기 위한 용도.
# =============================================================================

u08_root_group_admin_whitelist: ["ec2-user"]
u40_nfs_allowed_hosts: ["10.0.0.0/16"]
u45_mail_latest_version: "3.14"
u47_relay_allowed_list: ["10.0.0.0/16"]
u49_dns_patch_baseline: "9.18"
u50_dns_allowed_secondaries: ["10.0.1.10"]
u51_dns_dynamic_update_allowed: []
u56_ftp_allowed_hosts: ["10.0.0.0/16"]
u61_snmp_allowed_hosts: ["10.0.0.0/16"]
u65_ntp_allowed_servers: ["169.254.169.123"]
u26_dev_baseline_snapshot: []   # 파일럿 VM에서 `ls /dev` 실행 후 채우는 것을 권장(테스트 시엔 빈 값 유지 가능)
# u31/u33 — 2026-09-13부로 N/A 확정(화이트리스트 개념 자체가 없어짐), 실제 값은
# all.yml의 u31_os_baseline_hidden_entries/u33_business_file_dirs 확정값을 그대로 사용.

d02_unnecessary_account_whitelist: []
d03_password_max_days: 90
d03_password_min_length: 10
d04_admin_account_whitelist: []
d05_applicable: true
d05_password_reuse_limit: 5
d20_admin_owner_whitelist: ["postgres"]
# d06 — 2026-09-13부로 dbms_service_accounts 매핑 기반으로 재설계됨(regex 패턴 방식 폐기),
# 아래 dbms_service_accounts 테스트 override 참고.

# U-66/D-26 — 2026-09-10 재분류(제외→자동판정가능(부분)) 로직 검증용 테스트값.
# u66는 2026-09-13부로 기본값이 "미구현 확정 → 즉시 FAIL"이라, 로컬 테스트에서 실제
# CloudWatch 로그그룹 조회 분기("로그그룹 없음→FAIL")를 확인하려면 missing_log_categories를
# 비워서 log_retention_check.yml 경로를 타도록 해야 한다.
u66_missing_log_categories: []
u66_log_group_name: "/test/infracheck/sudo-session"
d26_audit_log_group_name: "/test/infracheck/dbms-audit"

# U-64 — 2026-09-13부로 all.yml에 실제 확정값이 들어가서 여기 별도 override 불필요(제거함).
# ⚠ 로컬 Vagrant VM은 실제 EC2가 아니라 ec2_metadata_facts 조회 자체가 실패하므로
# (ignore_errors) all.yml 값이 있어도 SKIP이 나오는 게 정상 — AWS 쪽 조회 실패가 아니라
# "현재 AMI를 특정할 수 없음" 분기 확인용.

# D-02/04/06/10 (서비스별 DB 계정/NetworkPolicy 라벨 매핑) — 로컬 VM/kind 테스트 전용 override.
# database 필드가 아래 dbms_connections[].service 값과 일치해야 D-06/D-10 판정 태스크가
# 정상적으로 기대 계정·라벨을 찾는다. service 필드(라벨 값)는 test/k8s/networkpolicies.yaml
# 의 PASS 케이스 ingress 라벨(app=mock-db-pass-service)과 일치시켜둠.
dbms_service_accounts:
  - service: vm3-mysql-service
    engine: mysql
    database: vm3-mysql
    account: member_service
  - service: vm3-postgresql-service
    engine: postgresql
    database: vm3-postgresql
    account: product_service
  - service: mock-db-pass-service
    engine: networkpolicy-test
    database: kind-d10-pass-case
    account: null
  - service: mock-db-fail-service
    engine: networkpolicy-test
    database: kind-d10-fail-case
    account: null

# -----------------------------------------------------------------------------
# 로컬 Vagrant 테스트(VM3=dbms) 접속 정보 — test/Vagrantfile, test/provision/dbms_target.sh 참고
#   비밀번호는 해당 provision 스크립트의 TEST_DB_PASS 와 반드시 일치해야 함(테스트 VM 전용, 실제 값 아님)
# -----------------------------------------------------------------------------
mysql_login_user: root
mysql_login_password: "InfraCheckTest!2026"
pg_login_user: postgres
pg_login_password: "InfraCheckTest!2026"

dbms_connections:
  - service: vm3-mysql
    engine: mysql
    host: "192.168.56.12"
    port: 3306
    secret_ref: null          # VM 테스트는 K8s Secret 미사용 — mysql_login_user/password 위 값 그대로 적용
    namespace: null           # D-07/14 파드레벨 점검은 K8s 클러스터가 없는 VM 테스트라 자동 SKIP됨
    pod_label_selector: null
  - service: vm3-postgresql
    engine: postgresql
    host: "192.168.56.12"
    port: 5432
    secret_ref: null
    namespace: null
    pod_label_selector: null
    database: "testdb"   # D-18 의도적 FAIL 픽스처(GRANT ... TO PUBLIC)가 이 DB에 있음(dbms_target.sh 참고)
  # D-10(NetworkPolicy) 로컬 검증 전용 — kind 클러스터(test/k8s) 안의 더미 파드 대상.
  # engine을 mysql/postgresql이 아닌 값으로 둬서 SQL 점검(mysql.yml/postgresql.yml)은 타지 않고
  # k8s_pod_checks.yml(D-07/D-14/D-10)만 이 두 엔트리를 대상으로 실행되게 함.
  - service: kind-d10-pass-case
    engine: networkpolicy-test
    host: null
    port: null
    secret_ref: null
    namespace: infracheck-test
    pod_label_selector: "app=mock-db-pass"
  - service: kind-d10-fail-case
    engine: networkpolicy-test
    host: null
    port: null
    secret_ref: null
    namespace: infracheck-test
    pod_label_selector: "app=mock-db-fail"
