---
# =============================================================================
# 인프라 점검 기준값 (group_vars/all.yml)
#   출처: 인프라점검_항목분류표_v0_3.xlsx "확정 기준값" 컬럼 + claude_code_handoff_spec.md 2.1절
#   상태 표시:
#     [확정] = 값 확정 완료, 바로 사용 가능
#     [TODO] = 외부 확인 필요, 값 채워질 때까지 해당 항목은 SKIP 처리됨
#             (로직은 전부 작성되어 있음 — 여기 값만 채우면 태스크 수정 없이 바로 동작)
#
#   ⚠ 이 파일은 실제 운영용이다 — 로컬 테스트용 임의값은 절대 여기 넣지 말고
#   `group_vars/test_values.yml`(테스트 전용, `-e @group_vars/test_values.yml`로만 로드됨)에 넣을 것.
# =============================================================================

# =============================================================================
# 서버(U-XX) 기준값
# =============================================================================

# -----------------------------------------------------------------------------
# U-02 : 패스워드 복잡도 [자동판정가능 — OS 표준 기준]
# -----------------------------------------------------------------------------
u02_pwquality:
  minlen: 8
  dcredit: -1
  ucredit: -1
  lcredit: -1
  ocredit: -1

# -----------------------------------------------------------------------------
# U-07 : 불필요한 계정 제거 [확정]
#   판정 로직: 블랙리스트 계정이 "존재" + "로그인 가능(shell 제한 없음 또는 잠금 해제)"
#              상태면 FAIL. 사람 계정 미사용 여부는 last 명령어로 별도 판정(90일 기준).
# -----------------------------------------------------------------------------
u07_unnecessary_accounts:
  - lp
  - uucp
  - nuucp
  - games
  - gopher
  - news
  - sync
u07_unused_login_days_threshold: 90

# -----------------------------------------------------------------------------
# U-08 : root 그룹 권한 제한 [확정 — 2026-09-13 인프라팀 재질의 회신]
#   GID 0(root 그룹) 인가 대상은 기본 root 계정 단일 확정 — 그 외 구성원 존재 시 FAIL.
# -----------------------------------------------------------------------------
u08_root_group_admin_whitelist: ["root"]

# -----------------------------------------------------------------------------
# U-12 : 세션 타임아웃 [자동판정가능]
# -----------------------------------------------------------------------------
u12_tmout_max_seconds: 600

# -----------------------------------------------------------------------------
# U-13 : 패스워드 해시 알고리즘 [자동판정가능]
# -----------------------------------------------------------------------------
u13_required_encrypt_method: "SHA512"

# -----------------------------------------------------------------------------
# U-16,18,19,20,21,22,27,29,37,67 : 주요 파일 권한 임계값 [자동판정가능 — KISA/OS 표준]
#   판정 로직: 실제 권한(8진수)이 기준값보다 넉넉하면(초과) FAIL. 소유자는 root 고정 기대.
# -----------------------------------------------------------------------------
u16_passwd_perm_max: "0644"      # /etc/passwd
u18_shadow_perm_max: "0400"      # /etc/shadow
u19_hosts_perm_max: "0600"       # /etc/hosts
u20_xinetd_perm_max: "0600"      # /etc/xinetd.conf, /etc/xinetd.d/*
u21_syslog_perm_max: "0640"      # /etc/rsyslog.conf
u22_services_perm_max: "0644"    # /etc/services
u27_hosts_equiv_perm_max: "0600" # /etc/hosts.equiv, ~/.rhosts
u29_hosts_lpd_perm_max: "0600"   # /etc/hosts.lpd
u37_crontab_perm_max: "0640"     # /etc/crontab, /etc/cron.d/*
u67_log_perm_max: "0644"         # /var/log/* 로그 파일

# -----------------------------------------------------------------------------
# U-17 : 링크 파일 보호 [자동판정가능]
#   판정 로직: 아래 주요 파일들이 심볼릭 링크로 존재하면 FAIL(원본이어야 함).
# -----------------------------------------------------------------------------
u17_protected_files:
  - /etc/passwd
  - /etc/shadow
  - /etc/group
  - /etc/hosts
  - /etc/services
  - /etc/rsyslog.conf

# -----------------------------------------------------------------------------
# U-23 : SUID/SGID 설정 점검 [확정 — 파일럿 VM 실측 후 보정 권장]
#   판정 로직: 화이트리스트 밖의 SUID/SGID 파일 발견 시 FAIL
# -----------------------------------------------------------------------------
u23_allowed_suid_sgid:
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/passwd
  - /usr/bin/chsh
  - /usr/bin/chfn
  - /usr/bin/gpasswd
  - /usr/bin/newgrp
  - /usr/bin/mount
  - /usr/bin/umount
  - /usr/bin/pkexec
  - /usr/libexec/openssh/ssh-keysign   # Amazon Linux 2023 경로 (Ubuntu는 /usr/lib/openssh/ssh-keysign)

# -----------------------------------------------------------------------------
# U-24 : 사용자 환경 파일 보호 [자동판정가능]
#   판정 로직: 홈 디렉터리 내 아래 파일 중 그룹/전체 쓰기 권한이 있으면 FAIL
# -----------------------------------------------------------------------------
u24_user_env_files:
  - .profile
  - .bashrc
  - .bash_profile
  - .bash_login
  - .bash_logout
  - .cshrc
  - .login
  - .exrc
  - .netrc

# -----------------------------------------------------------------------------
# U-25 : world writable 파일 점검 [자동판정가능]
#   판정 로직: 아래 제외 경로 밖에서 world-writable 파일이 1개라도 있으면 FAIL
# -----------------------------------------------------------------------------
u25_world_writable_exclude_dirs:
  - /proc
  - /sys
  - /dev
  - /tmp
  - /var/tmp
  - /dev/shm
  - /run

# -----------------------------------------------------------------------------
# U-26 : 중요 디바이스 파일 보호 [방법론만 확정 — 값은 파일럿 시 스냅샷 추출]
#   판정 로직: 파일럿 VM에서 정상 /dev 스냅샷을 떠서 이후 diff. mqueue/shm 제외.
#   u26_dev_baseline_snapshot 이 비어있으면 이 항목은 SKIP.
# -----------------------------------------------------------------------------
u26_dev_baseline_snapshot: []   # TODO: 파일럿 VM에서 `ls /dev` 결과로 채울 것
u26_dev_exclude_dirs:
  - mqueue
  - shm

# -----------------------------------------------------------------------------
# U-28 : IP 기반 접근제어 [TODO — 허용 IP 목록 필요, 1차 점검 이후 반영 예정]
# -----------------------------------------------------------------------------
u28_allowed_ips: null   # TODO: 조직 확인 후 값 입력 (예: ['10.0.0.0/16'])

# -----------------------------------------------------------------------------
# U-30 : UMASK 설정 [자동판정가능 — 표준 022 이상]
# -----------------------------------------------------------------------------
u30_umask_min: "022"

# -----------------------------------------------------------------------------
# U-31 : 숨김 디렉터리 점검 [N/A 확정 — 2026-09-13 인프라팀 노션 회신]
#   EKS 관리형 워커노드(AL2023) 기반이라 사용자 정의 숨김파일이 적재되지 않는 것이 정상
#   상태(N/A) — 단, OS/도구 표준 숨김항목 외의 것이 발견되면 FAIL로 자동판정한다.
#   아래 목록은 AL2023 SSM 관리형 노드의 통상적 표준 항목(합리적 추정) — 파일럿 VM
#   실측 결과와 다르면 조정할 것.
# -----------------------------------------------------------------------------
u31_os_baseline_hidden_entries:
  - .ssh
  - .cache
  - .config
  - .local
  - .bash_history
  - .aws
  - .kube
  - .ansible   # Ansible 자체가 모듈 실행용으로 원격 홈 디렉터리에 항상 생성(연결방식 무관, 로컬 VM
              # 테스트(SSH)에서 실측 확인) — SSM 연결도 동일하게 생성하므로 운영에서도 필수 제외 항목

# -----------------------------------------------------------------------------
# U-33 : 불필요한 파일 제거 [N/A 확정 — 2026-09-13 인프라팀 노션 회신]
#   컨테이너 기반 인프라라 애플리케이션/소스코드가 노드에 존재하지 않는 것이 정상 상태
#   (N/A) — 아래 업무 파일 배치 경로에서 파일이 발견되면 FAIL로 자동판정한다.
# -----------------------------------------------------------------------------
u33_business_file_dirs:
  - /opt
  - /srv
  - /var/www
  - /app

# -----------------------------------------------------------------------------
# U-40 : NFS 접근 통제 [TODO — 허용 호스트 목록 필요, NFS 미사용 예정으로 보임]
# -----------------------------------------------------------------------------
u40_nfs_allowed_hosts: null   # TODO: 조직 확인 후 값 입력 (NFS 미사용 확정 시 null 유지 → N/A 처리)
u40_exports_perm_max: "0644"

# -----------------------------------------------------------------------------
# U-42 : 불필요한 RPC 서비스 비활성화 [확정]
# -----------------------------------------------------------------------------
u42_unnecessary_rpc_services:
  - rpcbind.service
  - rpcbind.socket
  - ypbind.service

# -----------------------------------------------------------------------------
# U-45,47,49,50,51,56,61 : 미사용 예정 서비스 관련 [TODO — 값 필요, 서비스 비활성 시 자동 N/A]
#   판정 로직: 서비스 자체가 비활성 상태면 N/A(해당없음). 활성 상태인데 값이 없으면 SKIP.
# -----------------------------------------------------------------------------
u45_mail_latest_version: null      # TODO: 메일서비스 사용 시 벤더 최신버전 기준
u47_relay_allowed_list: null       # TODO: 메일서비스 사용 시 릴레이 허용 도메인/IP
u49_dns_patch_baseline: null       # TODO: DNS서비스 사용 시 최신 보안패치 기준
u50_dns_allowed_secondaries: null  # TODO: DNS서비스 사용 시 허용 Secondary 목록
u51_dns_dynamic_update_allowed: null  # TODO: DNS서비스 사용 시 동적업데이트 허용대상
u56_ftp_allowed_hosts: null        # TODO: FTP서비스 사용 시 허용 IP/호스트
u61_snmp_allowed_hosts: null       # TODO: SNMP서비스 사용 시 허용 대상

# -----------------------------------------------------------------------------
# U-60 : SNMP Community String 복잡성 [자동판정가능]
#   판정 로직: community string이 blacklist에 없고, 영문+숫자 10자 이상
#              또는 영문+숫자+특수문자 8자 이상이면 PASS
# -----------------------------------------------------------------------------
u60_snmp_community_blacklist:
  - public
  - private

# -----------------------------------------------------------------------------
# U-62 : 로그인 시 경고 메시지 설정 [제외 확정 — SSM 전용 접근, 해당없음]
#   SSH/Telnet/FTP/SMTP/DNS 로그온 경로 자체가 없어 스코프 제외 확정(원문 검증 완료).
#   코드 작성 불필요 — build_server_dbms_xlsx.py 에서 N/A 고정 행 처리.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# U-64 : 주기적 보안 패치 및 벤더 권고사항 적용
#   [2026-09-13 인프라팀 노션 회신] SSM Patch Manager 미사용 확정. 대신 "최신 EKS 최적화
#   AMI 교체 + OS dnf 수동 패치" 방식 사용 — AMI 버전/dnf 이력 조회로 재설계.
#   roles/log_patch_check/tasks/main.yml 참고.
#   [2026-09-13 추가 확정 — 담당자 확인 아니라 인프라팀 Terraform 코드 직접 확인]
# -----------------------------------------------------------------------------
# EKS 워커노드: module "eks" { cluster_version = "1.36" } 확인됨 — 확정.
u64_eks_optimized_ami_ssm_param: "/aws/service/eks/optimized-ami/1.36/amazon-linux-2023/x86_64/standard/recommended/image_id"
# NAT 인스턴스: data "aws_ami" { owners=["amazon"], filter name="al2023-ami-2023.*-arm64" }
# 로 AWS 공식 AMI(⚠ arm64 — 워커노드와 다른 아키텍처)를 그대로 참조 확인됨.
# ⚠ "kernel-default" vs "minimal" 계열은 코드 확인만으론 100% 확정 아님(제안값) — 1차
# 점검 시 아래 명령으로 실제 NAT 인스턴스 AMI ID와 한 번 대조 검증 권장:
#   aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64 --query Parameter.Value --output text
#   aws ec2 describe-instances --instance-ids <NAT 인스턴스ID> --query 'Reservations[].Instances[].ImageId'
# 값이 다르면 U-64가 실제로 오탐(FAIL) 내기 전에 파라미터명을 minimal 계열 등으로 교체할 것.
# (U-64 로직 자체가 매 실행마다 이 대조를 자동 수행하므로, 검증 후 문제없으면 그대로 둬도 됨 —
# 다만 이 첫 대조만큼은 확신 없는 값이라 결과가 공식 1차 리포트에 그대로 나가기 전에 수동 확인 권장)
u64_nat_latest_ami_ssm_param: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64"
u64_dnf_patch_max_age_days: null   # TODO: dnf 수동 패치 주기 기준(일) — 조직 정책 필요. null이면 이력만 참고 표시(판정에 미반영)
# 테스트 VM에서 U-64가 SKIP 뜨는 건 정상(Vagrant VM은 AWS 메타데이터 서버 접근 불가 —
# 실제 EC2인 1차 점검 운영 환경에서는 정상 동작, spec 2.2절 참고)

# -----------------------------------------------------------------------------
# U-66 : 정책에 따른 시스템 로깅 설정
#   [2026-09-13 인프라팀 노션 회신] 실제 구현은 ALB 액세스로그용 S3 버킷 하나뿐이고,
#   SSM 세션로그·sudo로그·DB 감사로그는 별도 로그그룹/버킷 전송 자체가 안 되어 있음이
#   확인됨. 이건 "기준값 미확정"이 아니라 "미구현 상태 확인"이므로 SKIP이 아니라
#   FAIL로 판정하는 게 정상이다(버그 아님, 인프라팀 구현 예정 — roles/log_patch_check/
#   tasks/main.yml 참고). 인프라팀이 실제 로그그룹을 만들면 아래 리스트를 빈 배열로
#   비우고 u66_log_group_name(들)을 채워서 실제 보관기간 조회로 전환할 것.
# -----------------------------------------------------------------------------
u66_missing_log_categories:
  - "SSM 세션로그"
  - "sudo 로그"
  - "DB 감사로그"
u66_log_group_name: null   # (인프라팀 구현 완료 후) SSM세션/sudo 로그 저장 로그그룹명
u66_log_retention_min_days: 365   # [확정] 법정값(조건 충족 시 2년이나 기본 1년 이상으로 판정)

# -----------------------------------------------------------------------------
# U-65 : NTP 및 시각 동기화 설정 [확정 — 2026-09-13 인프라팀 노션 회신]
#   Amazon Time Sync Service(chrony) 사용 확정. 별도 외부 NTP 서버 불허.
# -----------------------------------------------------------------------------
u65_ntp_allowed_servers: ["169.254.169.123"]

# =============================================================================
# DBMS(D-XX) 기준값
# =============================================================================

# -----------------------------------------------------------------------------
# D-01,07,08,09,11,14,17,18,21,25 : 절대기준/버전게이트 — 외부 참조값 불필요
#   (DB 접속 정보만 있으면 코드가 스스로 판정 가능)
#   적용범위 확정 사항(2026-09-08 인프라팀 확인, spec 2.1절):
#     - D-07, D-14 : MySQL·PostgreSQL 둘 다 적용 (엔진 무관 보편 원칙)
#     - D-21       : MySQL·PostgreSQL 둘 다 적용
#     - D-26       : MySQL·PostgreSQL 둘 다 적용, 2026-09-10 재분류(제외 → 자동판정가능(부분))
#                    — U-66과 동일 원칙(보관기간 법정값만 자동판정). 아래 별도 블록 참고.
#     - D-09       : MySQL은 8.0.19 이상 버전 게이트로 자동판정, PostgreSQL은 N/A 확정
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# D-26 : 데이터베이스 감사 기록 보관기간 [2026-09-10 재분류: 제외 → 자동판정가능(부분)]
#   구체적 조회 방법(감사로그 테이블 위치 등)은 DB 구축 완료 후 D-17과 함께 별도 설계 예정.
#   지금은 U-66과 동일한 로그그룹 보관기간 조회 로직만 우선 코드화(roles/dbms_common/tasks/main.yml).
# -----------------------------------------------------------------------------
d26_audit_log_group_name: null   # TODO: 확인요청 표 17번 — DB 감사로그 저장 로그그룹명. null이면 SKIP

# -----------------------------------------------------------------------------
# 서비스별 DB 계정/DB명/NetworkPolicy 라벨 매핑 [확정 — 2026-09-13 인프라팀 노션 회신]
#   D-02/04/06/10 이 공통으로 참조하는 단일 출처(중복 정의 금지). service 필드는
#   D-10 NetworkPolicy 라벨 값(app={service})과 동일한 표기(하이픈)를 그대로 쓴다.
#   dbms_connections[].service 값은 이 매핑의 database 필드(언더스코어 표기)와 일치시킬 것.
# -----------------------------------------------------------------------------
dbms_service_accounts:
  - service: member-service
    engine: mysql
    database: member_db
    account: member_service
  - service: auth-service
    engine: mysql
    database: auth_db
    account: auth_service
  - service: order-service
    engine: mysql
    database: order_db
    account: order_service
  - service: payment-service
    engine: mysql
    database: payment_db
    account: payment_service
  - service: product-service
    engine: postgresql
    database: product_db
    account: product_service
  - service: oms-service
    engine: postgresql
    database: oms_db
    account: oms_service
  - service: wms-service
    engine: postgresql
    database: wms_db
    account: wms_service
  - service: scm-service
    engine: postgresql
    database: scm_db
    account: scm_service

# -----------------------------------------------------------------------------
# D-02 : 불필요 계정 제거 [확정 — 2026-09-13 인프라팀 노션 회신]
#   위 dbms_service_accounts의 8개 서비스 계정 + root(MySQL)/postgres(PostgreSQL,
#   Operator bootstrap 전용, 쿼리에서 이미 제외되므로 화이트리스트에 불포함)만 허용.
#   이 목록 외 계정 존재 시 FAIL.
# -----------------------------------------------------------------------------
d02_unnecessary_account_whitelist:
  - member_service
  - auth_service
  - order_service
  - payment_service
  - oms_service
  - product_service
  - wms_service
  - scm_service

# -----------------------------------------------------------------------------
# D-03 : 비밀번호 사용기간·복잡도 [확정 — 2026-09-10 인프라팀 회신]
# -----------------------------------------------------------------------------
d03_password_max_days: 90
d03_password_min_length: 12
d03_password_complexity_min_classes: 3   # 영문 대문자·소문자·숫자·특수문자 중 3종류 이상 조합

# -----------------------------------------------------------------------------
# D-04 : 관리자 권한 최소 인원 [확정 — 2026-09-13 인프라팀 노션 회신]
#   DB 레벨 관리자는 root(MySQL)/postgres(PostgreSQL)만 허용 — 두 계정 모두 이미 쿼리에서
#   제외되므로 화이트리스트는 빈 리스트(그 외 계정이 조회되면 그 자체로 FAIL).
#   ⚠ K8s RBAC이 이 root/postgres 자격증명 접근을 통제하는 계층은 별도 REVIEW 대상
#   (배포 완료 여부 불명확 — DB 내부 권한과 분리해서 보고할 것, spec 2.1절 참고).
# -----------------------------------------------------------------------------
d04_admin_account_whitelist: []

# -----------------------------------------------------------------------------
# D-05 : 비밀번호 재사용 제한 [확정 — 2026-09-10 인프라팀 회신]
#   MySQL에 적용(d05_applicable=true). PostgreSQL은 재사용 이력을 저장하는 네이티브
#   기능 자체가 없어 d05_applicable 값과 무관하게 계속 N/A 처리(postgresql.yml 고정).
# -----------------------------------------------------------------------------
d05_applicable: true
d05_password_reuse_limit: 3

# -----------------------------------------------------------------------------
# D-06 : 계정 개별 부여(공용 계정 금지) [확정 — 2026-09-13 인프라팀 노션 회신]
#   root(MySQL)/postgres(PostgreSQL)는 관리자 목적의 정당한 공용계정으로 예외 허용
#   (쿼리에서 이미 제외). 그 외 로그인 가능 계정은 dbms_service_accounts에서 해당
#   커넥션(db_conn.service)에 매핑된 계정 "단 하나"여야 함 — 그 외 계정이 조회되면
#   공용/교차사용으로 간주해 FAIL(roles/dbms_common/tasks/{mysql,postgresql}.yml 참고).
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# D-17 : Audit Table 접근 제한 [화이트리스트만 확정 — 2026-09-14 인프라팀 회신, 코드 미연동]
#   PostgreSQL 관리자 화이트리스트는 D-04/D-06과 동일(postgres)로 확정됐으나, 실제
#   "Audit Table"의 위치/존재 여부는 아직 회신 없음(DB 구축 후 별도 확인 예정 — D-26 참고).
#   테이블이 특정되기 전까지는 이 변수를 참조하는 판정 로직이 없다 — postgresql.yml의
#   D-17은 여전히 pgAudit 확장 로드 여부만으로 판정(변경 없음). 테이블 위치 확인되면
#   그 테이블에 대한 GRANT 조회 후 이 화이트리스트로 대조하는 로직 추가 필요.
#   MySQL은 1차 점검 스코프 제외(pgAudit이 PostgreSQL 전용) — mysql.yml D-17 SKIP 처리.
# -----------------------------------------------------------------------------
d17_admin_account_whitelist:
  - postgres

# -----------------------------------------------------------------------------
# D-10 : 원격 DB 서버 접속 제한 [확정 — 2026-09-13 인프라팀 노션 회신, 라벨 값까지 확보]
#   K8s NetworkPolicy(라벨 기반 Pod 접근 제한)로 통제. label 키: app / label 값:
#   "{서비스이름}-service" — dbms_service_accounts[].service 값을 그대로 사용한다.
#   roles/dbms_common/tasks/k8s_pod_checks.yml 참고.
# -----------------------------------------------------------------------------
d10_np_label_key: "app"

# -----------------------------------------------------------------------------
# D-20 : 인가되지 않은 Object Owner 제한 [확정 — 2026-09-13 인프라팀 노션 회신]
#   PostgreSQL 전용(product_db/wms_db/scm_db) — product_service/wms_service/scm_service가
#   각자 스키마 소유자, 시스템 카탈로그는 postgres(superuser, 변경불가) 소유가 정상.
# -----------------------------------------------------------------------------
d20_admin_owner_whitelist:
  - postgres
  - product_service
  - wms_service
  - scm_service

# -----------------------------------------------------------------------------
# D-21 : 인가되지 않은 GRANT OPTION 사용 제한 [확정 — 2026-09-14 인프라팀 회신]
#   GRANT OPTION은 관리자 계정(root/postgres)에 한해서만 부여 허용, 그 외 서비스
#   계정(D-02 화이트리스트 8개 포함)이 WITH GRANT OPTION을 보유하면 FAIL.
# -----------------------------------------------------------------------------
d21_grant_option_admin_whitelist:
  - root
  - postgres

# -----------------------------------------------------------------------------
# D-12,13,15,16,19,22,23,24 : 제외 확정(Oracle/MSSQL/Windows 전용, 해당없음 확정)
#   코드 작성 불필요 — build_server_dbms_xlsx.py 에서 N/A 고정 행 처리.
#   (D-26은 2026-09-10 재분류로 이 목록에서 빠짐 — 위 D-26 블록 참고)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# DB 접속 정보 [2026-09-14 인프라팀 회신으로 host/secret_ref 대부분 확정]
#
#   ⚠ MySQL host — 인프라팀이 준 값 그대로 사용(shared-mysql-primary.svc.cluster.local).
#   PostgreSQL 쪽엔 .backend.가 명시돼 있는데 이 값엔 네임스페이스 세그먼트가 빠져있어
#   보임 — 추측해서 고치지 않고 그대로 둠. 연결 안 되면 이 값부터 확인, 확인되면 이 값만
#   교체(재점검 시 FAIL/에러로 바로 드러날 것).
#
#   ⚠ MySQL 자격증명 — 서비스별 개별 Secret이 아니라 공용 Secret(shared-mysql-accounts)
#   안에 서비스별 키(예: member_service_password)로 들어있음 — roles/dbms_common/tasks/
#   mysql.yml 의 자격증명 조회 태스크에서 dbms_service_accounts[].account 값으로 이 키를
#   조회하도록 반영함(2026-09-14).
#
#   ⚠ oms_db(PostgreSQL) — 아직 미활성. 인프라팀 회신에 PostgreSQL 전용 Secret이
#   빠져있음(회신엔 shared-mysql-accounts 쪽에 oms_service_password 키가 있는데, oms는
#   PostgreSQL로 이미 확인된 서비스라 이 키는 관련 없는 값으로 보임 — 확인 필요).
#   secret_ref 확정 전까지 dbms_connections에서 제외.
#
#   ⚠ 여전히 미해결:
#     - RBAC(rbac-secret-access.yaml RoleBinding subjects 빈 값) — 이번 회신에 언급 없음,
#       mgmt 서버 서비스어카운트 바인딩 여부 별도 확인 필요.
#     - 위 자격증명은 서비스별 애플리케이션 계정으로 보임 — D-01/02/04/06/08/09/11/17/18/
#       20/21처럼 다른 계정 정보·시스템 테이블 조회가 필요한 항목은 관리자 권한이 없으면
#       조회 자체가 비거나 오류가 날 수 있음(거짓 PASS 위험). 실제 실행해서 확인 필요.
#
#   member-service는 그대로 둠 — 실제 배포된 파드 라벨은 user-service이고 MySQL
#   NetworkPolicy 허용 라벨은 member-service라 서로 다름(별도 확인 요청 중, D-10이
#   이 불일치를 그대로 잡아내도록 고치지 않음).
# -----------------------------------------------------------------------------
dbms_connections:
  - service: member_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/name=shared-mysql"
  - service: auth_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/name=shared-mysql"
  - service: order_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/name=shared-mysql"
  - service: payment_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/name=shared-mysql"
  - service: product_db
    engine: postgresql
    host: "shared-pg-rw.backend.svc.cluster.local"
    port: 5432
    secret_ref: "shared-pg-product-service-credentials"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/name=shared-pg"
    database: "product_db"
  - service: wms_db
    engine: postgresql
    host: "shared-pg-rw.backend.svc.cluster.local"
    port: 5432
    secret_ref: "shared-pg-wms-service-credentials"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/name=shared-pg"
    database: "wms_db"
  - service: scm_db
    engine: postgresql
    host: "shared-pg-rw.backend.svc.cluster.local"
    port: 5432
    secret_ref: "shared-pg-scm-service-credentials"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/name=shared-pg"
    database: "scm_db"
  # oms_db(PostgreSQL) — secret_ref 확정 전까지 제외(위 주석 참고)
  # - service: oms_db
  #   engine: postgresql
  #   host: "shared-pg-rw.backend.svc.cluster.local"
  #   port: 5432
  #   secret_ref: null           # TODO: 인프라팀 확인 필요
  #   namespace: backend
  #   pod_label_selector: "app.kubernetes.io/name=shared-pg"
  #   database: "oms_db"
