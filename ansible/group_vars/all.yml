---
# =============================================================================
# 인프라 점검 기준값 (group_vars/all.yml)
#   출처: 인프라점검_항목분류표_v0_3.xlsx "확정 기준값" 컬럼 + claude_code_handoff_spec.md 2.1절
#   상태 표시:
#     [확정] = 값 확정 완료, 바로 사용 가능
#     [TODO] = 외부 확인 필요, 값 채워질 때까지 해당 항목은 SKIP 처리됨
#             (로직은 전부 작성되어 있음 — 여기 값만 채우면 태스크 수정 없이 바로 동작)
#
#   ⚠ 이 파일은 실제 운영용이다 — 로컬 테스트용 임의값은 절대 여기 넣지 말고
#   `group_vars/test_values.yml`(테스트 전용, `-e @group_vars/test_values.yml`로만 로드됨)에 넣을 것.
# =============================================================================

# =============================================================================
# 서버(U-XX) 기준값
# =============================================================================

# -----------------------------------------------------------------------------
# U-02 : 비밀번호 관리정책 설정 [자동판정가능 — OS 표준 기준]
# -----------------------------------------------------------------------------
u02_pwquality:
  minlen: 8
  dcredit: -1
  ucredit: -1
  lcredit: -1
  ocredit: -1
# [2026-09-28 원문 조치 기준 반영] 최대 사용기간 90일, 최소 사용기간 1일, 최근 비밀번호 4회 이상 기억
u02_pass_max_days: 90
u02_pass_min_days: 1
u02_remember_min: 4

# -----------------------------------------------------------------------------
# U-03 : 계정 잠금 임계값 설정 [2026-09-28 원문 판단기준 — 10회 이하]
# -----------------------------------------------------------------------------
u03_deny_max: 10

# -----------------------------------------------------------------------------
# U-07 : 불필요한 계정 제거 [확정]
#   판정 로직: 블랙리스트 계정이 "존재" + "로그인 가능(shell 제한 없음 또는 잠금 해제)"
#              상태면 FAIL. 사람 계정 미사용 여부는 last 명령어로 별도 판정(90일 기준).
# -----------------------------------------------------------------------------
u07_unnecessary_accounts:
  - lp
  - uucp
  - nuucp
  - games
  - gopher
  - news
  - sync
u07_unused_login_days_threshold: 90
# 2026-09-24 보안팀 판단(사용자 확정) — ssm-user는 SSM Session Manager 접속용 필수 계정
# (U-28에서 SSM을 접속 수단으로 인정)이라 원문의 "불필요한 계정"이 아님. SSM 세션은
# lastlog에 기록되지 않아 항상 장기 미사용으로 잡히고, 삭제해도 SSM 에이전트가 재생성하므로
# 미사용(lastlog) 판정에서만 제외한다(블랙리스트 판정과는 무관).
u07_stale_check_exclude_accounts:
  - ssm-user

# -----------------------------------------------------------------------------
# U-08 : 관리자 그룹에 최소한의 계정 포함 [확정 — 2026-09-13 인프라팀 재질의 회신]
#   GID 0(root 그룹) 인가 대상은 기본 root 계정 단일 확정 — 그 외 구성원 존재 시 FAIL.
# -----------------------------------------------------------------------------
u08_root_group_admin_whitelist: ["root"]

# -----------------------------------------------------------------------------
# U-09 : 계정이 존재하지 않는 GID 금지 [2026-09-28 원문 기준 재작성]
#   사용자 생성 그룹(GID >= GID_MIN) 중 계정이 없어도 필요한 그룹(원문 "추후 권한 할당을
#   위해 먼저 생성한 그룹")만 인프라팀 확인 후 추가.
# -----------------------------------------------------------------------------
u09_allowed_empty_groups: []

# -----------------------------------------------------------------------------
# U-12 : 세션 종료 시간 설정 [자동판정가능]
# -----------------------------------------------------------------------------
u12_tmout_max_seconds: 600

# -----------------------------------------------------------------------------
# U-13 : 안전한 비밀번호 암호화 알고리즘 사용 [자동판정가능]
# -----------------------------------------------------------------------------
u13_allowed_encrypt_methods: ["SHA256", "SHA512"]   # 원문 "SHA-2 이상"

# -----------------------------------------------------------------------------
# U-16,18,19,20,21,22,27,29,37,67 : 주요 파일 권한 임계값 [자동판정가능 — KISA/OS 표준]
#   판정 로직: 실제 권한(8진수)이 기준값보다 넉넉하면(초과) FAIL. 소유자는 root 고정 기대.
# -----------------------------------------------------------------------------
u16_passwd_perm_max: "0644"      # /etc/passwd
u18_shadow_perm_max: "0400"      # /etc/shadow
u19_hosts_perm_max: "0644"       # /etc/hosts [2026-09-16 수정 — 원문 가이드 공식 기준은 644, 0600은 오기였음]
u20_xinetd_perm_max: "0600"      # /etc/xinetd.conf, /etc/xinetd.d/*
u21_syslog_perm_max: "0640"      # /etc/rsyslog.conf
u22_services_perm_max: "0644"    # /etc/services
u27_hosts_equiv_perm_max: "0600" # /etc/hosts.equiv, ~/.rhosts
u29_hosts_lpd_perm_max: "0600"   # /etc/hosts.lpd
u37_crontab_perm_max: "0640"     # /etc/crontab, /etc/cron.d/*
u67_log_perm_max: "0644"         # /var/log/* 로그 파일

# -----------------------------------------------------------------------------
# U-23 : SUID, SGID, Sticky bit 설정 파일 점검 [확정 — 파일럿 VM 실측 후 보정 권장]
#   판정 로직: 화이트리스트 밖의 SUID/SGID 파일 발견 시 FAIL
# -----------------------------------------------------------------------------
u23_allowed_suid_sgid:
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/passwd
  - /usr/bin/chsh
  - /usr/bin/chfn
  - /usr/bin/gpasswd
  - /usr/bin/newgrp
  - /usr/bin/mount
  - /usr/bin/umount
  - /usr/bin/pkexec
  - /usr/libexec/openssh/ssh-keysign   # Amazon Linux 2023 경로 (Ubuntu는 /usr/lib/openssh/ssh-keysign)
  - /usr/bin/at        # AL2023 표준 바이너리(at 패키지) — 2026-09-21 파일럿 실측 확인
  - /usr/bin/chage     # AL2023 표준 바이너리(shadow-utils) — 2026-09-21 파일럿 실측 확인
  - /usr/bin/write     # AL2023 표준 바이너리(util-linux) — 2026-09-21 파일럿 실측 확인
  - /usr/bin/screen    # AL2023 표준 바이너리(screen 패키지) — 2026-09-21 파일럿 실측 확인
  # 2026-09-28 인프라팀 회신 — 2차 점검에서 발견된 호스트 경로, OS 기본 패키지 표준 바이너리(변조·추가 아님).
  #   원문 점검 대상은 "불필요하거나 악의적인" SUID라 필요 여부로 다시 판단:
  #   unix_chkpwd(PAM 비밀번호 확인)·utempter(터미널 세션 기록, screen 사용)는 필요.
  #   mount.nfs는 NFS 미사용 확정(U-39)이라 불필요한 SUID로 보고 허용하지 않음(사용자 확정).
  #   pam_timestamp_check·grub2-set-bootflag는 2026-09-29 인프라팀 회신(SUID 제거 조치 예정)으로 불필요 확정 — 허용하지 않음.
  - /usr/sbin/unix_chkpwd
  - /usr/libexec/utempter/utempter
# [2026-09-24] U-15/U-23 제외 경로 — 2차 점검 결과 전수 확인: 무소유자 파일·화이트리스트 밖 SUID
#   파일의 대부분이 containerd 이미지 레이어(/var/lib/containerd/.../snapshots/*/fs/…) 내부로, 컨테이너
#   이미지 안의 파일이지 호스트 파일이 아님(U-25와 같은 판단). find -prune으로 탐색 자체를 건너뛴다.
u15_unowned_exclude_dirs:
  - /var/lib/containerd
u23_suid_exclude_dirs:
  - /var/lib/containerd

# -----------------------------------------------------------------------------
# U-24 : 사용자, 시스템 환경변수 파일 소유자 및 권한 설정 [자동판정가능]
#   판정 로직: 홈 디렉터리 내 아래 파일 중 그룹/전체 쓰기 권한이 있으면 FAIL
# -----------------------------------------------------------------------------
u24_user_env_files:
  - .profile
  - .bashrc
  - .bash_profile
  - .bash_login
  - .bash_logout
  - .cshrc
  - .login
  - .exrc
  - .netrc

# -----------------------------------------------------------------------------
# U-25 : world writable 파일 점검 [자동판정가능]
#   판정 로직: 아래 제외 경로 밖에서 world-writable 파일이 1개라도 있으면 FAIL
# -----------------------------------------------------------------------------
u25_world_writable_exclude_dirs:
  - /proc
  - /sys
  - /dev
  - /tmp
  - /var/tmp
  - /dev/shm
  - /run
  - /var/lib/kubelet/pods   # [2026-09-23] 컨테이너 런타임이 만드는 로그/소켓 파일 — 호스트
  - /var/lib/containerd     # 취약점 아님(2차 점검 결과 전수 확인, 전부 이 두 경로였음)

# -----------------------------------------------------------------------------
# U-26 : /dev에 존재하지 않는 device 파일 점검 [2026-09-28 원문 기준 재작성]
#   원문 판단기준은 /dev 내 device가 아닌 일반 파일(find /dev -type f) 존재 여부 — 원문 예외인
#   mqueue·shm 하위만 제외. 기존 디바이스 노드 스냅샷 대조(u26_dev_baseline_snapshot)는 원문과
#   달라 삭제(roles/file_permission/tasks/main.yml 참고).
# -----------------------------------------------------------------------------
u26_dev_exclude_dirs:
  - mqueue
  - shm

# -----------------------------------------------------------------------------
# U-28 : 접속 IP 및 포트 제한 [2026-09-20 판정기준 재설계 — roles/file_permission/tasks/main.yml
#   참고. IP 허용목록 대조가 아니라 SG 22번 인바운드 부재(SSM Session Manager 대체) 기반
#   자동판정으로 전환해 별도 화이트리스트 변수가 필요 없어짐.]
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# U-30 : UMASK 설정 관리 [자동판정가능 — 표준 022 이상]
# -----------------------------------------------------------------------------
u30_umask_min: "022"

# -----------------------------------------------------------------------------
# U-33 : 숨겨진 파일 및 디렉토리 검색 및 제거 [2026-09-28 원문 기준 재작성]
#   원문 판단기준: 불필요하거나 의심스러운 숨겨진 파일·디렉토리가 없어야 함. 아래 목록은
#   OS/도구가 만드는 표준 항목(bash 패턴, 디렉토리 항목은 그 하위도 허용)이고, 목록 밖
#   항목이 발견되면 FAIL. 홈 디렉토리 항목은 기존 U-31(홈 숨김 디렉터리) 기준 목록을 그대로
#   옮겼고(.ansible·.gnupg 확인 이력 포함 — 2026-09-22 인프라팀 확인), 시스템 경로 항목은
#   AL2023 표준 파일 기준 추정 — ⚠ 전체(/) 검색은 이번이 처음이라 재점검 결과로 확인 후 조정.
#   [2026-09-29] 설치 패키지가 소유한 숨김 파일은 rpm -qf로 자동 인정하므로, 아래 목록은 패키지에 없는
#   홈 셸 파일·실행 중 생성 파일만 둔다. 전체 검색 결과는 mgmt 서버 ansible/results/*_u33_hidden_*.log.
# -----------------------------------------------------------------------------
u33_hidden_exclude_dirs:
  - /proc
  - /sys
  - /run
  - /var/lib/containerd      # 컨테이너 이미지 레이어(U-15/U-23/U-25와 동일)
  - /var/lib/kubelet         # 파드 볼륨(..data 등 K8s가 만드는 숨김 링크)
u33_hidden_allowed_paths:
  # 홈 디렉토리(/root, /home/*) — 셸 기본 파일 및 기존 U-31 기준 목록
  - "/root/.bash*"
  - "/root/.profile"
  - "/root/.cshrc"
  - "/root/.tcshrc"
  - "/root/.ssh"
  - "/root/.cache"
  - "/root/.config"
  - "/root/.local"
  - "/root/.aws"
  - "/root/.kube"
  - "/root/.ansible"
  - "/root/.gnupg"
  - "/root/.viminfo"
  - "/root/.lesshst"
  - "/home/*/.bash*"
  - "/home/*/.profile"
  - "/home/*/.ssh"
  - "/home/*/.cache"
  - "/home/*/.config"
  - "/home/*/.local"
  - "/home/*/.aws"
  - "/home/*/.kube"
  - "/home/*/.ansible"
  - "/home/*/.gnupg"
  - "/home/*/.viminfo"
  - "/home/*/.lesshst"
  - "/root/.python_history"   # [2026-09-29 추가] 셸·도구가 홈에 만드는 기록 파일
  - "/root/.wget-hsts"
  - "/root/.rnd"
  - "/root/.pki"
  - "/home/*/.python_history"
  - "/home/*/.wget-hsts"
  - "/home/*/.rnd"
  - "/home/*/.pki"
  - "/etc/skel/.*"
  # 시스템 경로 — 패키지에 들어 있지 않고 실행 중 생성되는 표준 파일만(패키지 설치 파일은 rpm -qf로 자동 인정,
  #   2026-09-29부터 — 그래서 /usr/lib/.build-id 등 패키지 소유 항목은 목록에서 뺐음)
  - "/etc/.pwd.lock"          # shadow-utils 계정 파일 잠금
  - "/etc/.updated"           # systemd 업데이트 확인 표시
  - "/var/.updated"
  - "/var/lib/rpm/.rpm.lock"  # rpm DB 잠금
  - "/usr/lib/sysimage/rpm/.rpm.lock"
  - "/tmp/.X11-unix"          # systemd-tmpfiles가 부팅 시 만드는 표준 디렉토리
  - "/tmp/.ICE-unix"
  - "/tmp/.font-unix"
  - "/tmp/.XIM-unix"
  - "/tmp/.Test-unix"
  - "/var/log/journal/*/.#*journal*"   # journald 로그 교체 중 임시 파일

# -----------------------------------------------------------------------------
# U-40 : NFS 접근 통제 [TODO — 허용 호스트 목록 필요, NFS 미사용 예정으로 보임]
# -----------------------------------------------------------------------------
u40_nfs_allowed_hosts: null   # TODO: 조직 확인 후 값 입력 (NFS 미사용 확정 시 null 유지 → N/A 처리)
u40_exports_perm_max: "0644"

# -----------------------------------------------------------------------------
# U-42 : 불필요한 RPC 서비스 비활성화 [확정]
# -----------------------------------------------------------------------------
u42_unnecessary_rpc_services:
  - rpcbind.service
  - rpcbind.socket
  - ypbind.service

# -----------------------------------------------------------------------------
# U-45,47,49,50,51,56,61 : 미사용 예정 서비스 관련 [TODO — 값 필요, 서비스 비활성 시 자동 N/A]
#   판정 로직: 서비스 자체가 비활성 상태면 N/A(해당없음). 활성 상태인데 값이 없으면 SKIP.
# -----------------------------------------------------------------------------
u45_mail_latest_version: null      # TODO: 메일서비스 사용 시 벤더 최신버전 기준
u47_relay_allowed_list: null       # TODO: 메일서비스 사용 시 릴레이 허용 도메인/IP
u49_dns_patch_baseline: null       # TODO: DNS서비스 사용 시 최신 보안패치 기준
u50_dns_allowed_secondaries: null  # TODO: DNS서비스 사용 시 허용 Secondary 목록
u51_dns_dynamic_update_allowed: null  # TODO: DNS서비스 사용 시 동적업데이트 허용대상
u56_ftp_allowed_hosts: null        # TODO: FTP서비스 사용 시 허용 IP/호스트
u61_snmp_allowed_hosts: null       # TODO: SNMP서비스 사용 시 허용 대상

# -----------------------------------------------------------------------------
# U-60 : SNMP Community String 복잡성 설정 [자동판정가능]
#   판정 로직: community string이 blacklist에 없고, 영문+숫자 10자 이상
#              또는 영문+숫자+특수문자 8자 이상이면 PASS
# -----------------------------------------------------------------------------
u60_snmp_community_blacklist:
  - public
  - private

# -----------------------------------------------------------------------------
# U-62 : 로그인 시 경고 메시지 설정 [제외 확정 — SSM 전용 접근, 해당없음]
#   SSH/Telnet/FTP/SMTP/DNS 로그온 경로 자체가 없어 스코프 제외 확정(원문 검증 완료).
#   코드 작성 불필요 — build_server_dbms_xlsx.py 에서 N/A 고정 행 처리.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# U-64 : 주기적 보안 패치 및 벤더 권고사항 적용
#   [2026-09-13 인프라팀 노션 회신] SSM Patch Manager 미사용 확정. 대신 "최신 EKS 최적화
#   AMI 교체 + OS dnf 수동 패치" 방식 사용 — AMI 버전/dnf 이력 조회로 재설계.
#   roles/log_patch_check/tasks/main.yml 참고.
#   [2026-09-13 추가 확정 — 담당자 확인 아니라 인프라팀 Terraform 코드 직접 확인]
# -----------------------------------------------------------------------------
# EKS 워커노드: module "eks" { cluster_version = "1.36" } 확인됨 — 확정.
u64_eks_optimized_ami_ssm_param: "/aws/service/eks/optimized-ami/1.36/amazon-linux-2023/x86_64/standard/recommended/image_id"
# NAT 인스턴스: data "aws_ami" { owners=["amazon"], filter name="al2023-ami-2023.*-arm64" }
# 로 AWS 공식 AMI(⚠ arm64 — 워커노드와 다른 아키텍처)를 그대로 참조 확인됨.
# ⚠ "kernel-default" vs "minimal" 계열은 코드 확인만으론 100% 확정 아님(제안값) — 1차
# 점검 시 아래 명령으로 실제 NAT 인스턴스 AMI ID와 한 번 대조 검증 권장:
#   aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64 --query Parameter.Value --output text
#   aws ec2 describe-instances --instance-ids <NAT 인스턴스ID> --query 'Reservations[].Instances[].ImageId'
# 값이 다르면 U-64가 실제로 오탐(FAIL) 내기 전에 파라미터명을 minimal 계열 등으로 교체할 것.
# (U-64 로직 자체가 매 실행마다 이 대조를 자동 수행하므로, 검증 후 문제없으면 그대로 둬도 됨 —
# 다만 이 첫 대조만큼은 확신 없는 값이라 결과가 공식 1차 리포트에 그대로 나가기 전에 수동 확인 권장)
u64_nat_latest_ami_ssm_param: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64"
u64_dnf_patch_max_age_days: 30   # 2026-09-20 인프라팀 확정(트래킹표 14번) — 30일 초과 시 FAIL
# 테스트 VM에서 U-64가 SKIP 뜨는 건 정상(Vagrant VM은 AWS 메타데이터 서버 접근 불가 —
# 실제 EC2인 1차 점검 운영 환경에서는 정상 동작, spec 2.2절 참고)

# -----------------------------------------------------------------------------
# U-66 : 정책에 따른 시스템 로깅 설정 — [2026-09-29 원문 기준 재작성] 기준값 변수 없음
#   기존 u66_missing_log_categories/u66_log_group_name/u66_log_retention_min_days(CloudWatch 로그그룹
#   전송·365일 보관, 보안_정책가이드 기준)는 원문 U-66 기준이 아니라 삭제 — roles/log_patch_check/
#   tasks/u66_check.yml 참고(로깅 데몬이 인증 로그를 실제로 남기는지 호스트별 확인).
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# U-65 : NTP 및 시각 동기화 설정 [확정 — 2026-09-13 인프라팀 노션 회신]
#   Amazon Time Sync Service(chrony) 사용 확정. 별도 외부 NTP 서버 불허.
# -----------------------------------------------------------------------------
u65_ntp_allowed_servers: ["169.254.169.123"]

# =============================================================================
# DBMS(D-XX) 기준값
# =============================================================================

# -----------------------------------------------------------------------------
# D-01,07,08,09,11,14,17,18,21,25 : 절대기준/버전게이트 — 외부 참조값 불필요
#   (DB 접속 정보만 있으면 코드가 스스로 판정 가능)
#   적용범위 확정 사항(2026-09-08 인프라팀 확인, spec 2.1절):
#     - D-07, D-14 : MySQL·PostgreSQL 둘 다 적용 (엔진 무관 보편 원칙)
#     - D-21       : MySQL·PostgreSQL 둘 다 적용
#     - D-26       : MySQL·PostgreSQL 둘 다 적용 — 2026-09-29 원문 기준 재작성(DB 감사 기록 설정 조회)
#     - D-09       : MySQL은 8.0.19 이상 버전 게이트로 자동판정, PostgreSQL은 N/A 확정
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# D-25 : 주기적 보안 패치 및 벤더 권고 사항 적용 — 지원 중인 메이저 버전별 최신 보안 패치 버전
#   [2026-09-29 원문 기준 재작성] 출처(벤더 공식): PostgreSQL https://www.postgresql.org/support/versioning/
#   ("Current minor", Supported=Yes), MySQL https://dev.mysql.com/doc/relnotes/mysql/{8.4,9.7}/en/ 최신 릴리스
#   노트. MySQL 8.0은 2026-04 8.0.46으로 지원 종료(EoL, 8.0 릴리스 노트 공지)라 목록에서 제외.
#   ⚠ 두 벤더 모두 분기마다 패치를 내므로 점검 직전에 위 공식 페이지로 갱신하고 d25_db_latest_versions_as_of도 바꿀 것.
# -----------------------------------------------------------------------------
d25_db_latest_versions_as_of: "2026-09-29"
d25_db_latest_versions:
  mysql:        # 메이저(x.y) → 최신 패치
    "8.4": "8.4.12"     # LTS, 2026-08-18
    "9.7": "9.7.3"      # 2026-08-18
  postgresql:   # 메이저 → 최신 패치(2026-08 정기 릴리스)
    "14": "14.24"       # 지원 종료 2026-11-12 예정
    "15": "15.19"
    "16": "16.15"
    "17": "17.11"
    "18": "18.6"

# -----------------------------------------------------------------------------
# D-26 : 데이터베이스의 접근, 변경, 삭제 등의 감사 기록이 기관의 감사 기록 정책에 적합하도록 설정
#   [2026-09-29 원문 기준 재작성] 기준값 변수 없음 — 기존 d26_audit_not_implemented/d26_audit_log_group_name
#   (CloudWatch 연동·365일 보관, 보안_정책가이드 기준)은 원문 기준이 아니라 삭제. DB가 감사 기록을 남기도록
#   설정돼 있는지 커넥션별로 조회(mysql.yml/postgresql.yml D-26 참고).
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# 서비스별 DB 계정/DB명/NetworkPolicy 라벨 매핑 [확정 — 2026-09-13 인프라팀 노션 회신]
#   [2026-09-24 정정] total-k8s(인프라팀 저장소) 실제 값으로 교체 — 계정은 {서비스}_user
#   (기존 {서비스}_service는 실제로 존재하지 않는 계정명이었음), member는 실제로 user-service
#   / user_db / user_user(NetworkPolicy shared-mysql-ingress도 app=user-service 허용).
#   출처: charts/backend-service/values/*.yaml, mysql account-provisioning-job, CNPG managed roles
#   D-02/04/06/10 이 공통으로 참조하는 단일 출처(중복 정의 금지). service 필드는
#   D-10 NetworkPolicy 라벨 값(app={service})과 동일한 표기(하이픈)를 그대로 쓴다.
#   dbms_connections[].service 값은 이 매핑의 database 필드(언더스코어 표기)와 일치시킬 것.
# -----------------------------------------------------------------------------
dbms_service_accounts:
  - service: user-service
    engine: mysql
    database: user_db
    account: user_user
  - service: auth-service
    engine: mysql
    database: auth_db
    account: auth_user
  - service: order-service
    engine: mysql
    database: order_db
    account: order_user
  - service: payment-service
    engine: mysql
    database: payment_db
    account: payment_user
  - service: product-service
    engine: postgresql
    database: product_db
    account: product_user
  - service: oms-service
    engine: postgresql
    database: oms_db
    account: oms_user
  - service: wms-service
    engine: postgresql
    database: wms_db
    account: wms_user
  - service: scm-service
    engine: postgresql
    database: scm_db
    account: scm_user

# -----------------------------------------------------------------------------
# D-02 : 데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용 [확정 — 2026-09-13 인프라팀 노션 회신]
#   위 dbms_service_accounts의 8개 서비스 계정 + root(MySQL)/postgres(PostgreSQL,
#   Operator bootstrap 전용, 쿼리에서 이미 제외되므로 화이트리스트에 불포함)만 허용.
#   이 목록 외 계정 존재 시 FAIL.
# -----------------------------------------------------------------------------
d02_unnecessary_account_whitelist:
  - user_user
  - auth_user
  - order_user
  - payment_user
  - oms_user
  - product_user
  - wms_user
  - scm_user
  - ai_user        # ai-service 계정(점검 8개 서비스 범위 밖이지만 같은 PostgreSQL 클러스터의 정상 계정)

# -----------------------------------------------------------------------------
# D-02/04/06/21 공통 : 운영 필수 계정 [2026-09-24 보안팀 판단(사용자 확정)]
#   서비스 계정은 아니지만 DB 운영에 필수인 계정 — 근거와 함께 판정에서 제외한다.
#   dbms_operator_accounts: 오퍼레이터가 내부적으로 생성·사용하는 계정(삭제 시 클러스터
#     오작동). MOCO는 moco-* 8종(MOCO 소스 pkg/constants/users.go의 MocoUsers 목록과 일치 —
#     시스템 계정 6종 + MOCO가 사용자용으로 자동 제공하는 moco-readonly/moco-writable), CNPG는
#     복제용 streaming_replica. D-02/04/06/21에 적용.
#   dbms_dba_accounts: 인프라팀이 발급한 DBA 관리 계정(total-k8s account-provisioning-job,
#     CNPG managed roles). SUPER/GRANT OPTION이 없는 계정이라 D-04/D-21 예외에는 넣지 않음
#     (보유하게 되면 그대로 FAIL로 잡히도록). D-02/06에만 적용.
#   ※ CNPG 기본 계정 app(shared-pg-app)은 운영 필수가 아니라 D-02 판단 대상이라 넣지 않음.
#   목록은 9/28 재점검에서 실제로 조회된 계정 기준으로 최종 확정.
# -----------------------------------------------------------------------------
dbms_operator_accounts:
  mysql: [moco-admin, moco-agent, moco-repl, moco-clone-donor, moco-exporter, moco-backup, moco-readonly, moco-writable]
  postgresql: [streaming_replica]
dbms_dba_accounts: [dba_admin]

# -----------------------------------------------------------------------------
# D-03 : 비밀번호 사용 기간 및 복잡도를 기관의 정책에 맞도록 설정 [2026-09-24 보안팀 판단(사용자 확정)]
#   인프라팀은 DB 만료 설정 대신 CronJob(dba-admin-rotate, 매일 점검 후 90일 경과 시 교체)
#   으로 90일 정책을 구현함 — 교체 시각을 Secret annotation에 기록. 원문 기준(90일·복잡도)은
#   그대로 두고 점검 방법만 넓혀, DB 만료 설정 또는 자동 교체 이력(최근 교체 90일 이내) 중
#   하나로 사용기간을, DB 복잡도 정책 또는 자동 교체 생성 규칙(12자·대소문자·숫자·특수문자
#   4종 보장)으로 복잡도를 인정한다. 출처: total-k8s workloads/*/overlays/eks/dba-admin-rotate-cronjob.yaml
# -----------------------------------------------------------------------------
d03_rotation:
  namespace: backend
  annotation: "dba-admin/last-rotated"
  secrets:
    mysql: "shared-mysql-dba-admin"
    postgresql: "shared-pg-dba-admin-credentials"

# -----------------------------------------------------------------------------
# D-03 : 비밀번호 사용 기간 및 복잡도를 기관의 정책에 맞도록 설정 [확정 — 2026-09-10 인프라팀 회신(값). 법적 근거
#   있는 기준(주요정보통신기반시설 가이드)이라 예외 처리 없이 미준수는 정직하게 FAIL
#   보고 원칙 — 2026-09-22 재정리]
#   서비스 계정은 자동 로테이션 없이 강제 만료 시 장애 위험이 커 DBA 협의로 실제
#   미적용 상태(FAIL, N/A 아님 — "법이 적용 안 됨"이 아니라 "적용은 되는데 못 지킴").
#   대신 이 정책 전용 유저 계정을 신규 생성해 그 계정에는 정책을 준수하기로 확정 —
#   서비스 계정 FAIL을 상쇄하는 게 아니라 별도 행으로 준수 현황을 보여주는 용도.
#   [2026-09-23 인프라팀 확인] 계정명 `dba_admin`(MySQL/PostgreSQL 동일 이름)으로 생성
#   완료 — d03_user_accounts에 반영, 다음 실행부터 실측 전환.
# -----------------------------------------------------------------------------
d03_password_max_days: 90
d03_password_min_length: 12
d03_password_complexity_min_classes: 3   # 영문 대문자·소문자·숫자·특수문자 중 3종류 이상 조합
d03_user_accounts:
  mysql: ["dba_admin"]
  postgresql: ["dba_admin"]

# -----------------------------------------------------------------------------
# D-04 : 데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용 [확정 — 2026-09-13 인프라팀 노션 회신]
#   DB 레벨 관리자는 root(MySQL)/postgres(PostgreSQL)만 허용 — 두 계정 모두 이미 쿼리에서
#   제외되므로 화이트리스트는 빈 리스트(그 외 계정이 조회되면 그 자체로 FAIL).
#   ⚠ K8s RBAC이 이 root/postgres 자격증명 접근을 통제하는 계층은 별도 REVIEW 대상
#   (배포 완료 여부 불명확 — DB 내부 권한과 분리해서 보고할 것, spec 2.1절 참고).
# -----------------------------------------------------------------------------
d04_admin_account_whitelist: []

# -----------------------------------------------------------------------------
# D-05 : 비밀번호 재사용에 대한 제약 설정 [확정 — 2026-09-10 인프라팀 회신]
#   MySQL에 적용(d05_applicable=true). PostgreSQL은 재사용 이력을 저장하는 네이티브
#   기능 자체가 없어 d05_applicable 값과 무관하게 계속 N/A 처리(postgresql.yml 고정).
# -----------------------------------------------------------------------------
d05_applicable: true
d05_password_reuse_limit: 3

# -----------------------------------------------------------------------------
# D-06 : DB 사용자 계정을 개별적으로 부여하여 사용 [확정 — 2026-09-13 인프라팀 노션 회신]
#   root(MySQL)/postgres(PostgreSQL)는 관리자 목적의 정당한 공용계정으로 예외 허용
#   (쿼리에서 이미 제외). 그 외 로그인 가능 계정은 dbms_service_accounts에서 해당
#   커넥션(db_conn.service)에 매핑된 계정 "단 하나"여야 함 — 그 외 계정이 조회되면
#   공용/교차사용으로 간주해 FAIL(roles/dbms_common/tasks/{mysql,postgresql}.yml 참고).
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# D-17 : Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한
#   [2026-09-28 원문 재대조] MySQL·PostgreSQL 모두 감사 기록을 테이블이 아닌 로그 파일로 남겨
#   점검할 Audit Table이 없어 N/A로 판정(mysql.yml/postgresql.yml). 아래 변수는 현재 미사용.
# -----------------------------------------------------------------------------
d17_admin_account_whitelist:
  - postgres

# -----------------------------------------------------------------------------
# D-10 : 원격에서 DB 서버로의 접속 제한 [확정 — 2026-09-13 인프라팀 노션 회신, 라벨 값까지 확보]
#   K8s NetworkPolicy(라벨 기반 Pod 접근 제한)로 통제. label 키: app / label 값:
#   "{서비스이름}-service" — dbms_service_accounts[].service 값을 그대로 사용한다.
#   roles/dbms_common/tasks/k8s_pod_checks.yml 참고.
# -----------------------------------------------------------------------------
d10_np_label_key: "app"

# -----------------------------------------------------------------------------
# D-20 : 인가되지 않은 Object Owner의 제한 [확정 — 2026-09-13 인프라팀 노션 회신]
#   PostgreSQL 전용(product_db/wms_db/scm_db) — product_user/wms_user/scm_user/oms_user가
#   각자 스키마 소유자, 시스템 카탈로그는 postgres(superuser, 변경불가) 소유가 정상.
# -----------------------------------------------------------------------------
d20_admin_owner_whitelist:
  - postgres
  - product_user
  - wms_user
  - scm_user
  - oms_user   # 2026-09-24 추가 — oms_db(9/23 활성화)도 같은 규칙

# -----------------------------------------------------------------------------
# D-21 : 인가되지 않은 GRANT OPTION 사용 제한 [확정 — 2026-09-14 인프라팀 회신]
#   GRANT OPTION은 관리자 계정(root/postgres)에 한해서만 부여 허용, 그 외 서비스
#   계정(D-02 화이트리스트 8개 포함)이 WITH GRANT OPTION을 보유하면 FAIL.
# -----------------------------------------------------------------------------
d21_grant_option_admin_whitelist:
  - root
  - postgres

# -----------------------------------------------------------------------------
# D-12,13,15,16,19,22,23,24 : 제외 확정(Oracle/MSSQL/Windows 전용, 해당없음 확정)
#   코드 작성 불필요 — build_server_dbms_xlsx.py 에서 N/A 고정 행 처리.
#   (D-26은 2026-09-10 재분류로 이 목록에서 빠짐 — 위 D-26 블록 참고)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# DB 접속 정보 [2026-09-14 인프라팀 회신으로 host/secret_ref 대부분 확정]
#
#   ⚠ MySQL host — 인프라팀이 준 값 그대로 사용(shared-mysql-primary.svc.cluster.local).
#   PostgreSQL 쪽엔 .backend.가 명시돼 있는데 이 값엔 네임스페이스 세그먼트가 빠져있어
#   보임 — 추측해서 고치지 않고 그대로 둠. 연결 안 되면 이 값부터 확인, 확인되면 이 값만
#   교체(재점검 시 FAIL/에러로 바로 드러날 것).
#
#   ⚠ MySQL 자격증명 — 서비스별 개별 Secret이 아니라 공용 Secret(shared-mysql-accounts)
#   안에 서비스별 키(예: member_service_password)로 들어있음 — roles/dbms_common/tasks/
#   mysql.yml 의 자격증명 조회 태스크에서 dbms_service_accounts[].account 값으로 이 키를
#   조회하도록 반영함(2026-09-14).
#
#   ⚠ oms_db(PostgreSQL) — [2026-09-23 인프라팀 확인] `shared-pg-oms-service-credentials`
#   로 확정 — 다른 PostgreSQL DB와 동일 네이밍 규칙이라 그대로 반영, dbms_connections에
#   활성화 완료.
#
#   ⚠ 여전히 미해결:
#     - RBAC(rbac-secret-access.yaml RoleBinding subjects 빈 값) — 이번 회신에 언급 없음,
#       mgmt 서버 서비스어카운트 바인딩 여부 별도 확인 필요.
#     - 위 자격증명은 서비스별 애플리케이션 계정으로 보임 — D-01/02/04/06/08/09/11/17/18/
#       20/21처럼 다른 계정 정보·시스템 테이블 조회가 필요한 항목은 관리자 권한이 없으면
#       조회 자체가 비거나 오류가 날 수 있음(거짓 PASS 위험). 실제 실행해서 확인 필요.
#
#   [2026-09-24 정정] member_db → user_db — total-k8s 최신본 확인 결과 실제 서비스는
#   user-service(user_db/user_user)이고 MySQL NetworkPolicy(shared-mysql-ingress)도
#   app=user-service를 허용함. 기존 member 표기는 저희 기준값 오류였음(dbms_service_accounts 참고).
#
#   ⚠ pod_label_selector — 2026-09-20 인프라팀 회신(트래킹표 5번)으로 확정:
#   MySQL(MOCO 오퍼레이터)은 `app.kubernetes.io/instance=shared-mysql`,
#   PostgreSQL(CNPG 오퍼레이터)은 `cnpg.io/cluster=shared-pg` — 기존 `app.kubernetes.io/
#   name=...`는 오퍼레이터가 실제로 붙이는 라벨 키와 달라 파드 조회가 항상 0건이었음.
# -----------------------------------------------------------------------------
dbms_connections:
  - service: user_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: auth_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: order_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: payment_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: product_db
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "product_db"
  - service: wms_db
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "wms_db"
  - service: scm_db
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "scm_db"
  - service: oms_db   # [2026-09-23] 인프라팀 확인 — 다른 PostgreSQL DB와 동일 네이밍 규칙
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "oms_db"

# -----------------------------------------------------------------------------
# DBMS 관리자(admin) 접속 정보 [2026-09-20 인프라팀 회신 — 트래킹표 1번]
#   [2026-09-24 재설계] DB 쿼리는 mgmt 서버 TCP 접속이 아니라 DB 파드 내부 클라이언트로
#   실행한다(roles/dbms_common/tasks/db_exec_prepare.yml 주석 참고) — 그래서 host/port와
#   서비스 앱 계정(dbms_connections[].secret_ref)은 더 이상 쓰지 않아 제거했고, 모든 쿼리를
#   아래 관리자 계정으로 실행한다.
#
#   ⚠ MySQL — [2026-09-24 보안팀 판단(사용자 확정)] 인프라팀이 점검용으로 발급한 DBA 관리
#   계정 dba_admin(Secret shared-mysql-dba-admin, 트래킹표 1번 답변)을 사용 — SUPER/GRANT
#   OPTION이 없는 최소 권한이고, Secret 조회 RBAC(db-admin-readers)도 이 Secret에 열려 있음.
#   (9/23 인프라팀이 검증한 moco-admin은 MOCO 내부 최고 권한 계정이라 점검용으로는 과하고,
#   그 Secret(moco-shared-mysql)은 RBAC 허용 목록에 없음.) 비밀번호는 90일마다 자동 교체되므로
#   매 실행 시 Secret에서 읽는다. 출처: total-k8s mysql-shared account-provisioning-job /
#   rbac-secret-access.yaml
#   PostgreSQL은 CNPG 파드 내부 로컬 소켓(peer 인증)으로 postgres(superuser) 접속이라 별도
#   관리자 Secret이 필요 없음 — 기존 가정값 shared-pg-superuser는 enableSuperuserAccess
#   미설정으로 실제로는 생성되지 않는 Secret이었음(total-k8s postgres-shared README).
# -----------------------------------------------------------------------------
dbms_admin_connections:
  mysql:
    namespace: backend
    secret_ref: "shared-mysql-dba-admin"
    secret_username: "dba_admin"
    secret_password_key: "password"

# =============================================================================
# 인증_인가(AUTHZ-XX, SVC-01) 기준값 [2026-09-16 신규 코드화]
#   대상 네임스페이스·서비스 라벨은 total-k8s의 k8s/backend/backend-ingress.yaml,
#   k8s/backend/oms|wms/deployment.yaml 실측 확인(app=oms-service/wms-service, backend
#   네임스페이스 단일 Ingress `total-backend-ingress`).
# =============================================================================
authz_backend_namespace: "backend"
authz_internal_path_prefix: "/internal"

# SVC-01 : 서비스 간 NetworkPolicy 화이트리스트 [2026-09-17 BE팀(재우) allow-list 회신 반영]
#   {caller, callee} 쌍의 목록. AUTHZ-09와 동일 원칙(대상 서비스별 허용 출발지 비교)으로
#   pair 단위 재설계 — roles/auth_authz/tasks/main.yml 참고. Auth의 jwks.json은 전
#   서비스(Auth 자신 제외)에 공개이므로 각 서비스→auth-service 쌍으로 전개.
# [2026-09-28] SVC-01 점검 대상 — 백엔드 서비스 전체(허용 목록에 호출자가 없는 wms·scm 등도 "다른 서비스
#   출발지 없음"이어야 PASS). 기존엔 허용 목록의 callee 6개만 점검했음.
svc01_target_services:
  - auth-service
  - user-service
  - order-service
  - payment-service
  - product-service
  - oms-service
  - wms-service
  - scm-service
svc01_allowed_service_calls:
  - { caller: "order-service",   callee: "oms-service" }
  - { caller: "product-service", callee: "order-service" }
  - { caller: "payment-service", callee: "order-service" }
  - { caller: "order-service",   callee: "payment-service" }
  - { caller: "order-service",   callee: "product-service" }
  - { caller: "order-service",   callee: "user-service" }
  - { caller: "auth-service",    callee: "user-service" }
  - { caller: "oms-service",     callee: "auth-service" }
  - { caller: "wms-service",     callee: "auth-service" }
  - { caller: "scm-service",     callee: "auth-service" }
  - { caller: "order-service",   callee: "auth-service" }
  - { caller: "payment-service", callee: "auth-service" }
  - { caller: "product-service", callee: "auth-service" }
  - { caller: "user-service",    callee: "auth-service" }

# AUTHZ-09 : WMS→OMS 반품검수 콜백 — 2026-09-17 BE팀 회신으로 기존 동기 API
#   (/internal/v1/oms/returns/{returnId}/inspection-result) 폐기 확인. wms.return.inspected
#   비동기 이벤트(RabbitMQ) 발행/구독 권한 점검으로 재설계(윤지수 승인).
#
# 2026-09-17 3차 회신으로 전부 확정:
#   - routing key는 "wms.return.inspected"(.v1 아님) 확정.
#   - Consumer는 OMS뿐 — Payment는 1차 회신의 오기였다고 정정 확인됨.
#   - 서비스별 RabbitMQ 계정 분리 **가능** — 각 서비스 application-prod.yml이 이미 계정
#     정보를 서비스 단위로 주입받는 구조라, 인프라팀이 WMS/OMS용 계정을 각각 만들어주면
#     분리됨(BE팀 확인).
#
# 2026-09-17 인프라팀 회신 — vhost 정정 + 판정 기준 확정:
#   - vhost는 "/"가 아니라 **"total-prod"**가 맞음(BE팀 최초 답변이 착오였음, 인프라↔BE
#     기존 협의문서 "RabbitMQ Application Credential" 기준 — 현재 공통 계정
#     `total-backend`가 이 vhost 안에서 Configure/Write/Read = `.*`(전권한) 보유 중인
#     상태가 바로 지금 분리 안 된 상태의 실체).
#   - 판정 기준(윤지수 확인): RabbitMQ의 configure/write/read 권한 기준으로 판정.
#     `wms.topic.exchange`가 이 이벤트 전용이면 topic permission(routing key 단위 제한)
#     불필요(exchange 단위 write/read만으로 충분), 공용 exchange라면 topic permission도
#     점검 범위에 포함 — 전용/공용 여부는 인프라팀·BE팀 확인 필요(트래킹표 참고).
#   - [2026-09-23] 계정 분리 완료 확인 — 인프라팀이 total-wms/total-oms 계정을 실제로
#     발급했고, 임시 점검 계정(authz09-audit)으로 Management API 권한 조회까지 수동
#     검증 완료(결과: WMS 정상, OMS topic 권한 미설정으로 FAIL — 이행점검 별도 추적,
#     이 자동화 리포트에는 반영 안 함, 위 SKIP 분기 주석 참고). 계정 분리 자체는
#     끝났으므로 authz09_shared_account_blocks_check는 false로 전환.
#   - 다만 mgmt 서버의 RabbitMQ Management API 상시 접근 경로는 여전히 구조적으로
#     불가 확정 상태(2026-09-22)라 authz09_rabbitmq_management_url/readonly_user_secret은
#     계속 null 유지 — authz09_info_missing이 true가 되어 자동으로 SKIP 분기로 감.
authz09_shared_account_blocks_check: false   # [2026-09-23] 계정 분리 완료 확인(인프라팀 회신) — false로 전환
authz09_rabbitmq_management_url: null        # 상시 접근 경로 구조적으로 불가 확정 — null 유지(SKIP 분기로 라우팅됨)
authz09_rabbitmq_readonly_user_secret: null  # 위와 동일 사유로 null 유지(임시 점검 계정은 1회성, 상시용 아님)
authz09_rabbitmq_vhost: "total-prod"              # 2026-09-17 인프라팀 정정 확정(BE팀 최초 답변 "/" 은 착오)
authz09_rabbitmq_exchange: "wms.topic.exchange"   # 2026-09-17 BE팀 확정, topic 타입
authz09_rabbitmq_routing_key: "wms.return.inspected"  # 2026-09-17 BE팀 확정
authz09_rabbitmq_exchange_dedicated: false  # 2026-09-22 BE팀 확정 — 범용 exchange 목적, 현재는 단일 이벤트만 연결 — routing key 단위 점검 필요
authz09_rabbitmq_oms_queue: "oms.wms-inspected.queue"  # 2026-09-22 BE팀 시퀀스 다이어그램(Notion) 근거 — 실배포 여부는 미확인, 대조 전제로만 반영
authz09_rabbitmq_publisher_allowed: ["wms-service"]
authz09_rabbitmq_consumer_allowed: ["oms-service"]    # 2026-09-17 BE팀 확정 — payment-service는 1차 회신 오기였음
# 2026-09-17 인프라팀 착수 확인(17-1) — WMS/OMS 계정을 실제로 분리하면 그 RabbitMQ
# 사용자명을 여기에 채울 것. 계정 생성 전까지는 null 유지(SKIP 사유 중 하나).
authz09_rabbitmq_publisher_user: null         # TODO: WMS 전용 RabbitMQ 계정명 — 인프라팀 확인 대기(17-1번)
authz09_rabbitmq_consumer_user: null          # TODO: OMS 전용 RabbitMQ 계정명 — 인프라팀 확인 대기(17-1번)
