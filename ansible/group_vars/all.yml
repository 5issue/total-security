---
# =============================================================================
# 인프라 점검 기준값 (group_vars/all.yml)
#   출처: 인프라점검_항목분류표_v0_3.xlsx "확정 기준값" 컬럼 + claude_code_handoff_spec.md 2.1절
#   상태 표시:
#     [확정] = 값 확정 완료, 바로 사용 가능
#     [TODO] = 외부 확인 필요, 값 채워질 때까지 해당 항목은 SKIP 처리됨
#             (로직은 전부 작성되어 있음 — 여기 값만 채우면 태스크 수정 없이 바로 동작)
#
#   ⚠ 이 파일은 실제 운영용이다 — 로컬 테스트용 임의값은 절대 여기 넣지 말고
#   `group_vars/test_values.yml`(테스트 전용, `-e @group_vars/test_values.yml`로만 로드됨)에 넣을 것.
# =============================================================================

# =============================================================================
# 서버(U-XX) 기준값
# =============================================================================

# -----------------------------------------------------------------------------
# U-02 : 패스워드 복잡도 [자동판정가능 — OS 표준 기준]
# -----------------------------------------------------------------------------
u02_pwquality:
  minlen: 8
  dcredit: -1
  ucredit: -1
  lcredit: -1
  ocredit: -1

# -----------------------------------------------------------------------------
# U-07 : 불필요한 계정 제거 [확정]
#   판정 로직: 블랙리스트 계정이 "존재" + "로그인 가능(shell 제한 없음 또는 잠금 해제)"
#              상태면 FAIL. 사람 계정 미사용 여부는 last 명령어로 별도 판정(90일 기준).
# -----------------------------------------------------------------------------
u07_unnecessary_accounts:
  - lp
  - uucp
  - nuucp
  - games
  - gopher
  - news
  - sync
u07_unused_login_days_threshold: 90

# -----------------------------------------------------------------------------
# U-08 : root 그룹 권한 제한 [확정 — 2026-09-13 인프라팀 재질의 회신]
#   GID 0(root 그룹) 인가 대상은 기본 root 계정 단일 확정 — 그 외 구성원 존재 시 FAIL.
# -----------------------------------------------------------------------------
u08_root_group_admin_whitelist: ["root"]

# -----------------------------------------------------------------------------
# U-12 : 세션 타임아웃 [자동판정가능]
# -----------------------------------------------------------------------------
u12_tmout_max_seconds: 600

# -----------------------------------------------------------------------------
# U-13 : 패스워드 해시 알고리즘 [자동판정가능]
# -----------------------------------------------------------------------------
u13_required_encrypt_method: "SHA512"

# -----------------------------------------------------------------------------
# U-16,18,19,20,21,22,27,29,37,67 : 주요 파일 권한 임계값 [자동판정가능 — KISA/OS 표준]
#   판정 로직: 실제 권한(8진수)이 기준값보다 넉넉하면(초과) FAIL. 소유자는 root 고정 기대.
# -----------------------------------------------------------------------------
u16_passwd_perm_max: "0644"      # /etc/passwd
u18_shadow_perm_max: "0400"      # /etc/shadow
u19_hosts_perm_max: "0644"       # /etc/hosts [2026-09-16 수정 — 원문 가이드 공식 기준은 644, 0600은 오기였음]
u20_xinetd_perm_max: "0600"      # /etc/xinetd.conf, /etc/xinetd.d/*
u21_syslog_perm_max: "0640"      # /etc/rsyslog.conf
u22_services_perm_max: "0644"    # /etc/services
u27_hosts_equiv_perm_max: "0600" # /etc/hosts.equiv, ~/.rhosts
u29_hosts_lpd_perm_max: "0600"   # /etc/hosts.lpd
u37_crontab_perm_max: "0640"     # /etc/crontab, /etc/cron.d/*
u67_log_perm_max: "0644"         # /var/log/* 로그 파일

# -----------------------------------------------------------------------------
# U-17 : 링크 파일 보호 [자동판정가능]
#   판정 로직: 아래 주요 파일들이 심볼릭 링크로 존재하면 FAIL(원본이어야 함).
# -----------------------------------------------------------------------------
u17_protected_files:
  - /etc/passwd
  - /etc/shadow
  - /etc/group
  - /etc/hosts
  - /etc/services
  - /etc/rsyslog.conf

# -----------------------------------------------------------------------------
# U-23 : SUID/SGID 설정 점검 [확정 — 파일럿 VM 실측 후 보정 권장]
#   판정 로직: 화이트리스트 밖의 SUID/SGID 파일 발견 시 FAIL
# -----------------------------------------------------------------------------
u23_allowed_suid_sgid:
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/passwd
  - /usr/bin/chsh
  - /usr/bin/chfn
  - /usr/bin/gpasswd
  - /usr/bin/newgrp
  - /usr/bin/mount
  - /usr/bin/umount
  - /usr/bin/pkexec
  - /usr/libexec/openssh/ssh-keysign   # Amazon Linux 2023 경로 (Ubuntu는 /usr/lib/openssh/ssh-keysign)
  - /usr/bin/at        # AL2023 표준 바이너리(at 패키지) — 2026-09-21 파일럿 실측 확인
  - /usr/bin/chage     # AL2023 표준 바이너리(shadow-utils) — 2026-09-21 파일럿 실측 확인
  - /usr/bin/write     # AL2023 표준 바이너리(util-linux) — 2026-09-21 파일럿 실측 확인
  - /usr/bin/screen    # AL2023 표준 바이너리(screen 패키지) — 2026-09-21 파일럿 실측 확인

# -----------------------------------------------------------------------------
# U-24 : 사용자 환경 파일 보호 [자동판정가능]
#   판정 로직: 홈 디렉터리 내 아래 파일 중 그룹/전체 쓰기 권한이 있으면 FAIL
# -----------------------------------------------------------------------------
u24_user_env_files:
  - .profile
  - .bashrc
  - .bash_profile
  - .bash_login
  - .bash_logout
  - .cshrc
  - .login
  - .exrc
  - .netrc

# -----------------------------------------------------------------------------
# U-25 : world writable 파일 점검 [자동판정가능]
#   판정 로직: 아래 제외 경로 밖에서 world-writable 파일이 1개라도 있으면 FAIL
# -----------------------------------------------------------------------------
u25_world_writable_exclude_dirs:
  - /proc
  - /sys
  - /dev
  - /tmp
  - /var/tmp
  - /dev/shm
  - /run
  - /var/lib/kubelet/pods   # [2026-09-23] 컨테이너 런타임이 만드는 로그/소켓 파일 — 호스트
  - /var/lib/containerd     # 취약점 아님(2차 점검 결과 전수 확인, 전부 이 두 경로였음)

# -----------------------------------------------------------------------------
# U-26 : 중요 디바이스 파일 보호 [확정 — 2026-09-22 인프라팀 원본 스냅샷 수신]
#   판정 로직: 정상 노드(ip-10-0-16-179) /dev 문자·블록 디바이스 노드 재귀 스냅샷과
#   diff. mqueue/shm 하위는 제외(find로 재귀 조회, roles/file_permission/tasks/main.yml
#   참고). u26_dev_baseline_snapshot 이 비어있으면 이 항목은 SKIP.
# -----------------------------------------------------------------------------
u26_dev_baseline_snapshot:
  - "/dev/autofs"
  - "/dev/btrfs-control"
  - "/dev/console"
  - "/dev/cpu_dma_latency"
  - "/dev/cuse"
  - "/dev/dma_heap/system"
  - "/dev/full"
  - "/dev/fuse"
  - "/dev/gpiochip0"
  - "/dev/input/event0"
  - "/dev/input/event1"
  - "/dev/kmsg"
  - "/dev/loop-control"
  - "/dev/mapper/control"
  - "/dev/net/tun"
  - "/dev/ng0n1"
  - "/dev/ng1n1"
  - "/dev/null"
  - "/dev/nvme0"
  - "/dev/nvme1"
  - "/dev/ppp"
  - "/dev/ptmx"
  - "/dev/pts/0"
  - "/dev/pts/1"
  - "/dev/pts/ptmx"
  - "/dev/random"
  - "/dev/rtc0"
  - "/dev/snapshot"
  - "/dev/tty"
  - "/dev/tty0"
  - "/dev/tty1"
  - "/dev/tty10"
  - "/dev/tty11"
  - "/dev/tty12"
  - "/dev/tty13"
  - "/dev/tty14"
  - "/dev/tty15"
  - "/dev/tty16"
  - "/dev/tty17"
  - "/dev/tty18"
  - "/dev/tty19"
  - "/dev/tty2"
  - "/dev/tty20"
  - "/dev/tty21"
  - "/dev/tty22"
  - "/dev/tty23"
  - "/dev/tty24"
  - "/dev/tty25"
  - "/dev/tty26"
  - "/dev/tty27"
  - "/dev/tty28"
  - "/dev/tty29"
  - "/dev/tty3"
  - "/dev/tty30"
  - "/dev/tty31"
  - "/dev/tty32"
  - "/dev/tty33"
  - "/dev/tty34"
  - "/dev/tty35"
  - "/dev/tty36"
  - "/dev/tty37"
  - "/dev/tty38"
  - "/dev/tty39"
  - "/dev/tty4"
  - "/dev/tty40"
  - "/dev/tty41"
  - "/dev/tty42"
  - "/dev/tty43"
  - "/dev/tty44"
  - "/dev/tty45"
  - "/dev/tty46"
  - "/dev/tty47"
  - "/dev/tty48"
  - "/dev/tty49"
  - "/dev/tty5"
  - "/dev/tty50"
  - "/dev/tty51"
  - "/dev/tty52"
  - "/dev/tty53"
  - "/dev/tty54"
  - "/dev/tty55"
  - "/dev/tty56"
  - "/dev/tty57"
  - "/dev/tty58"
  - "/dev/tty59"
  - "/dev/tty6"
  - "/dev/tty60"
  - "/dev/tty61"
  - "/dev/tty62"
  - "/dev/tty63"
  - "/dev/tty7"
  - "/dev/tty8"
  - "/dev/tty9"
  - "/dev/ttyS0"
  - "/dev/ttyS1"
  - "/dev/ttyS2"
  - "/dev/ttyS3"
  - "/dev/uhid"
  - "/dev/uinput"
  - "/dev/urandom"
  - "/dev/userfaultfd"
  - "/dev/vcs"
