---
# =============================================================================
# u66_check.yml — U-66(정책에 따른 시스템 로깅 설정) 점검
#   [2026-09-13 인프라팀 노션 회신] 실제 구현은 ALB 액세스로그용 S3 버킷 하나뿐이고,
#   SSM 세션로그·sudo로그·DB 감사로그는 별도 로그그룹/버킷 전송 자체가 안 되어 있음이
#   확인됨 — "기준값 미확정"이 아니라 "미구현 상태 확인"이므로 SKIP이 아니라 FAIL로
#   판정하는 게 정상이다(버그 아님, 인프라팀 구현 예정).
#   u66_missing_log_categories 가 비어있지 않은 동안은 AWS 조회 없이 바로 FAIL 처리하고,
#   인프라팀이 실제 로그그룹을 만들어 이 리스트가 빈 배열이 되면 log_retention_check.yml
#   (기존 로그그룹 존재·보관기간 조회 공용 태스크)로 자동 전환된다.
# =============================================================================

- name: "U-66 | 미구현 로그 항목 존재 시 FAIL(의도된 결과, 버그 아님)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-66', 'item': '정책에 따른 시스템 로깅 설정', 'target': '전체(CloudWatch 로그그룹)',
      'status': 'FAIL',
      'detail': '미구현 확인된 필수 로그: ' ~ (u66_missing_log_categories | join(', ')) ~
                ' — 현재 ALB 액세스로그용 S3 버킷만 구현됨(인프라팀 구현 예정, 2026-09-13 확인. 조치 필요 항목으로 보고)'
    }] }}"
  when: u66_missing_log_categories | default([]) | length > 0
  run_once: true

- name: "U-66 | 로그그룹 보관기간 점검(인프라팀 구현 완료 후 전환) — mgmt 서버 AWS API 조회"
  ansible.builtin.include_role:
    name: log_patch_check
    tasks_from: log_retention_check
  vars:
    lrc_item_id: "U-66"
    lrc_item_name: "정책에 따른 시스템 로깅 설정"
    lrc_log_group_name: "{{ u66_log_group_name }}"
    lrc_target: "전체(CloudWatch 로그그룹)"
    lrc_min_days: "{{ u66_log_retention_min_days | default(365) }}"
  when: u66_missing_log_categories | default([]) | length == 0
  run_once: true
