---
# =============================================================================
# k8s_pod_checks.yml — D-07(non-root 구동), D-14(설정파일 권한), D-10(원격 접속 제한) 파드/K8s 리소스 점검
#   MOCO(MySQL)/CNPG(PostgreSQL) 오퍼레이터 기반 파드 구성 확인됨(spec 2.3절).
#   "운영 중인 DB 파드 내부 쉘 직접 실행 지양" 요청에 맞춰 kubernetes.core.k8s_info
#   (파드 spec 조회, 쉘 진입 없음)를 우선 사용한다. k8s_info 만으로 판정이 불가능한
#   경우에만 k8s_exec 로 `stat` 단일 명령을 실행한다(대화형 쉘 세션 아님).
#   D-10은 2026-09-09 인프라팀 확인으로 IP 허용목록이 아니라 NetworkPolicy(라벨 기반
#   Pod 접근 제한) 방식으로 변경됨 — 대상 파드에 적용되는 NetworkPolicy를 조회한다.
#   requirements.yml 의 kubernetes.core 컬렉션 필요.
# =============================================================================

- name: "{{ db_conn.service }} | D-07/14/10 네임스페이스·라벨셀렉터 확정 여부 확인"
  ansible.builtin.set_fact:
    k8s_pod_target_ready: "{{ db_conn.namespace is defined and db_conn.namespace is not none and db_conn.pod_label_selector is defined and db_conn.pod_label_selector is not none }}"

- name: "{{ db_conn.service }} | D-07/14/10 SKIP 처리(네임스페이스·라벨셀렉터 미확정)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [
      {'id': 'D-07', 'item': 'root 권한으로 서비스 구동 제한', 'target': db_conn.service, 'status': 'SKIP',
       'detail': 'group_vars의 dbms_connections[].namespace/pod_label_selector 미설정 — 파드 조회 불가'},
      {'id': 'D-14', 'item': '주요 설정·비밀번호 파일 접근 권한', 'target': db_conn.service, 'status': 'SKIP',
       'detail': 'group_vars의 dbms_connections[].namespace/pod_label_selector 미설정 — 파드 조회 불가'},
      {'id': 'D-10', 'item': '원격 DB 서버 접속 제한', 'target': db_conn.service, 'status': 'SKIP',
       'detail': 'group_vars의 dbms_connections[].namespace/pod_label_selector 미설정 — NetworkPolicy 대상 파드 특정 불가'}
    ] }}"
  when: not k8s_pod_target_ready

# -----------------------------------------------------------------------------
# 파드 spec 조회 (쉘 진입 없음)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | 대상 파드 spec 조회"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ db_conn.namespace }}"
    label_selectors:
      - "{{ db_conn.pod_label_selector }}"
  register: k8s_pods_raw
  failed_when: false
  when: k8s_pod_target_ready

- name: "{{ db_conn.service }} | 조회된 파드 없음 처리"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [
      {'id': 'D-07', 'item': 'root 권한으로 서비스 구동 제한', 'target': db_conn.service, 'status': 'SKIP',
       'detail': '라벨셀렉터(' ~ db_conn.pod_label_selector ~ ')로 조회된 파드 없음 — DB 미구축 또는 라벨 불일치'},
      {'id': 'D-14', 'item': '주요 설정·비밀번호 파일 접근 권한', 'target': db_conn.service, 'status': 'SKIP',
       'detail': '라벨셀렉터(' ~ db_conn.pod_label_selector ~ ')로 조회된 파드 없음 — DB 미구축 또는 라벨 불일치'},
      {'id': 'D-10', 'item': '원격 DB 서버 접속 제한', 'target': db_conn.service, 'status': 'SKIP',
       'detail': '라벨셀렉터(' ~ db_conn.pod_label_selector ~ ')로 조회된 파드 없음 — DB 미구축 또는 라벨 불일치'}
    ] }}"
  when: k8s_pod_target_ready and (k8s_pods_raw.resources is not defined or k8s_pods_raw.resources | length == 0)

# -----------------------------------------------------------------------------
# D-07 | non-root 구동 — pod/container securityContext.runAsUser, runAsNonRoot 조회
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-07 판정 기록"
  vars:
    k8s_pod: "{{ k8s_pods_raw.resources[0] }}"
    d07_pod_run_as_nonroot: "{{ k8s_pod.spec.securityContext.runAsNonRoot | default(none) }}"
    d07_pod_run_as_user: "{{ k8s_pod.spec.securityContext.runAsUser | default(none) }}"
    d07_container_run_as_user: "{{ k8s_pod.spec.containers[0].securityContext.runAsUser | default(none) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-07', 'item': 'root 권한으로 서비스 구동 제한', 'target': db_conn.service,
      'status': (
        'PASS' if (d07_pod_run_as_nonroot == true or (d07_pod_run_as_user is not none and d07_pod_run_as_user | int != 0) or (d07_container_run_as_user is not none and d07_container_run_as_user | int != 0))
        else ('FAIL' if (d07_pod_run_as_user is not none and d07_pod_run_as_user | int == 0) or (d07_container_run_as_user is not none and d07_container_run_as_user | int == 0)
              else 'REVIEW')
      ),
      'detail': 'pod.securityContext.runAsNonRoot=' ~ (d07_pod_run_as_nonroot | string) ~
                ', runAsUser(pod)=' ~ (d07_pod_run_as_user | string) ~
                ', runAsUser(container)=' ~ (d07_container_run_as_user | string) ~
                (' — securityContext 미설정 시 이미지 기본 USER 지시자 수동 확인 필요' if (d07_pod_run_as_nonroot is none and d07_pod_run_as_user is none and d07_container_run_as_user is none) else '')
    }] }}"
  when: k8s_pod_target_ready and (k8s_pods_raw.resources | default([]) | length > 0)

# -----------------------------------------------------------------------------
# D-14 | 설정·비밀번호 파일 접근 권한 — ConfigMap/Secret 볼륨 defaultMode 조회
#   secret/configMap 볼륨의 defaultMode(8진수, 예: 0400)가 기준보다 넉넉하면 FAIL.
#   defaultMode 미설정 시 k8s 기본값(Secret=0644, ConfigMap=0644)이 적용되므로
#   명시적으로 더 제한적인 값(0440 이하)이 설정되어 있어야 PASS로 판정한다.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-14 판정 기록"
  vars:
    k8s_pod: "{{ k8s_pods_raw.resources[0] }}"
    d14_secret_volumes: "{{ k8s_pod.spec.volumes | default([]) | selectattr('secret', 'defined') | list }}"
    d14_configmap_volumes: "{{ k8s_pod.spec.volumes | default([]) | selectattr('configMap', 'defined') | list }}"
    d14_loose_secret: "{{ d14_secret_volumes | selectattr('secret.defaultMode', 'defined') | selectattr('secret.defaultMode', 'gt', 288) | list }}"
    d14_loose_configmap: "{{ d14_configmap_volumes | selectattr('configMap.defaultMode', 'defined') | selectattr('configMap.defaultMode', 'gt', 288) | list }}"
    d14_unset_mode: "{{ (d14_secret_volumes | rejectattr('secret.defaultMode', 'defined') | list) + (d14_configmap_volumes | rejectattr('configMap.defaultMode', 'defined') | list) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-14', 'item': '주요 설정·비밀번호 파일 접근 권한', 'target': db_conn.service,
      'status': (
        'FAIL' if (d14_loose_secret | length > 0 or d14_loose_configmap | length > 0 or d14_unset_mode | length > 0)
        else ('PASS' if (d14_secret_volumes | length > 0 or d14_configmap_volumes | length > 0) else 'REVIEW')
      ),
      'detail': (
        'Secret/ConfigMap 볼륨 없음 — 설정파일 마운트 방식 수동 확인 필요' if (d14_secret_volumes | length == 0 and d14_configmap_volumes | length == 0)
        else 'defaultMode 미설정(k8s 기본값 0644 적용) 볼륨: ' ~ (d14_unset_mode | map(attribute='name') | join(', ') if d14_unset_mode | length > 0 else '없음') ~
             ' / 0440 초과 완화 설정 볼륨: ' ~ ((d14_loose_secret + d14_loose_configmap) | map(attribute='name') | join(', ') if (d14_loose_secret | length > 0 or d14_loose_configmap | length > 0) else '없음')
      )
    }] }}"
  when: k8s_pod_target_ready and (k8s_pods_raw.resources | default([]) | length > 0)

# -----------------------------------------------------------------------------
# D-10 | 원격 DB 서버 접속 제한 — 2026-09-09 인프라팀 확인으로 IP 허용목록이 아니라
#   NetworkPolicy(라벨 기반 Pod 접근 제한) 방식으로 변경(spec 2.3절). 대상 파드에
#   적용되는(podSelector가 파드 라벨의 부분집합인) NetworkPolicy를 찾아,
#   group_vars의 d10_allowed_np_label 이:
#     - 미확정(null) 이면 존재 여부·podSelector 제한 여부까지만 확인해 REVIEW
#     - 확정되면 해당 라벨로 ingress를 제한하는 NetworkPolicy 존재 여부로 PASS/FAIL
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-10 네임스페이스 내 NetworkPolicy 전체 조회"
  kubernetes.core.k8s_info:
    kind: NetworkPolicy
    namespace: "{{ db_conn.namespace }}"
  register: d10_netpols_raw
  failed_when: false
  when: k8s_pod_target_ready and (k8s_pods_raw.resources | default([]) | length > 0)

# Jinja2는 파이썬 리스트 컴프리헨션([x for x in y if ...])을 지원하지 않아 loop로 필터링한다.
# podSelector.matchLabels(미설정 시 {} = 네임스페이스 전체 대상)가 파드 라벨의 부분집합이면 "적용됨"
# (combine으로 병합했을 때 원래 파드 라벨과 그대로면 matchLabels의 모든 키·값이 이미 존재한다는 뜻)
- name: "{{ db_conn.service }} | D-10 파드 라벨/조회된 NetworkPolicy 준비"
  vars:
    k8s_pod: "{{ k8s_pods_raw.resources[0] }}"
  ansible.builtin.set_fact:
    d10_pod_labels: "{{ k8s_pod.metadata.labels | default({}) }}"
    d10_all_netpols: "{{ d10_netpols_raw.resources | default([]) }}"
    d10_applying_np: []
  when: k8s_pod_target_ready and (k8s_pods_raw.resources | default([]) | length > 0)

- name: "{{ db_conn.service }} | D-10 대상 파드에 적용되는 NetworkPolicy 판별"
  ansible.builtin.set_fact:
    d10_applying_np: "{{ d10_applying_np + [item] }}"
  loop: "{{ d10_all_netpols | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name | default('?') }}"
  when: >-
    k8s_pod_target_ready and (k8s_pods_raw.resources | default([]) | length > 0)
    and (d10_pod_labels | combine(item.spec.podSelector.matchLabels | default({}))) == d10_pod_labels

- name: "{{ db_conn.service }} | D-10 판정 기록"
  vars:
    d10_np_with_restriction: "{{ d10_applying_np | selectattr('spec.podSelector.matchLabels', 'defined') | list }}"
    d10_allow_from_labels: "{{ d10_applying_np
                                | map(attribute='spec.ingress') | select('defined') | list | sum(start=[])
                                | map(attribute='from') | select('defined') | list | sum(start=[])
                                | map(attribute='podSelector.matchLabels') | select('defined') | list }}"
    d10_label_matched: "{{ d10_allowed_np_label is not none and ({d10_allowed_np_label.key: d10_allowed_np_label.value} in d10_allow_from_labels) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-10', 'item': '원격 DB 서버 접속 제한', 'target': db_conn.service,
      'status': (
        'REVIEW' if d10_allowed_np_label is none else ('PASS' if d10_label_matched else 'FAIL')
      ),
      'detail': (
        '대상 파드에 적용되는 NetworkPolicy ' ~ (d10_applying_np | length | string) ~ '개(그중 podSelector로 대상 제한된 것 '
        ~ (d10_np_with_restriction | length | string) ~ '개)'
        ~ (' — group_vars의 d10_allowed_np_label 확정 후 PASS/FAIL 전환 예정' if d10_allowed_np_label is none
           else (' — 허용 라벨(' ~ d10_allowed_np_label.key ~ '=' ~ d10_allowed_np_label.value ~ ') 기준 ingress 제한 '
                 ~ (d10_label_matched | ternary('확인됨', '없음(절대기준 위반)')))
        )
      )
    }] }}"
  when: k8s_pod_target_ready and (k8s_pods_raw.resources | default([]) | length > 0)
