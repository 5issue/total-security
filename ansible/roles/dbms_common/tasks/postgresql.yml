---
# =============================================================================
# PostgreSQL 대상 D-XX 점검 — community.postgresql 컬렉션 필요
#   자격증명은 K8s Secret(secret_ref)에서 조회하는 것을 전제로 함.
#   결과 dict 공통 스키마: {id, item, status, detail, target}
#     target = db_conn.service (항목명 자체는 분류표 원문 그대로 유지)
# =============================================================================

- name: "{{ db_conn.service }} | 자격증명 기본값 설정"
  # ⚠ K8s Secret lookup이 RBAC 미설정 등으로 실패하면 아래 조회 태스크가 ignore_errors로
  # 넘어가더라도 pg_login_user/password가 undefined로 남아 이후 모든 태스크가 템플릿
  # 오류로 중단된다(failed_when으로 못 막는 종류의 실패). 빈 문자열을 먼저 깔아둬서
  # 조회 실패 시에도 DB 연결 자체만 자격증명 오류로 실패(failed_when: false로 처리됨)하고
  # 나머지 커넥션·플레이는 계속 진행되게 한다.
  ansible.builtin.set_fact:
    pg_login_user: ""
    pg_login_password: ""
    pg_admin_user: ""
    pg_admin_password: ""

- name: "{{ db_conn.service }} | K8s Secret에서 자격증명 조회"
  ansible.builtin.set_fact:
    pg_login_user: "{{ lookup('kubernetes.core.k8s', kind='Secret', name=db_conn.secret_ref, namespace=db_conn.namespace | default('default')) | json_query('data.username') | b64decode }}"
    pg_login_password: "{{ lookup('kubernetes.core.k8s', kind='Secret', name=db_conn.secret_ref, namespace=db_conn.namespace | default('default')) | json_query('data.password') | b64decode }}"
  when: db_conn.secret_ref is not none
  ignore_errors: true

- name: "{{ db_conn.service }} | K8s Secret에서 관리자(admin) 자격증명 조회"
  # 2026-09-20 인프라팀 회신(트래킹표 1번) — D-01/02/04/06/08/11/18/20/21은 pg_catalog 전체
  # Role/Object를 봐야 해서 위 서비스 앱 계정 대신 이 admin(superuser) 계정으로 조회한다.
  # group_vars/all.yml의 dbms_admin_connections.postgresql 주석 참고 — 기존 서비스별 Secret과
  # 동일한 CNPG basic-auth 포맷(username/password 키)으로 가정.
  ansible.builtin.set_fact:
    pg_admin_user: "{{ lookup('kubernetes.core.k8s', kind='Secret', name=dbms_admin_connections.postgresql.secret_ref, namespace=dbms_admin_connections.postgresql.namespace | default('default')) | json_query('data.username') | b64decode }}"
    pg_admin_password: "{{ lookup('kubernetes.core.k8s', kind='Secret', name=dbms_admin_connections.postgresql.secret_ref, namespace=dbms_admin_connections.postgresql.namespace | default('default')) | json_query('data.password') | b64decode }}"
  when: dbms_admin_connections.postgresql.secret_ref is not none
  ignore_errors: true

# -----------------------------------------------------------------------------
# D-01 | 기본 계정(postgres) 잠금 상태 [2026-09-23 재작성]
#   원문 판단기준은 "초기 비밀번호를 변경했거나(OR) 잠금설정한 경우" 양호 — 두 조건 중
#   하나만 만족해도 된다. "비밀번호 변경 여부"는 해시만 저장돼 원본 대조가 원천 불가하지만,
#   "잠금 여부"는 rolcanlogin으로 MySQL의 account_locked와 동일하게 자동판정 가능하다.
#   기존엔 전자가 불가하다는 이유로 후자까지 통째로 SKIP 처리했으나(쿼리는 이미 하면서
#   판정엔 안 씀), OR 조건이라 잠금돼 있으면 그 자체로 양호가 확정된다 — MySQL D-01과
#   동일 원칙(잠금 여부만으로 판정, 비밀번호 변경 검증 불가는 두 엔진 다 동일한 한계)으로
#   SKIP을 PASS/FAIL 실측으로 전환.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-01 postgres 계정 잠금 상태 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: "SELECT rolcanlogin FROM pg_roles WHERE rolname='postgres'"
  register: d01_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-01 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-01', 'item': '기본 계정의 비밀번호, 정책 등을 변경하여 사용', 'target': db_conn.service,
      'status': 'PASS' if (d01_raw.query_result is defined and d01_raw.query_result[0].rolcanlogin == false) else 'FAIL',
      'detail': '조회 실패' if d01_raw.query_result is not defined else ('rolcanlogin=' ~ d01_raw.query_result[0].rolcanlogin ~ ' (false=잠금 — 양호). 비밀번호 변경 여부는 해시 저장 구조상 1회성 점검 불가라 잠금 여부만으로 판정(MySQL account_locked와 동일 원칙)')
    }] }}"

# -----------------------------------------------------------------------------
# D-02 | 불필요 계정 제거 [확정 — 2026-09-13 인프라팀 노션 회신]
#   d02_unnecessary_account_whitelist(8개 서비스 계정) 외 계정 존재 시 FAIL(postgres는 쿼리에서 제외됨)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-02 전체 Role 목록 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: "SELECT rolname FROM pg_roles WHERE rolname NOT LIKE 'pg\\_%' AND rolname != 'postgres'"
  register: d02_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-02 판정 기록"
  vars:
    d02_query_ok: "{{ d02_raw.query_result is defined }}"
    d02_accounts: "{{ d02_raw.query_result | default([]) | map(attribute='rolname') | list }}"
    d02_unauthorized: "{{ d02_accounts | difference(d02_unnecessary_account_whitelist | default([])) if d02_unnecessary_account_whitelist else [] }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-02', 'item': '데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용', 'target': db_conn.service,
      'status': 'SKIP' if d02_unnecessary_account_whitelist is none else ('PASS' if (d02_query_ok and d02_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        '전체 Role 목록(화이트리스트 TODO, 참고용): ' ~ (d02_accounts | join(', ') if d02_accounts | length > 0 else '없음') if d02_unnecessary_account_whitelist is none
        else ('조회 실패' if not d02_query_ok else '화이트리스트 외 계정: ' ~ (d02_unauthorized | join(', ') if d02_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-03 | 비밀번호 사용기간·복잡도 [법적 근거 있는 기준 — 2026-09-22 재정리]
#   서비스 계정은 자동 로테이션 없이 강제 만료 시 장애 위험이 커 실제 미적용 상태 —
#   예외 처리(N/A) 없이 FAIL로 정직하게 보고한다. 대신 이 정책 전용 유저 계정을
#   인프라팀이 신규 생성하기로 확정 — 계정명은 group_vars/all.yml의
#   d03_user_accounts.postgresql, 아직 비어있으면(미생성) 이것도 FAIL.
#   PostgreSQL은 rolvaliduntil(만료일시)만 네이티브 지원 — passwordcheck 확장(복잡도)
#   설치 + 계정별 rolvaliduntil이 기준일수 이내로 설정돼 있는지로 판정한다.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-03 판정 기록(서비스 계정 — 법정 기준 미적용)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-03', 'item': '비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정', 'target': db_conn.service,
      'status': 'FAIL',
      'detail': '서비스 계정에 비밀번호 만료(90일)·복잡도 정책 미적용 — 자동 로테이션 없이 강제 만료 시 서비스 장애 위험(DBA 협의). 법적 근거 있는 기준이라 예외 처리하지 않고 미준수로 보고. 전용 유저 계정에는 이 정책을 적용 중(아래 별도 행 참고)'
    }] }}"

- name: "D-03 | passwordcheck 확장·전용 유저 계정 만료 조회(PostgreSQL, 최초 커넥션에서 1회)"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: "SELECT extname FROM pg_extension WHERE extname='passwordcheck'"
  register: d03_ext_raw
  failed_when: false
  when: >
    d03_user_accounts.postgresql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0)

- name: "D-03 | 전용 유저 계정 rolvaliduntil 조회(PostgreSQL, 최초 커넥션에서 1회)"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: >-
      SELECT rolname, rolvaliduntil,
        (rolvaliduntil IS NOT NULL AND rolvaliduntil <= now() + interval '{{ d03_password_max_days }} days') AS within_policy
      FROM pg_roles
  register: d03_user_raw
  failed_when: false
  when: >
    d03_user_accounts.postgresql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0)

- name: "D-03 | 전용 유저 계정 판정 기록(PostgreSQL, 최초 커넥션에서 1회)"
  vars:
    d03_query_ok: "{{ d03_user_raw is defined and d03_user_raw.query_result is defined and d03_ext_raw is defined and d03_ext_raw.query_result is defined }}"
    d03_ext_installed: "{{ d03_query_ok and (d03_ext_raw.query_result | length > 0) }}"
    d03_all_roles: "{{ d03_user_raw.query_result | default([]) if d03_query_ok else [] }}"
    d03_found: "{{ d03_all_roles | selectattr('rolname', 'in', d03_user_accounts.postgresql) | list }}"
    d03_missing: "{{ d03_user_accounts.postgresql | difference(d03_found | map(attribute='rolname') | list) }}"
    d03_expiry_ok: "{{ (d03_found | selectattr('within_policy', 'equalto', true) | list | length) == d03_found | length }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-03', 'item': '비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정', 'target': '전체(PostgreSQL 유저 계정)',
      'status': (
        'FAIL' if d03_user_accounts.postgresql | length == 0 else
        ('FAIL' if not d03_query_ok else
         ('FAIL' if (d03_missing | length > 0 or not d03_expiry_ok or not d03_ext_installed) else 'PASS'))
      ),
      'detail': (
        '전용 유저 계정 미생성 — 인프라팀 구현 대기(서비스 계정만 존재, 정책 적용대상 계정 없음)' if d03_user_accounts.postgresql | length == 0
        else ('조회 실패' if not d03_query_ok
        else ('계정 미발견: ' ~ (d03_missing | join(', ')) if d03_missing | length > 0
        else 'passwordcheck 확장 설치=' ~ (d03_ext_installed | string) ~ ', rolvaliduntil(기준 <= ' ~ d03_password_max_days ~ '일 이내)=' ~ (d03_expiry_ok | string)))
      )
    }] }}"
  when: check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0

# -----------------------------------------------------------------------------
# D-04 | 관리자 권한 최소 인원 [확정 — 2026-09-13 인프라팀 노션 회신]
#   postgres는 이미 쿼리에서 제외됨 — 화이트리스트(d04_admin_account_whitelist)는 빈 리스트라
#   그 외 SUPERUSER 보유 Role이 하나라도 조회되면 FAIL.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-04 SUPERUSER 보유 Role 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: "SELECT rolname FROM pg_roles WHERE rolsuper=true AND rolname != 'postgres'"
  register: d04_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-04 판정 기록"
  vars:
    d04_query_ok: "{{ d04_raw.query_result is defined }}"
    d04_admins: "{{ d04_raw.query_result | default([]) | map(attribute='rolname') | list }}"
    d04_unauthorized: "{{ d04_admins | difference(d04_admin_account_whitelist | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-04', 'item': '데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용', 'target': db_conn.service,
      'status': 'SKIP' if d04_admin_account_whitelist is none else ('PASS' if (d04_query_ok and d04_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        'SUPERUSER 보유 Role(화이트리스트 TODO, 참고용): ' ~ (d04_admins | join(', ') if d04_admins | length > 0 else '없음') if d04_admin_account_whitelist is none
        else ('조회 실패' if not d04_query_ok else '화이트리스트 외 관리자 Role: ' ~ (d04_unauthorized | join(', ') if d04_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-05 | 비밀번호 재사용 제한 — 원문 대상에 PostgreSQL 미기재, 네이티브 미지원
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-05 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-05', 'item': '비밀번호 재사용에 대한 제약 설정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': '원문 대상 미기재 + PostgreSQL 네이티브 미지원(재사용 이력 자체를 저장하지 않음) — 해당없음'
    }] }}"

# -----------------------------------------------------------------------------
# D-06 | 계정 개별 부여(공용 계정 금지) [확정 — 2026-09-13 인프라팀 노션 회신]
#   postgres는 이미 쿼리에서 제외됨(관리자 목적 정당한 공용계정). 그 외 로그인 가능
#   Role은 dbms_service_accounts에서 이 커넥션(db_conn.service)에 매핑된 계정 "단 하나"
#   여야 하며, 그 외 계정이 조회되면 공용/교차사용으로 간주해 FAIL.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-06 로그인 가능 Role 목록 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: "SELECT rolname FROM pg_roles WHERE rolcanlogin=true AND rolname != 'postgres'"
  register: d06_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-06 판정 기록"
  vars:
    d06_query_ok: "{{ d06_raw.query_result is defined }}"
    d06_users: "{{ d06_raw.query_result | default([]) | map(attribute='rolname') | list }}"
    d06_expected: "{{ dbms_service_accounts | selectattr('database', 'equalto', db_conn.service) | map(attribute='account') | list }}"
    d06_unexpected: "{{ d06_users | difference(d06_expected) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-06', 'item': 'DB 사용자 계정을 개별적으로 부여하여 사용', 'target': db_conn.service,
      'status': (
        'REVIEW' if d06_expected | length == 0 else ('PASS' if (d06_query_ok and d06_unexpected | length == 0) else 'FAIL')
      ),
      'detail': (
        'dbms_service_accounts에 이 DB(' ~ db_conn.service ~ ')에 매핑된 계정 없음 — group_vars 매핑 확인 필요. 전체 Role: ' ~ (d06_users | join(', ') if d06_users | length > 0 else '없음') if d06_expected | length == 0
        else ('조회 실패' if not d06_query_ok else '기대 계정(' ~ (d06_expected | join(', ')) ~ ') 외 Role 발견: ' ~ (d06_unexpected | join(', ') if d06_unexpected | length > 0 else '없음'))
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-08 | 안전한 암호화 알고리즘 사용 (scram-sha-256)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-08 password_encryption 설정 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: "SHOW password_encryption"
  register: d08_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-08 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-08', 'item': '안전한 암호화 알고리즘 사용', 'target': db_conn.service,
      'status': 'PASS' if (d08_raw.query_result is defined and 'scram-sha-256' in (d08_raw.query_result[0].values() | first)) else 'FAIL',
      'detail': d08_raw.query_result | default('조회 실패') | string | truncate(150)
    }] }}"

# -----------------------------------------------------------------------------
# D-09 | 로그인 실패 잠금 — PostgreSQL 네이티브 미지원(원문·검증 완료)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-09 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-09', 'item': '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': 'PostgreSQL 네이티브 미지원 — connection pooler/외부 도구 필요(추가 설계 시 재검토)'
    }] }}"

# D-10(원격 DB 서버 접속 제한)은 2026-09-09 인프라팀 확인으로 IP 허용목록이 아니라
# K8s NetworkPolicy 기반으로 변경됨 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고(spec 2.3절).

# -----------------------------------------------------------------------------
# D-11 | 시스템 테이블(pg_catalog) 접근 제한
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-11 pg_catalog PUBLIC 권한 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: postgres
    query: >-
      SELECT grantee, table_name FROM information_schema.table_privileges
      WHERE table_schema='pg_catalog' AND grantee='PUBLIC' AND privilege_type != 'SELECT'
      AND NOT (table_name='pg_settings' AND privilege_type='UPDATE')
    # pg_catalog는 모든 DB에 동일하게 존재하는 시스템 스키마라 db: postgres 고정 조회로 충분(의도적)
    # pg_settings에 대한 PUBLIC UPDATE는 PostgreSQL 기본 동작(SET과 동등한 세션 설정 변경 허용)이라 예외처리
  register: d11_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-11 판정 기록"
  vars:
    d11_extra: "{{ d11_raw.query_result | default([]) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-11', 'item': '시스템 테이블 접근 제한', 'target': db_conn.service,
      'status': 'PASS' if (d11_raw.query_result is defined and d11_extra | length == 0) else 'FAIL',
      'detail': '조회 실패' if d11_raw.query_result is not defined else ('PUBLIC 과다 권한: ' ~ (d11_extra | string | truncate(150) if d11_extra | length > 0 else '없음'))
    }] }}"

# -----------------------------------------------------------------------------
# D-17 | Audit Table 접근 제한 — pgAudit 확장 로드 여부로 직접 판정(존재 여부를 별도로
#   묻지 않고, 미구현이면 그대로 FAIL). [2026-09-22] D-26 확인으로 DB 감사로그 파이프라인
#   자체가 없는 게 확정돼, 별도 "Audit Table" 위치 확인·GRANT 조회 로직으로 교체할
#   계획은 접음 — 이 pgAudit 로드 여부 판정을 최종 형태로 유지한다.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-17 shared_preload_libraries 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_login_user }}"
    login_password: "{{ pg_login_password }}"
    db: postgres
    query: "SHOW shared_preload_libraries"
  register: d17_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-17 판정 기록"
  vars:
    d17_libs: "{{ (d17_raw.query_result[0].values() | first) if d17_raw.query_result is defined else '' }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-17', 'item': 'Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한', 'target': db_conn.service,
      'status': 'PASS' if 'pgaudit' in d17_libs else 'FAIL',
      'detail': 'shared_preload_libraries=' ~ d17_libs ~ ' (pgAudit 미로드 시 감사기록 파이프라인 미구성으로 취약 판정)'
    }] }}"

# -----------------------------------------------------------------------------
# D-18 | PUBLIC Role 권한 제한 — 원문 대상 "Oracle/Altibase/Tibero/Cubrid 등"의 "등"에
#   PostgreSQL 포함되는 것으로 확정(2026-09-23). PostgreSQL의 PUBLIC 롤이 원문 취지(DBA/
#   응용프로그램 Role이 Public으로 설정되지 않아야 함)와 정확히 대응해 확장 적용. 절대기준
#   (외부 참조값 불필요, 쿼리 결과로 즉시 판정).
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-18 PUBLIC 권한 전체 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: "{{ db_conn.database | default('postgres') }}"
    query: >
      SELECT table_schema, table_name, privilege_type FROM information_schema.table_privileges
      WHERE grantee='PUBLIC' AND table_schema NOT IN ('pg_catalog','information_schema')
  register: d18_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-18 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-18', 'item': '응용프로그램 또는 DBA 계정의 Role이 Public으로 설정되지 않도록 조정', 'target': db_conn.service,
      'status': 'PASS' if (d18_raw.query_result is defined and d18_raw.query_result | length == 0) else 'FAIL',
      'detail': '조회 실패' if d18_raw.query_result is not defined else ('PUBLIC 권한 부여 현황(절대기준 — 있으면 FAIL): ' ~ (d18_raw.query_result | string | truncate(150)))
    }] }}"

# -----------------------------------------------------------------------------
# D-20 | 인가되지 않은 Object Owner 제한 [확정 — 2026-09-13 인프라팀 노션 회신]
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-20 테이블 소유자 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: "{{ db_conn.database | default('postgres') }}"
    query: "SELECT DISTINCT tableowner FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema')"
  register: d20_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-20 판정 기록"
  vars:
    d20_query_ok: "{{ d20_raw.query_result is defined }}"
    d20_owners: "{{ d20_raw.query_result | default([]) | map(attribute='tableowner') | list }}"
    d20_unauthorized: "{{ d20_owners | difference(d20_admin_owner_whitelist | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-20', 'item': '인가되지 않은 Object Owner의 제한', 'target': db_conn.service,
      'status': 'SKIP' if d20_admin_owner_whitelist is none else ('PASS' if (d20_query_ok and d20_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        '테이블 소유자 목록(화이트리스트 TODO, 참고용): ' ~ (d20_owners | join(', ') if d20_owners | length > 0 else '없음') if d20_admin_owner_whitelist is none
        else ('조회 실패' if not d20_query_ok else '화이트리스트 외 소유자: ' ~ (d20_unauthorized | join(', ') if d20_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-21 | GRANT OPTION 부여 현황 [확정 — 2026-09-14 인프라팀 회신]
#   관리자 계정(root/postgres)에 한해서만 허용, 그 외 계정(D-02 서비스 계정 포함)이
#   GRANT OPTION을 보유하면 FAIL. d21_grant_option_admin_whitelist(group_vars/all.yml) 참고.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-21 GRANT OPTION 부여 현황 조회"
  community.postgresql.postgresql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    db: "{{ db_conn.database | default('postgres') }}"
    query: "SELECT grantee, table_name FROM information_schema.role_table_grants WHERE is_grantable='YES'"
  register: d21_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-21 판정 기록"
  vars:
    d21_query_ok: "{{ d21_raw.query_result is defined }}"
    d21_grantees: "{{ d21_raw.query_result | default([]) | map(attribute='grantee') | list | unique }}"
    d21_unauthorized: "{{ d21_grantees | difference(d21_grant_option_admin_whitelist | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-21', 'item': '인가되지 않은 GRANT OPTION 사용 제한', 'target': db_conn.service,
      'status': 'PASS' if (d21_query_ok and d21_unauthorized | length == 0) else 'FAIL',
      'detail': '조회 실패' if not d21_query_ok else ('GRANT OPTION 보유 계정: ' ~ (d21_grantees | join(', ') if d21_grantees | length > 0 else '없음') ~ ' / 화이트리스트(' ~ (d21_grant_option_admin_whitelist | join(', ')) ~ ') 외: ' ~ (d21_unauthorized | join(', ') if d21_unauthorized | length > 0 else '없음'))
    }] }}"


# D-25(주기적 보안 패치)는 2026-09-14 인프라팀 회신으로 DB 파드 내부 apt 조회 기반으로
# 재설계됨 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고(DB 클라이언트 쿼리가 아니라
# 파드 내부 명령 실행이 필요해 D-07/D-14/D-10과 같은 파일로 이동).
