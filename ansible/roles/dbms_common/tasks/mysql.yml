---
# =============================================================================
# MySQL 대상 D-XX 점검 — community.mysql 컬렉션 필요 (requirements.yml 참고)
#   자격증명은 K8s Secret(secret_ref)에서 조회하는 것을 전제로 함.
#   ⚠ 아래 lookup 방식은 mgmt 서버가 K8s API 조회 권한을 가진 경우에만 동작 —
#     인프라팀 확인 필요 사항.
#   결과 dict 공통 스키마: {id, item, status, detail, target}
#     target = db_conn.service (항목명 자체는 분류표 원문 그대로 유지)
# =============================================================================

- name: "{{ db_conn.service }} | 자격증명 기본값 설정"
  # ⚠ K8s Secret lookup이 RBAC 미설정 등으로 실패하면 아래 조회 태스크가 ignore_errors로
  # 넘어가더라도 mysql_login_user/password가 undefined로 남아 이후 모든 태스크가 템플릿
  # 오류로 중단된다(failed_when으로 못 막는 종류의 실패). 빈 문자열을 먼저 깔아둬서
  # 조회 실패 시에도 DB 연결 자체만 자격증명 오류로 실패(failed_when: false로 처리됨)하고
  # 나머지 커넥션·플레이는 계속 진행되게 한다.
  ansible.builtin.set_fact:
    mysql_login_user: ""
    mysql_login_password: ""
    mysql_admin_user: ""
    mysql_admin_password: ""

- name: "{{ db_conn.service }} | K8s Secret에서 자격증명 조회"
  # ⚠ 2026-09-14 인프라팀 회신 — MySQL은 서비스별 개별 Secret이 아니라 공용 Secret
  # (shared-mysql-accounts) 안에 서비스별 키(예: member_service_password)가 들어있는
  # 구조로 확인됨. username은 이 Secret에 없고, dbms_service_accounts[].account 값과
  # 동일(예: member_service) — 이 값으로 "{account}_password" 키를 조회한다.
  vars:
    mysql_secret_data: "{{ lookup('kubernetes.core.k8s', kind='Secret', name=db_conn.secret_ref, namespace=db_conn.namespace | default('default')).data | default({}) }}"
    mysql_account_name: "{{ (dbms_service_accounts | selectattr('database', 'equalto', db_conn.service) | map(attribute='account') | list | first) | default(none) }}"
  ansible.builtin.set_fact:
    mysql_login_user: "{{ mysql_account_name }}"
    mysql_login_password: "{{ mysql_secret_data[mysql_account_name + '_password'] | b64decode }}"
  when: db_conn.secret_ref is not none and mysql_account_name is not none
  ignore_errors: true

- name: "{{ db_conn.service }} | K8s Secret에서 관리자(admin) 자격증명 조회"
  # 2026-09-20 인프라팀 회신(트래킹표 1번) — D-01/02/04/06/08/11/21은 mysql.* 시스템
  # 테이블 전체를 봐야 해서 위 서비스 앱 계정 대신 이 admin 계정으로 조회한다.
  # group_vars/all.yml의 dbms_admin_connections.mysql 주석 참고(Secret 키 이름은 MOCO
  # 표준 포맷으로 가정 — 확신 없는 값, 실패 시 실제 키부터 확인).
  vars:
    mysql_admin_secret_data: "{{ lookup('kubernetes.core.k8s', kind='Secret', name=dbms_admin_connections.mysql.secret_ref, namespace=dbms_admin_connections.mysql.namespace | default('default')).data | default({}) }}"
  ansible.builtin.set_fact:
    mysql_admin_user: "{{ dbms_admin_connections.mysql.secret_username }}"
    mysql_admin_password: "{{ mysql_admin_secret_data[dbms_admin_connections.mysql.secret_password_key] | b64decode }}"
  when: dbms_admin_connections.mysql.secret_ref is not none
  ignore_errors: true

# -----------------------------------------------------------------------------
# D-01 | 기본 계정 잠금 상태 (root@localhost)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-01 root 계정 잠금 상태 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_admin_user }}"
    login_password: "{{ mysql_admin_password }}"
    query: "SELECT account_locked FROM mysql.user WHERE user='root' AND host='localhost'"
  register: d01_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-01 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-01', 'item': '기본 계정의 비밀번호, 정책 등을 변경하여 사용', 'target': db_conn.service,
      'status': 'PASS' if (d01_raw.query_result is defined and d01_raw.query_result[0][0].account_locked == 'Y') else 'FAIL',
      'detail': d01_raw.query_result | default('조회 실패') | string | truncate(150)
    }] }}"

# -----------------------------------------------------------------------------
# D-02 | 불필요 계정 제거 [확정 — 2026-09-13 인프라팀 노션 회신]
#   d02_unnecessary_account_whitelist(8개 서비스 계정) 외 계정 존재 시 FAIL(root는 쿼리에서 제외됨)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-02 전체 계정 목록 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_admin_user }}"
    login_password: "{{ mysql_admin_password }}"
    query: "SELECT user, host FROM mysql.user WHERE user NOT IN ('root','mysql.sys','mysql.session','mysql.infoschema')"
  register: d02_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-02 판정 기록"
  vars:
    d02_query_ok: "{{ d02_raw.query_result is defined }}"
    d02_accounts: "{{ d02_raw.query_result | default([]) | first | default([]) }}"
    d02_unauthorized: "{{ d02_accounts | rejectattr('user', 'in', d02_unnecessary_account_whitelist | default([])) | list }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-02', 'item': '데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용', 'target': db_conn.service,
      'status': 'SKIP' if d02_unnecessary_account_whitelist is none else ('PASS' if (d02_query_ok and d02_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        '전체 계정(화이트리스트 TODO, 참고용): ' ~ (d02_accounts | string | truncate(150) if d02_accounts | length > 0 else '없음') if d02_unnecessary_account_whitelist is none
        else ('조회 실패' if not d02_query_ok else '화이트리스트 외 계정: ' ~ (d02_unauthorized | string | truncate(150) if d02_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-03 | 비밀번호 사용기간·복잡도 [확정 — 2026-09-10 인프라팀 회신: 만료 90일 /
#   최소길이 12자 / 영문 대소문자·숫자·특수문자 중 3종류 이상. validate_password.policy가
#   MEDIUM 이상이면 대소문자+숫자+특수문자를 모두 강제하므로 "3종류 이상" 요건을 충족한다.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-03 password_expiration/validate_password 설정 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"
    query: "SHOW VARIABLES WHERE Variable_name IN ('default_password_lifetime','validate_password.length','validate_password.policy')"
  register: d03_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-03 판정 기록"
  vars:
    d03_lifetime: "{{ (d03_raw.query_result | default([]) | first | default([]) | selectattr('Variable_name', 'equalto', 'default_password_lifetime') | map(attribute='Value') | list | first) | default('0', true) }}"
    d03_minlen: "{{ (d03_raw.query_result | default([]) | first | default([]) | selectattr('Variable_name', 'equalto', 'validate_password.length') | map(attribute='Value') | list | first) | default('0', true) }}"
    d03_policy: "{{ (d03_raw.query_result | default([]) | first | default([]) | selectattr('Variable_name', 'equalto', 'validate_password.policy') | map(attribute='Value') | list | first) | default('LOW', true) }}"
    d03_policy_ok: "{{ d03_policy | upper in ['MEDIUM', 'STRONG'] }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-03', 'item': '비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정', 'target': db_conn.service,
      'status': (
        'SKIP' if (d03_password_max_days is none or d03_password_min_length is none) else
        ('PASS' if (d03_lifetime | int > 0 and d03_lifetime | int <= d03_password_max_days and d03_minlen | int >= d03_password_min_length and d03_policy_ok) else 'FAIL')
      ),
      'detail': 'default_password_lifetime=' ~ d03_lifetime ~ '(기준 <= ' ~ (d03_password_max_days | default('TODO')) ~ '), validate_password.length=' ~ d03_minlen ~
                '(기준 >= ' ~ (d03_password_min_length | default('TODO')) ~ '), validate_password.policy=' ~ d03_policy ~ '(기준 MEDIUM 이상 — 3종류 이상 조합 강제)'
    }] }}"

# -----------------------------------------------------------------------------
# D-04 | 관리자 권한 최소 인원 [확정 — 2026-09-13 인프라팀 노션 회신]
#   root는 이미 쿼리에서 제외됨 — 화이트리스트(d04_admin_account_whitelist)는 빈 리스트라
#   그 외 SUPER/SYSTEM_USER 보유 계정이 하나라도 조회되면 FAIL.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-04 SUPER/GRANT 권한 보유 계정 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_admin_user }}"
    login_password: "{{ mysql_admin_password }}"
    query: >-
      SELECT grantee FROM information_schema.user_privileges
      WHERE privilege_type IN ('SUPER','SYSTEM_USER') AND grantee NOT LIKE "'root'@%"
      AND grantee NOT IN ("'mysql.sys'@'localhost'", "'mysql.session'@'localhost'", "'mysql.infoschema'@'localhost'")
  register: d04_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-04 판정 기록"
  vars:
    d04_query_ok: "{{ d04_raw.query_result is defined }}"
    d04_admins: "{{ d04_raw.query_result | default([]) | first | default([]) | map(attribute='grantee') | list }}"
    d04_unauthorized: "{{ d04_admins | difference(d04_admin_account_whitelist | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-04', 'item': '데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용', 'target': db_conn.service,
      'status': 'SKIP' if d04_admin_account_whitelist is none else ('PASS' if (d04_query_ok and d04_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        'SUPER/SYSTEM_USER 보유 계정(화이트리스트 TODO, 참고용): ' ~ (d04_admins | join(', ') if d04_admins | length > 0 else '없음') if d04_admin_account_whitelist is none
        else ('조회 실패' if not d04_query_ok else '화이트리스트 외 관리자 권한 계정: ' ~ (d04_unauthorized | join(', ') if d04_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-05 | 비밀번호 재사용 제한 [원문 대상에 MySQL 미기재 — d05_applicable 로 게이트]
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-05 password_history 설정 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"
    query: "SHOW VARIABLES LIKE 'password_history'"
  register: d05_raw
  failed_when: false
  when: d05_applicable | bool

- name: "{{ db_conn.service }} | D-05 판정 기록"
  vars:
    d05_history: "{{ (d05_raw.query_result | default([[['','0']]]))[0][0].Value | default('0') }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-05', 'item': '비밀번호 재사용에 대한 제약 설정', 'target': db_conn.service,
      'status': (
        'N/A' if not (d05_applicable | bool) else
        ('SKIP' if d05_password_reuse_limit is none else
         ('PASS' if (d05_history | int >= d05_password_reuse_limit) else 'FAIL'))
      ),
      'detail': (
        '원문 대상에 MySQL 미기재 — 적용여부 DBA 확인 대기(해당없음 처리 중)' if not (d05_applicable | bool)
        else 'password_history=' ~ d05_history ~ (' — 재사용제한 기준값(d05_password_reuse_limit) TODO' if d05_password_reuse_limit is none else '')
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-06 | 계정 개별 부여(공용 계정 금지) [확정 — 2026-09-13 인프라팀 노션 회신]
#   root는 이미 쿼리에서 제외됨(관리자 목적 정당한 공용계정). 그 외 로그인 가능 계정은
#   dbms_service_accounts에서 이 커넥션(db_conn.service)에 매핑된 계정 "단 하나"여야
#   하며, 그 외 계정이 조회되면 공용/교차사용으로 간주해 FAIL.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-06 전체 계정명 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_admin_user }}"
    login_password: "{{ mysql_admin_password }}"
    query: "SELECT DISTINCT user FROM mysql.user WHERE user NOT IN ('root','mysql.sys','mysql.session','mysql.infoschema')"
  register: d06_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-06 판정 기록"
  vars:
    d06_query_ok: "{{ d06_raw.query_result is defined }}"
    d06_users: "{{ d06_raw.query_result | default([]) | first | default([]) | map(attribute='user') | list }}"
    d06_expected: "{{ dbms_service_accounts | selectattr('database', 'equalto', db_conn.service) | map(attribute='account') | list }}"
    d06_unexpected: "{{ d06_users | difference(d06_expected) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-06', 'item': 'DB 사용자 계정을 개별적으로 부여하여 사용', 'target': db_conn.service,
      'status': (
        'REVIEW' if d06_expected | length == 0 else ('PASS' if (d06_query_ok and d06_unexpected | length == 0) else 'FAIL')
      ),
      'detail': (
        'dbms_service_accounts에 이 DB(' ~ db_conn.service ~ ')에 매핑된 계정 없음 — group_vars 매핑 확인 필요. 전체 계정: ' ~ (d06_users | join(', ') if d06_users | length > 0 else '없음') if d06_expected | length == 0
        else ('조회 실패' if not d06_query_ok else '기대 계정(' ~ (d06_expected | join(', ')) ~ ') 외 계정 발견: ' ~ (d06_unexpected | join(', ') if d06_unexpected | length > 0 else '없음'))
      )
    }] }}"

# -----------------------------------------------------------------------------
# D-08 | 안전한 암호화 알고리즘 사용 (caching_sha2_password)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-08 인증 플러그인 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_admin_user }}"
    login_password: "{{ mysql_admin_password }}"
    query: "SELECT user, host, plugin FROM mysql.user WHERE plugin NOT IN ('caching_sha2_password','sha256_password')"
  register: d08_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-08 판정 기록"
  vars:
    d08_weak: "{{ d08_raw.query_result | default([]) | first | default([]) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-08', 'item': '안전한 암호화 알고리즘 사용', 'target': db_conn.service,
      'status': 'PASS' if (d08_raw.query_result is defined and d08_weak | length == 0) else 'FAIL',
      'detail': '조회 실패' if d08_raw.query_result is not defined else ('취약 플러그인 사용 계정: ' ~ (d08_weak | string | truncate(150) if d08_weak | length > 0 else '없음'))
    }] }}"

# -----------------------------------------------------------------------------
# D-09 | 로그인 실패 잠금 — MySQL 8.0.19+ 에서만 네이티브 지원 (버전 게이트)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-09 MySQL 버전 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"
    query: "SELECT VERSION()"
  register: d09_version_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-09 버전 8.0.19 미만이면 N/A 처리"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-09', 'item': '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': 'MySQL 8.0.19 미만 — FAILED_LOGIN_ATTEMPTS 네이티브 미지원. 버전: ' ~ (d09_version_raw.query_result | default('조회 실패') | string)
    }] }}"
  when: >
    d09_version_raw.query_result is defined and
    (d09_version_raw.query_result[0][0].values() | first) is version('8.0.19', '<')

- name: "{{ db_conn.service }} | D-09 잠금 설정 조회(8.0.19 이상)"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"
    # MySQL 8.0.19+ 계정 잠금 설정은 mysql.user에 failed_login_attempts라는 별도 컬럼이 없고,
    # User_attributes(JSON) 안에 {"Password_locking": {"failed_login_attempts": N, ...}}로 저장된다.
    query: >-
      SELECT user, host FROM mysql.user
      WHERE user NOT IN ('mysql.sys','mysql.session','mysql.infoschema')
      AND (JSON_EXTRACT(User_attributes, '$.Password_locking.failed_login_attempts') IS NULL
           OR JSON_EXTRACT(User_attributes, '$.Password_locking.failed_login_attempts') = 0)
  register: d09_raw
  failed_when: false
  when: >
    d09_version_raw.query_result is defined and
    (d09_version_raw.query_result[0][0].values() | first) is version('8.0.19', '>=')

- name: "{{ db_conn.service }} | D-09 판정 기록(8.0.19 이상)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-09', 'item': '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정', 'target': db_conn.service,
      'status': 'PASS' if (d09_raw.query_result is defined and (d09_raw.query_result | first | default([]) | length) == 0) else 'FAIL',
      'detail': '잠금 미설정 계정: ' ~ (d09_raw.query_result | default([]) | first | default([]) | string | truncate(150))
    }] }}"
  when: >
    d09_version_raw.query_result is defined and
    (d09_version_raw.query_result[0][0].values() | first) is version('8.0.19', '>=')

# D-10(원격 DB 서버 접속 제한)은 2026-09-09 인프라팀 확인으로 IP 허용목록이 아니라
# K8s NetworkPolicy 기반으로 변경됨 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고(spec 2.3절).

# -----------------------------------------------------------------------------
# D-11 | 시스템 테이블 접근 제한 (mysql.* 스키마, PUBLIC/일반 사용자 REVOKE 여부)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-11 mysql 스키마 권한 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_admin_user }}"
    login_password: "{{ mysql_admin_password }}"
    query: "SELECT grantee, table_schema FROM information_schema.schema_privileges WHERE table_schema='mysql' AND grantee NOT LIKE \"'root'@%\""
  register: d11_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-11 판정 기록"
  vars:
    d11_extra: "{{ d11_raw.query_result | default([]) | first | default([]) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-11', 'item': '시스템 테이블 접근 제한', 'target': db_conn.service,
      'status': 'PASS' if (d11_raw.query_result is defined and d11_extra | length == 0) else 'FAIL',
      'detail': '조회 실패' if d11_raw.query_result is not defined else ('비관리자 접근 권한: ' ~ (d11_extra | string | truncate(150) if d11_extra | length > 0 else '없음'))
    }] }}"

# -----------------------------------------------------------------------------
# D-17 | Audit Table 접근 제한 — MySQL은 1차 점검 스코프 제외 [확정 — 2026-09-14 인프라팀 회신]
#   pgAudit이 PostgreSQL 전용이라 이 스택에서 MySQL 쪽 별도 구현이 없음이 확인됨.
#   2차 점검 시점에 화이트리스트를 새로 받을지, 1차처럼 계속 제외할지 재논의 예정이라
#   영구 배제(N/A)가 아니라 SKIP으로 둔다.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-17 판정 기록(1차 스코프 제외)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-17', 'item': 'Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한', 'target': db_conn.service,
      'status': 'SKIP',
      'detail': 'MySQL은 1차 점검 스코프에서 제외 — pgAudit이 PostgreSQL 전용, 2차 점검 시 재논의'
    }] }}"

# -----------------------------------------------------------------------------
# D-18 | PUBLIC Role — MySQL은 해당 개념 자체가 없음(원문·검증 완료)
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-18 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-18', 'item': '응용프로그램 또는 DBA 계정의 Role이 Public으로 설정되지 않도록 조정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': 'MySQL은 PUBLIC 롤 개념이 없음(권한 모델이 user@host 단위) — PostgreSQL 대상 항목'
    }] }}"

# -----------------------------------------------------------------------------
# D-20 | 인가되지 않은 Object Owner 제한 — 원문상 PostgreSQL 서비스에만 적용
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-20 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-20', 'item': '인가되지 않은 Object Owner의 제한', 'target': db_conn.service,
      'status': 'N/A',
      'detail': '원문 적용대상이 PostgreSQL 서비스로 한정(MySQL 서비스는 제외 검토, spec 2.1절 근거)'
    }] }}"

# -----------------------------------------------------------------------------
# D-21 | GRANT OPTION 부여 현황 [확정 — 2026-09-14 인프라팀 회신]
#   관리자 계정(root/postgres)에 한해서만 허용, 그 외 계정(D-02 서비스 계정 포함)이
#   GRANT OPTION을 보유하면 FAIL. d21_grant_option_admin_whitelist(group_vars/all.yml) 참고.
# -----------------------------------------------------------------------------
- name: "{{ db_conn.service }} | D-21 GRANT OPTION 부여 계정 조회"
  community.mysql.mysql_query:
    login_host: "{{ db_conn.host }}"
    login_port: "{{ db_conn.port }}"
    login_user: "{{ mysql_admin_user }}"
    login_password: "{{ mysql_admin_password }}"
    query: "SELECT grantee FROM information_schema.user_privileges WHERE is_grantable='YES'"
  register: d21_raw
  failed_when: false

- name: "{{ db_conn.service }} | D-21 판정 기록"
  vars:
    d21_query_ok: "{{ d21_raw.query_result is defined }}"
    d21_grantees: "{{ d21_raw.query_result | default([]) | first | default([]) | map(attribute='grantee') | map('regex_replace', \"^'([^']*)'@.*$\", '\\1') | list | unique }}"
    d21_unauthorized: "{{ d21_grantees | difference(d21_grant_option_admin_whitelist | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-21', 'item': '인가되지 않은 GRANT OPTION 사용 제한', 'target': db_conn.service,
      'status': 'PASS' if (d21_query_ok and d21_unauthorized | length == 0) else 'FAIL',
      'detail': '조회 실패' if not d21_query_ok else ('GRANT OPTION 보유 계정: ' ~ (d21_grantees | join(', ') if d21_grantees | length > 0 else '없음') ~ ' / 화이트리스트(' ~ (d21_grant_option_admin_whitelist | join(', ')) ~ ') 외: ' ~ (d21_unauthorized | join(', ') if d21_unauthorized | length > 0 else '없음'))
    }] }}"

# D-25(주기적 보안 패치)는 2026-09-14 인프라팀 회신으로 DB 파드 내부 apt 조회 기반으로
# 재설계됨 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고(DB 클라이언트 쿼리가 아니라
# 파드 내부 명령 실행이 필요해 D-07/D-14/D-10과 같은 파일로 이동).
