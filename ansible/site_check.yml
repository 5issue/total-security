---
# =============================================================================
# site_check.yml — 인프라 점검 마스터 Playbook
#
#   실행 예시:
#     ansible-playbook -i inventory/hosts.ini site_check.yml -e check_round="1차"
#     (check_round 미지정 시 "정기점검"으로 고정 — 매주 crontab 자동실행용)
#
#   결과 파일: ./results/{inventory_hostname}_{날짜}.json (서버)
#             ./results/dbms_{날짜}.json (DBMS)
#   이 JSON들은 scripts/build_server_dbms_xlsx.py 가 읽어 server_dbms_result.xlsx로
#   변환한다(run_check.sh 가 두 단계를 순서대로 실행) — 4.1절 파이프라인 참고.
# =============================================================================

- name: "서버 점검 — 계정·인증(A-1) / 파일권한(A-2) / 서비스관리(A-3)"
  hosts: server_targets   # inventory 그룹명 (워커노드 + NAT 인스턴스)
  gather_facts: true
  vars:
    check_results: []
    check_round: "정기점검"
  roles:
    - account_auth
    - file_permission
    - network_service
    - log_patch_check
  tasks:
    - name: "U-66 | 시스템 로깅 정책 점검 — mgmt 서버 AWS API 조회"
      ansible.builtin.include_role:
        name: log_patch_check
        tasks_from: u66_check
      run_once: true

    - name: "결과 요약 출력"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — PASS {{ check_results | selectattr('status','equalto','PASS') | list | length }} / FAIL {{ check_results | selectattr('status','equalto','FAIL') | list | length }} / 총 {{ check_results | length }}"

    - name: "결과 파일 저장 (실행 주체 로컬)"
      ansible.builtin.copy:
        content: "{{ { 'host': inventory_hostname, 'checked_at': ansible_date_time.iso8601, 'round': check_round, 'results': check_results } | to_nice_json }}"
        dest: "./results/{{ inventory_hostname }}_{{ ansible_date_time.date }}.json"
      delegate_to: localhost

- name: "DBMS 점검"
  hosts: localhost   # DB 클라이언트 커넥션은 controller(mgmt 서버)에서 네트워크로 접속
  gather_facts: true
  vars:
    check_results: []
    check_round: "정기점검"
  pre_tasks:
    # localhost 대상 play가 여러 개(DBMS/인증_인가)라 set_fact로 쌓인 check_results가
    # host fact로 남아 위 vars: check_results: [] 보다 우선순위가 높음 — roles 실행 전
    # 명시적으로 초기화해야 이전 play(서버 점검 중 delegate_to: localhost로 실행된 태스크는
    # set_fact가 아니므로 무해)와 이후 인증_인가 play 결과가 서로 섞이지 않는다.
    - name: "check_results 초기화 (동일 host localhost 대상 이전 play 누적 방지)"
      ansible.builtin.set_fact:
        check_results: []
  roles:
    - dbms_common
  tasks:
    - name: "결과 요약 출력"
      ansible.builtin.debug:
        msg: "DBMS — PASS {{ check_results | selectattr('status','equalto','PASS') | list | length }} / FAIL {{ check_results | selectattr('status','equalto','FAIL') | list | length }} / N/A·SKIP·REVIEW {{ check_results | rejectattr('status','in',['PASS','FAIL']) | list | length }} / 총 {{ check_results | length }}"

    - name: "결과 파일 저장"
      ansible.builtin.copy:
        content: "{{ { 'checked_at': ansible_date_time.iso8601, 'round': check_round, 'results': check_results } | to_nice_json }}"
        dest: "./results/dbms_{{ ansible_date_time.date }}.json"

- name: "인증/인가 점검 (AUTHZ-XX, SVC-01) — K8s 기반"
  hosts: localhost   # 백엔드 서비스 Ingress/NetworkPolicy는 mgmt 서버에서 K8s API로 조회
  gather_facts: true
  vars:
    check_results: []
    check_round: "정기점검"
  pre_tasks:
    # 위 DBMS 점검 play도 hosts: localhost라 set_fact로 쌓인 check_results가 host fact로
    # 남아있음 — roles 실행 전 명시적으로 초기화(DBMS 점검 play의 동일 주석 참고).
    - name: "check_results 초기화 (동일 host localhost 대상 이전 play 누적 방지)"
      ansible.builtin.set_fact:
        check_results: []
  roles:
    - auth_authz
  tasks:
    - name: "결과 요약 출력"
      ansible.builtin.debug:
        msg: "인증_인가 — PASS {{ check_results | selectattr('status','equalto','PASS') | list | length }} / FAIL {{ check_results | selectattr('status','equalto','FAIL') | list | length }} / N/A·SKIP·REVIEW {{ check_results | rejectattr('status','in',['PASS','FAIL']) | list | length }} / 총 {{ check_results | length }}"

    - name: "결과 파일 저장"
      ansible.builtin.copy:
        content: "{{ { 'checked_at': ansible_date_time.iso8601, 'round': check_round, 'results': check_results } | to_nice_json }}"
        dest: "./results/auth_authz_{{ ansible_date_time.date }}.json"
