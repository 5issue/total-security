---
# 인프라 점검 기준값

# 서버 기준값

# U-02 : 비밀번호 관리정책 설정
u02_pwquality:
  minlen: 8
  dcredit: -1
  ucredit: -1
  lcredit: -1
  ocredit: -1
u02_pass_max_days: 90
u02_pass_min_days: 1
u02_remember_min: 4

# U-03 : 계정 잠금 임계값 설정
u03_deny_max: 10

# U-07 : 불필요한 계정 제거
u07_unnecessary_accounts:
  - lp
  - uucp
  - nuucp
  - games
  - gopher
  - news
  - sync
u07_unused_login_days_threshold: 90
u07_stale_check_exclude_accounts:
  - ssm-user

# U-08 : 관리자 그룹에 최소한의 계정 포함
u08_root_group_admin_whitelist: ["root"]

# U-09 : 계정이 존재하지 않는 GID 금지
u09_allowed_empty_groups: []

# U-12 : 세션 종료 시간 설정
u12_tmout_max_seconds: 600

# U-13 : 안전한 비밀번호 암호화 알고리즘 사용
u13_allowed_encrypt_methods: ["SHA256", "SHA512"]

# U-16,18,19,20,21,22,27,29,37,67 : 주요 파일 권한 임계값
u16_passwd_perm_max: "0644"
u18_shadow_perm_max: "0400"
u19_hosts_perm_max: "0644"
u20_xinetd_perm_max: "0600"
u21_syslog_perm_max: "0640"
u22_services_perm_max: "0644"
u27_hosts_equiv_perm_max: "0600"
u29_hosts_lpd_perm_max: "0600"
u37_crontab_perm_max: "0640"
u67_log_perm_max: "0644"

# U-23 : SUID, SGID, Sticky bit 설정 파일 점검
u23_allowed_suid_sgid:
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/passwd
  - /usr/bin/chsh
  - /usr/bin/chfn
  - /usr/bin/gpasswd
  - /usr/bin/newgrp
  - /usr/bin/mount
  - /usr/bin/umount
  - /usr/bin/pkexec
  - /usr/libexec/openssh/ssh-keysign
  - /usr/bin/at
  - /usr/bin/chage
  - /usr/bin/write
  - /usr/bin/screen
  - /usr/sbin/unix_chkpwd
  - /usr/libexec/utempter/utempter
u15_unowned_exclude_dirs:
  - /var/lib/containerd
  - /var/lib/kubelet
u23_suid_exclude_dirs:
  - /var/lib/containerd

# U-24 : 사용자, 시스템 환경변수 파일 소유자 및 권한 설정
u24_user_env_files:
  - .profile
  - .bashrc
  - .bash_profile
  - .bash_login
  - .bash_logout
  - .cshrc
  - .login
  - .exrc
  - .netrc

# U-25 : world writable 파일 점검
u25_world_writable_exclude_dirs:
  - /proc
  - /sys
  - /dev
  - /tmp
  - /var/tmp
  - /dev/shm
  - /run
  - /var/lib/kubelet/pods
  - /var/lib/containerd

# U-26 : /dev에 존재하지 않는 device 파일 점검
u26_dev_exclude_dirs:
  - mqueue
  - shm
u26_dev_allowed_files:
  - /dev/termination-log

# U-28 : 접속 IP 및 포트 제한

# U-30 : UMASK 설정 관리
u30_umask_min: "022"

# U-33 : 숨겨진 파일 및 디렉토리 검색 및 제거
u33_hidden_exclude_dirs:
  - /proc
  - /sys
  - /run
  - /var/lib/containerd
  - /var/lib/kubelet
u33_hidden_allowed_paths:
  - "/root/.bash*"
  - "/root/.profile"
  - "/root/.cshrc"
  - "/root/.tcshrc"
  - "/root/.ssh"
  - "/root/.cache"
  - "/root/.config"
  - "/root/.local"
  - "/root/.aws"
  - "/root/.kube"
  - "/root/.ansible"
  - "/root/.gnupg"
  - "/root/.viminfo"
  - "/root/.lesshst"
  - "/home/*/.bash*"
  - "/home/*/.profile"
  - "/home/*/.ssh"
  - "/home/*/.cache"
  - "/home/*/.config"
  - "/home/*/.local"
  - "/home/*/.aws"
  - "/home/*/.kube"
  - "/home/*/.ansible"
  - "/home/*/.gnupg"
  - "/home/*/.viminfo"
  - "/home/*/.lesshst"
  - "/root/.python_history"
  - "/root/.wget-hsts"
  - "/root/.rnd"
  - "/root/.pki"
  - "/home/*/.python_history"
  - "/home/*/.wget-hsts"
  - "/home/*/.rnd"
  - "/home/*/.pki"
  - "/etc/skel/.*"
  - "/etc/.pwd.lock"
  - "/etc/.updated"
  - "/var/.updated"
  - "/var/lib/rpm/.rpm.lock"
  - "/usr/lib/sysimage/rpm/.rpm.lock"
  - "/tmp/.X11-unix"
  - "/tmp/.ICE-unix"
  - "/tmp/.font-unix"
  - "/tmp/.XIM-unix"
  - "/tmp/.Test-unix"
  - "/var/log/journal/*/.#*journal*"
  - "/var/cache/dnf/.gpgkeyschecked.yum"
  - "/etc/cni/net.d/.cni-concurrency.lock"
  - "/usr/local/aws-cli/v2/*/dist/awscli/botocore/.changes"

# U-40 : NFS 접근 통제
u40_nfs_allowed_hosts: null
u40_exports_perm_max: "0644"

# U-42 : 불필요한 RPC 서비스 비활성화
u42_unnecessary_rpc_services:
  - rpcbind.service
  - rpcbind.socket
  - ypbind.service

# U-45,47,49,50,51,56,61 : 미사용 예정 서비스 관련
u45_mail_latest_version: null
u47_relay_allowed_list: null
u49_dns_patch_baseline: null
u50_dns_allowed_secondaries: null
u51_dns_dynamic_update_allowed: null
u56_ftp_allowed_hosts: null
u61_snmp_allowed_hosts: null

# U-60 : SNMP Community String 복잡성 설정
u60_snmp_community_blacklist:
  - public
  - private

# U-64 : 주기적 보안 패치 및 벤더 권고사항 적용
u64_eks_optimized_ami_ssm_param: "/aws/service/eks/optimized-ami/1.36/amazon-linux-2023/x86_64/standard/recommended/image_id"
u64_nat_latest_ami_ssm_param: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64"
u64_dnf_patch_max_age_days: 30

# U-65 : NTP 및 시각 동기화 설정
u65_ntp_allowed_servers: ["169.254.169.123"]

# DBMS 기준값

# D-02/04/06/10 : 서비스별 DB 계정 매핑
dbms_service_accounts:
  - service: user-service
    engine: mysql
    database: user_db
    account: user_user
  - service: auth-service
    engine: mysql
    database: auth_db
    account: auth_user
  - service: order-service
    engine: mysql
    database: order_db
    account: order_user
  - service: payment-service
    engine: mysql
    database: payment_db
    account: payment_user
  - service: product-service
    engine: postgresql
    database: product_db
    account: product_user
  - service: oms-service
    engine: postgresql
    database: oms_db
    account: oms_user
  - service: wms-service
    engine: postgresql
    database: wms_db
    account: wms_user
  - service: scm-service
    engine: postgresql
    database: scm_db
    account: scm_user

# D-02 : 데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용
d02_unnecessary_account_whitelist:
  - user_user
  - auth_user
  - order_user
  - payment_user
  - oms_user
  - product_user
  - wms_user
  - scm_user
  - ai_user

# D-02/04/06/21 : 운영 필수 계정
dbms_operator_accounts:
  mysql: [moco-admin, moco-agent, moco-repl, moco-clone-donor, moco-exporter, moco-backup, moco-readonly, moco-writable]
  postgresql: [streaming_replica]
dbms_dba_accounts: [dba_admin]

# D-03 : 비밀번호 사용 기간 및 복잡도를 기관의 정책에 맞도록 설정
d03_rotation:
  namespace: backend
  annotation: "dba-admin/last-rotated"
  secrets:
    mysql: "shared-mysql-dba-admin"
    postgresql: "shared-pg-dba-admin-credentials"

# D-03 : 비밀번호 사용 기간 및 복잡도를 기관의 정책에 맞도록 설정
d03_password_max_days: 90
d03_password_min_length: 12
d03_password_complexity_min_classes: 3
d03_user_accounts:
  mysql: ["dba_admin"]
  postgresql: ["dba_admin"]

# D-04 : 데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용
d04_admin_account_whitelist: []

# D-05 : 비밀번호 재사용에 대한 제약 설정
d05_applicable: true
d05_password_reuse_limit: 3

# D-17 : Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한
d17_admin_account_whitelist:
  - postgres

# D-10 : 원격에서 DB 서버로의 접속 제한
d10_np_label_key: "app"

# D-20 : 인가되지 않은 Object Owner의 제한
d20_admin_owner_whitelist:
  - postgres
  - product_user
  - wms_user
  - scm_user
  - oms_user

# D-21 : 인가되지 않은 GRANT OPTION 사용 제한
d21_grant_option_admin_whitelist:
  - root
  - postgres

# D-25 : 주기적 보안 패치 및 벤더 권고 사항 적용
d25_db_latest_versions_as_of: "2026-09-29"
d25_db_latest_versions:
  mysql:
    "8.4": "8.4.12"
    "9.7": "9.7.3"
  postgresql:
    "14": "14.24"
    "15": "15.19"
    "16": "16.15"
    "17": "17.11"
    "18": "18.6"

# DBMS 접속 정보
dbms_connections:
  - service: user_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: auth_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: order_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: payment_db
    engine: mysql
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: product_db
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "product_db"
  - service: wms_db
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "wms_db"
  - service: scm_db
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "scm_db"
  - service: oms_db
    engine: postgresql
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "oms_db"

# D-01/02/04/06/08/11/18/20/21 : DBMS 관리자 접속 정보
dbms_admin_connections:
  mysql:
    namespace: backend
    secret_ref: "shared-mysql-dba-admin"
    secret_username: "dba_admin"
    secret_password_key: "password"

# 인증_인가 기준값
authz_backend_namespace: "backend"
authz_internal_path_prefix: "/internal"

# SVC-01 : 서비스 간 NetworkPolicy 화이트리스트
svc01_target_services:
  - auth-service
  - user-service
  - order-service
  - payment-service
  - product-service
  - oms-service
  - wms-service
  - scm-service
svc01_allowed_service_calls:
  - { caller: "order-service",   callee: "oms-service" }
  - { caller: "product-service", callee: "order-service" }
  - { caller: "payment-service", callee: "order-service" }
  - { caller: "order-service",   callee: "payment-service" }
  - { caller: "order-service",   callee: "product-service" }
  - { caller: "order-service",   callee: "user-service" }
  - { caller: "auth-service",    callee: "user-service" }
  - { caller: "oms-service",     callee: "auth-service" }
  - { caller: "wms-service",     callee: "auth-service" }
  - { caller: "scm-service",     callee: "auth-service" }
  - { caller: "order-service",   callee: "auth-service" }
  - { caller: "payment-service", callee: "auth-service" }
  - { caller: "product-service", callee: "auth-service" }
  - { caller: "user-service",    callee: "auth-service" }

# AUTHZ-09 : WMS→OMS 반품검수 RabbitMQ 발행/구독 권한
authz09_shared_account_blocks_check: false
authz09_rabbitmq_management_url: null
authz09_rabbitmq_readonly_user_secret: null
authz09_rabbitmq_vhost: "total-prod"
authz09_rabbitmq_exchange: "wms.topic.exchange"
authz09_rabbitmq_routing_key: "wms.return.inspected"
authz09_rabbitmq_exchange_dedicated: false
authz09_rabbitmq_oms_queue: "oms.wms-inspected.queue"
authz09_rabbitmq_publisher_allowed: ["wms-service"]
authz09_rabbitmq_consumer_allowed: ["oms-service"]
authz09_rabbitmq_publisher_user: null
authz09_rabbitmq_consumer_user: null
