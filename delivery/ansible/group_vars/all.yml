---
# 인프라 점검 기준값 (group_vars/all.yml)

# =============================================================================
# 서버(U-XX) 기준값
# =============================================================================

# U-02 : 패스워드 복잡도
u02_pwquality:
  minlen: 8
  dcredit: -1
  ucredit: -1
  lcredit: -1
  ocredit: -1

# U-07 : 불필요한 계정 제거
u07_unnecessary_accounts:
  - lp
  - uucp
  - nuucp
  - games
  - gopher
  - news
  - sync
u07_unused_login_days_threshold: 90

# U-08 : root 그룹 권한 제한
u08_root_group_admin_whitelist: ["root"]

# U-12 : 세션 타임아웃
u12_tmout_max_seconds: 600

# U-13 : 패스워드 해시 알고리즘
u13_required_encrypt_method: "SHA512"

# U-16,18,19,20,21,22,27,29,37,67 : 주요 파일 권한 임계값
u16_passwd_perm_max: "0644"      # /etc/passwd
u18_shadow_perm_max: "0400"      # /etc/shadow
u19_hosts_perm_max: "0644"       # /etc/hosts
u20_xinetd_perm_max: "0600"      # /etc/xinetd.conf, /etc/xinetd.d/*
u21_syslog_perm_max: "0640"      # /etc/rsyslog.conf
u22_services_perm_max: "0644"    # /etc/services
u27_hosts_equiv_perm_max: "0600" # /etc/hosts.equiv, ~/.rhosts
u29_hosts_lpd_perm_max: "0600"   # /etc/hosts.lpd
u37_crontab_perm_max: "0640"     # /etc/crontab, /etc/cron.d/*
u67_log_perm_max: "0644"         # /var/log/* 로그 파일

# U-17 : 링크 파일 보호
u17_protected_files:
  - /etc/passwd
  - /etc/shadow
  - /etc/group
  - /etc/hosts
  - /etc/services
  - /etc/rsyslog.conf

# U-23 : SUID/SGID 설정 점검
u23_allowed_suid_sgid:
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/passwd
  - /usr/bin/chsh
  - /usr/bin/chfn
  - /usr/bin/gpasswd
  - /usr/bin/newgrp
  - /usr/bin/mount
  - /usr/bin/umount
  - /usr/bin/pkexec
  - /usr/libexec/openssh/ssh-keysign
  - /usr/bin/at
  - /usr/bin/chage
  - /usr/bin/write
  - /usr/bin/screen

# U-24 : 사용자 환경 파일 보호
u24_user_env_files:
  - .profile
  - .bashrc
  - .bash_profile
  - .bash_login
  - .bash_logout
  - .cshrc
  - .login
  - .exrc
  - .netrc

# U-25 : world writable 파일 점검
u25_world_writable_exclude_dirs:
  - /proc
  - /sys
  - /dev
  - /tmp
  - /var/tmp
  - /dev/shm
  - /run

# U-26 : 중요 디바이스 파일 보호
u26_dev_baseline_snapshot:
  - "/dev/autofs"
  - "/dev/btrfs-control"
  - "/dev/console"
  - "/dev/cpu_dma_latency"
  - "/dev/cuse"
  - "/dev/dma_heap/system"
  - "/dev/full"
  - "/dev/fuse"
  - "/dev/gpiochip0"
  - "/dev/input/event0"
  - "/dev/input/event1"
  - "/dev/kmsg"
  - "/dev/loop-control"
  - "/dev/mapper/control"
  - "/dev/net/tun"
  - "/dev/ng0n1"
  - "/dev/ng1n1"
  - "/dev/null"
  - "/dev/nvme0"
  - "/dev/nvme1"
  - "/dev/ppp"
  - "/dev/ptmx"
  - "/dev/pts/0"
  - "/dev/pts/1"
  - "/dev/pts/ptmx"
  - "/dev/random"
  - "/dev/rtc0"
  - "/dev/snapshot"
  - "/dev/tty"
  - "/dev/tty0"
  - "/dev/tty1"
  - "/dev/tty10"
  - "/dev/tty11"
  - "/dev/tty12"
  - "/dev/tty13"
  - "/dev/tty14"
  - "/dev/tty15"
  - "/dev/tty16"
  - "/dev/tty17"
  - "/dev/tty18"
  - "/dev/tty19"
  - "/dev/tty2"
  - "/dev/tty20"
  - "/dev/tty21"
  - "/dev/tty22"
  - "/dev/tty23"
  - "/dev/tty24"
  - "/dev/tty25"
  - "/dev/tty26"
  - "/dev/tty27"
  - "/dev/tty28"
  - "/dev/tty29"
  - "/dev/tty3"
  - "/dev/tty30"
  - "/dev/tty31"
  - "/dev/tty32"
  - "/dev/tty33"
  - "/dev/tty34"
  - "/dev/tty35"
  - "/dev/tty36"
  - "/dev/tty37"
  - "/dev/tty38"
  - "/dev/tty39"
  - "/dev/tty4"
  - "/dev/tty40"
  - "/dev/tty41"
  - "/dev/tty42"
  - "/dev/tty43"
  - "/dev/tty44"
  - "/dev/tty45"
  - "/dev/tty46"
  - "/dev/tty47"
  - "/dev/tty48"
  - "/dev/tty49"
  - "/dev/tty5"
  - "/dev/tty50"
  - "/dev/tty51"
  - "/dev/tty52"
  - "/dev/tty53"
  - "/dev/tty54"
  - "/dev/tty55"
  - "/dev/tty56"
  - "/dev/tty57"
  - "/dev/tty58"
  - "/dev/tty59"
  - "/dev/tty6"
  - "/dev/tty60"
  - "/dev/tty61"
  - "/dev/tty62"
  - "/dev/tty63"
  - "/dev/tty7"
  - "/dev/tty8"
  - "/dev/tty9"
  - "/dev/ttyS0"
  - "/dev/ttyS1"
  - "/dev/ttyS2"
  - "/dev/ttyS3"
  - "/dev/uhid"
  - "/dev/uinput"
  - "/dev/urandom"
  - "/dev/userfaultfd"
  - "/dev/vcs"
  - "/dev/vcs1"
  - "/dev/vcs2"
  - "/dev/vcs3"
  - "/dev/vcs4"
  - "/dev/vcs5"
  - "/dev/vcs6"
  - "/dev/vcsa"
  - "/dev/vcsa1"
  - "/dev/vcsa2"
  - "/dev/vcsa3"
  - "/dev/vcsa4"
  - "/dev/vcsa5"
  - "/dev/vcsa6"
  - "/dev/vcsu"
  - "/dev/vcsu1"
  - "/dev/vcsu2"
  - "/dev/vcsu3"
  - "/dev/vcsu4"
  - "/dev/vcsu5"
  - "/dev/vcsu6"
  - "/dev/vfio/vfio"
  - "/dev/vga_arbiter"
  - "/dev/vhost-net"
  - "/dev/vhost-vsock"
  - "/dev/vmclock0"
  - "/dev/zero"
u26_dev_exclude_dirs:
  - mqueue
  - shm

# U-28 : IP 기반 접근제어 (SG 22번 인바운드 부재 기반 자동판정, 별도 변수 불필요)

# U-30 : UMASK 설정
u30_umask_min: "022"

# U-31 : 숨김 디렉터리 점검
u31_os_baseline_hidden_entries:
  - .ssh
  - .cache
  - .config
  - .local
  - .bash_history
  - .aws
  - .kube
  - .ansible
  - .gnupg

# U-33 : 불필요한 파일 제거
u33_business_file_dirs:
  - /opt
  - /srv
  - /var/www
  - /app

# U-40 : NFS 접근 통제
u40_nfs_allowed_hosts: null
u40_exports_perm_max: "0644"

# U-42 : 불필요한 RPC 서비스 비활성화
u42_unnecessary_rpc_services:
  - rpcbind.service
  - rpcbind.socket
  - ypbind.service

# U-45,47,49,50,51,56,61 : 미사용 예정 서비스 관련
u45_mail_latest_version: null
u47_relay_allowed_list: null
u49_dns_patch_baseline: null
u50_dns_allowed_secondaries: null
u51_dns_dynamic_update_allowed: null
u56_ftp_allowed_hosts: null
u61_snmp_allowed_hosts: null

# U-60 : SNMP Community String 복잡성
u60_snmp_community_blacklist:
  - public
  - private

# U-64 : 주기적 보안 패치 및 벤더 권고사항 적용
u64_eks_optimized_ami_ssm_param: "/aws/service/eks/optimized-ami/1.36/amazon-linux-2023/x86_64/standard/recommended/image_id"
u64_nat_latest_ami_ssm_param: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64"
u64_dnf_patch_max_age_days: 30

# U-66 : 정책에 따른 시스템 로깅 설정
u66_missing_log_categories:
  - "SSM 세션로그"
  - "sudo 로그"
  - "DB 감사로그"
u66_log_group_name: null
u66_log_retention_min_days: 365

# U-65 : NTP 및 시각 동기화 설정
u65_ntp_allowed_servers: ["169.254.169.123"]

# =============================================================================
# DBMS(D-XX) 기준값
# =============================================================================

# D-26 : 데이터베이스 감사 기록 보관기간
d26_audit_not_implemented: true
d26_audit_log_group_name: null

# 서비스별 DB 계정/DB명/NetworkPolicy 라벨 매핑 (D-02/04/06/10 공통 참조)
dbms_service_accounts:
  - service: member-service
    engine: mysql
    database: member_db
    account: member_service
  - service: auth-service
    engine: mysql
    database: auth_db
    account: auth_service
  - service: order-service
    engine: mysql
    database: order_db
    account: order_service
  - service: payment-service
    engine: mysql
    database: payment_db
    account: payment_service
  - service: product-service
    engine: postgresql
    database: product_db
    account: product_service
  - service: oms-service
    engine: postgresql
    database: oms_db
    account: oms_service
  - service: wms-service
    engine: postgresql
    database: wms_db
    account: wms_service
  - service: scm-service
    engine: postgresql
    database: scm_db
    account: scm_service

# D-02 : 불필요 계정 제거
d02_unnecessary_account_whitelist:
  - member_service
  - auth_service
  - order_service
  - payment_service
  - oms_service
  - product_service
  - wms_service
  - scm_service

# D-03 : 비밀번호 사용기간·복잡도 (서비스 계정 제외, 전용 유저 계정에만 적용)
d03_password_max_days: 90
d03_password_min_length: 12
d03_password_complexity_min_classes: 3
d03_user_accounts:
  mysql: []
  postgresql: []

# D-04 : 관리자 권한 최소 인원
d04_admin_account_whitelist: []

# D-05 : 비밀번호 재사용 제한
d05_applicable: true
d05_password_reuse_limit: 3

# D-17 : Audit Table 접근 제한 (PostgreSQL 관리자 화이트리스트)
d17_admin_account_whitelist:
  - postgres

# D-10 : 원격 DB 서버 접속 제한 (NetworkPolicy 라벨 키)
d10_np_label_key: "app"

# D-20 : 인가되지 않은 Object Owner 제한
d20_admin_owner_whitelist:
  - postgres
  - product_service
  - wms_service
  - scm_service

# D-21 : 인가되지 않은 GRANT OPTION 사용 제한
d21_grant_option_admin_whitelist:
  - root
  - postgres

# DB 접속 정보 — oms_db(PostgreSQL)는 Secret 미확정으로 제외
dbms_connections:
  - service: member_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: auth_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: order_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: payment_db
    engine: mysql
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    secret_ref: "shared-mysql-accounts"
    namespace: backend
    pod_label_selector: "app.kubernetes.io/instance=shared-mysql"
  - service: product_db
    engine: postgresql
    host: "shared-pg-rw.backend.svc.cluster.local"
    port: 5432
    secret_ref: "shared-pg-product-service-credentials"
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "product_db"
  - service: wms_db
    engine: postgresql
    host: "shared-pg-rw.backend.svc.cluster.local"
    port: 5432
    secret_ref: "shared-pg-wms-service-credentials"
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "wms_db"
  - service: scm_db
    engine: postgresql
    host: "shared-pg-rw.backend.svc.cluster.local"
    port: 5432
    secret_ref: "shared-pg-scm-service-credentials"
    namespace: backend
    pod_label_selector: "cnpg.io/cluster=shared-pg"
    database: "scm_db"
  # oms_db(PostgreSQL) — secret_ref 확정 전까지 제외
  # - service: oms_db
  #   engine: postgresql
  #   host: "shared-pg-rw.backend.svc.cluster.local"
  #   port: 5432
  #   secret_ref: null
  #   namespace: backend
  #   pod_label_selector: "cnpg.io/cluster=shared-pg"
  #   database: "oms_db"

# DBMS 관리자(admin) 접속 정보 — D-01/02/04/06/08/11/18/20/21 전용(그 외 항목은 dbms_connections 사용)
dbms_admin_connections:
  mysql:
    host: "shared-mysql-primary.svc.cluster.local"
    port: 3306
    namespace: backend
    secret_ref: "moco-shared-mysql"
    secret_username: "root"
    secret_password_key: "ROOT_PASSWORD"
  postgresql:
    host: "shared-pg-rw.backend.svc.cluster.local"
    port: 5432
    namespace: backend
    secret_ref: "shared-pg-superuser"

# =============================================================================
# 인증_인가(AUTHZ-XX, SVC-01) 기준값
# =============================================================================
authz_backend_namespace: "backend"
authz_internal_path_prefix: "/internal"

# SVC-01 : 서비스 간 NetworkPolicy 화이트리스트
svc01_allowed_service_calls:
  - { caller: "order-service",   callee: "oms-service" }
  - { caller: "product-service", callee: "order-service" }
  - { caller: "payment-service", callee: "order-service" }
  - { caller: "order-service",   callee: "payment-service" }
  - { caller: "order-service",   callee: "product-service" }
  - { caller: "order-service",   callee: "user-service" }
  - { caller: "auth-service",    callee: "user-service" }
  - { caller: "oms-service",     callee: "auth-service" }
  - { caller: "wms-service",     callee: "auth-service" }
  - { caller: "scm-service",     callee: "auth-service" }
  - { caller: "order-service",   callee: "auth-service" }
  - { caller: "payment-service", callee: "auth-service" }
  - { caller: "product-service", callee: "auth-service" }
  - { caller: "user-service",    callee: "auth-service" }

# AUTHZ-09 : WMS→OMS 반품검수 RabbitMQ 발행/구독 권한
authz09_shared_account_blocks_check: true    # true인 동안 판정 FAIL 고정 — 계정 분리 완료 시 false로 전환
authz09_rabbitmq_management_url: null
authz09_rabbitmq_readonly_user_secret: null
authz09_rabbitmq_vhost: "total-prod"
authz09_rabbitmq_exchange: "wms.topic.exchange"
authz09_rabbitmq_routing_key: "wms.return.inspected"
authz09_rabbitmq_exchange_dedicated: false
authz09_rabbitmq_oms_queue: "oms.wms-inspected.queue"
authz09_rabbitmq_publisher_allowed: ["wms-service"]
authz09_rabbitmq_consumer_allowed: ["oms-service"]
authz09_rabbitmq_publisher_user: null
authz09_rabbitmq_consumer_user: null
