---
# U-01~U-13, U-63 계정 관리

# U-01 | root 계정 원격 접속 제한
- name: "U-01 | sshd 실행 여부 및 실제 적용 PermitRootLogin 조회"
  ansible.builtin.shell: |
    if ! systemctl is-active --quiet sshd; then echo "INACTIVE"; exit 0; fi
    sshd -T 2>/dev/null | awk '$1=="permitrootlogin"{print $2}'
  args:
    executable: /bin/bash
  register: u01_raw
  changed_when: false
  failed_when: false

- name: "U-01 | 판정 기록"
  vars:
    u01_value: "{{ u01_raw.stdout | default('') | trim | lower }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-01', 'item': 'root 계정 원격 접속 제한',
      'status': 'PASS' if u01_value in ['inactive', 'no'] else 'FAIL',
      'detail': ('sshd 미사용(원격터미널 서비스 비활성)' if u01_value == 'inactive'
                 else '실제 적용 PermitRootLogin=' ~ (u01_value if u01_value | length > 0 else '조회 실패') ~ ' (기준: no)')
    }] }}"

# U-02 | 비밀번호 관리정책 설정
- name: "U-02 | 비밀번호 정책 설정값 조회"
  ansible.builtin.shell: |
    get_kv() { sed -E 's/#.*//' "$@" 2>/dev/null | awk -F= -v k="$KEY" '{gsub(/[ \t]/,"",$1); gsub(/[ \t]/,"",$2)} $1==k {v=$2} END {print v}'; }
    for k in minlen dcredit ucredit lcredit ocredit; do
      echo "$k=$(KEY=$k get_kv /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf)"
    done
    echo "pass_max_days=$(awk '$1=="PASS_MAX_DAYS" {v=$2} END {print v}' /etc/login.defs)"
    echo "pass_min_days=$(awk '$1=="PASS_MIN_DAYS" {v=$2} END {print v}' /etc/login.defs)"
    pam="/etc/pam.d/system-auth /etc/pam.d/password-auth"
    rem=$(grep -hE '^\s*password.*pam_(pwhistory|unix)\.so.*remember=' $pam 2>/dev/null | grep -oE 'remember=[0-9]+' | cut -d= -f2 | sort -n | tail -1)
    if [ -z "$rem" ] && grep -qE '^\s*password.*pam_pwhistory\.so' $pam 2>/dev/null; then
      rem=$(KEY=remember get_kv /etc/security/pwhistory.conf); rem=${rem:-10}
    fi
    echo "remember=$rem"
  args:
    executable: /bin/bash
  register: u02_raw
  changed_when: false
  failed_when: false

- name: "U-02 | 판정 기록"
  vars:
    u02_v: "{{ u02_raw.stdout_lines | default([]) | map('regex_replace', '^([a-z_]+)=(.*)$', '\\1: \"\\2\"') | join('\n') | from_yaml | default({}, true) }}"
    u02_failed: >-
      {{ []
         + ([] if (u02_v.minlen | default('') | length > 0 and u02_v.minlen | int >= u02_pwquality.minlen) else ['최소 길이 ' ~ u02_pwquality.minlen ~ '자 이상(minlen)'])
         + ([] if (u02_v.dcredit | default('') | length > 0 and u02_v.dcredit | int <= u02_pwquality.dcredit) else ['숫자 포함(dcredit)'])
         + ([] if (u02_v.ocredit | default('') | length > 0 and u02_v.ocredit | int <= u02_pwquality.ocredit) else ['특수문자 포함(ocredit)'])
         + ([] if ((u02_v.ucredit | default('') | length > 0 and u02_v.ucredit | int <= u02_pwquality.ucredit)
                   or (u02_v.lcredit | default('') | length > 0 and u02_v.lcredit | int <= u02_pwquality.lcredit)) else ['영문 포함(ucredit/lcredit)'])
         + ([] if (u02_v.pass_max_days | default('') | length > 0 and u02_v.pass_max_days | int <= u02_pass_max_days) else ['최대 사용기간 ' ~ u02_pass_max_days ~ '일 이하(PASS_MAX_DAYS)'])
         + ([] if (u02_v.pass_min_days | default('') | length > 0 and u02_v.pass_min_days | int >= u02_pass_min_days) else ['최소 사용기간 ' ~ u02_pass_min_days ~ '일 이상(PASS_MIN_DAYS)'])
         + ([] if (u02_v.remember | default('') | length > 0 and u02_v.remember | int >= u02_remember_min) else ['최근 비밀번호 ' ~ u02_remember_min ~ '회 이상 기억(remember)']) }}
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-02', 'item': '비밀번호 관리정책 설정',
      'status': 'PASS' if u02_failed | length == 0 else 'FAIL',
      'detail': '미충족 기준: ' ~ (u02_failed | join(', ') if u02_failed | length > 0 else '없음') ~ ' / 현재값: ' ~ (u02_raw.stdout_lines | default([]) | join(', '))
    }] }}"

# U-03 | 계정 잠금 임계값 설정
- name: "U-03 | pam_faillock 적용 여부 및 잠금 임계값(deny) 조회"
  ansible.builtin.shell: |
    pam="/etc/pam.d/system-auth /etc/pam.d/password-auth"
    if ! grep -qE '^\s*auth.*pam_faillock\.so' $pam 2>/dev/null; then echo "NO_PAM"; exit 0; fi
    d=$(grep -hE '^\s*auth.*pam_faillock\.so.*deny=' $pam 2>/dev/null | grep -oE 'deny=[0-9]+' | cut -d= -f2 | sort -n | tail -1)
    [ -z "$d" ] && d=$(sed -E 's/#.*//' /etc/security/faillock.conf 2>/dev/null | awk -F= '{gsub(/[ \t]/,"",$1); gsub(/[ \t]/,"",$2)} $1=="deny" {v=$2} END {print v}')
    echo "${d:-3}"
  args:
    executable: /bin/bash
  register: u03_raw
  changed_when: false
  failed_when: false

- name: "U-03 | 판정 기록"
  vars:
    u03_value: "{{ u03_raw.stdout | default('') | trim }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-03', 'item': '계정 잠금 임계값 설정',
      'status': 'PASS' if (u03_value is match('^[0-9]+$') and 0 < (u03_value | int) <= u03_deny_max) else 'FAIL',
      'detail': ('PAM(system-auth/password-auth)에 pam_faillock 미적용 — 잠금 임계값 미설정' if u03_value == 'NO_PAM'
                 else '잠금 임계값 deny=' ~ u03_value ~ ' (기준: 1~' ~ u03_deny_max ~ '회, 0은 잠금 없음)')
    }] }}"

# U-04 | 비밀번호 파일 보호
- name: "U-04 | /etc/shadow 존재 확인"
  ansible.builtin.stat:
    path: /etc/shadow
  register: u04_shadow

- name: "U-04 | 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-04', 'item': '비밀번호 파일 보호',
      'status': 'PASS' if u04_shadow.stat.exists else 'FAIL',
      'detail': '/etc/shadow exists=' ~ (u04_shadow.stat.exists | string)
    }] }}"

# U-05 | root 이외의 UID가 ‘0’ 금지
- name: "U-05 | UID 0 계정 조회"
  ansible.builtin.shell: "set -o pipefail && awk -F: '$3 == 0 {print $1}' /etc/passwd"
  args:
    executable: /bin/bash
  register: u05_raw
  changed_when: false
  failed_when: false

- name: "U-05 | 판정 기록"
  vars:
    u05_others: "{{ (u05_raw.stdout_lines | default([])) | reject('equalto', 'root') | list }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-05', 'item': 'root 이외의 UID가 ‘0’ 금지',
      'status': 'PASS' if (u05_others | length == 0) else 'FAIL',
      'detail': 'UID 0 계정: ' ~ (u05_raw.stdout_lines | default([]) | join(', '))
    }] }}"

# U-06 | 사용자 계정 su 기능 제한
- name: "U-06 | /etc/pam.d/su 내 pam_wheel 확인"
  ansible.builtin.command: grep -E '^\s*auth\s+(required|requisite)\s+pam_wheel\.so' /etc/pam.d/su
  register: u06_raw
  changed_when: false
  failed_when: false

- name: "U-06 | 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-06', 'item': '사용자 계정 su 기능 제한',
      'status': 'PASS' if (u06_raw.rc == 0) else 'FAIL',
      'detail': u06_raw.stdout | default('pam_wheel 설정 없음', true)
    }] }}"

# U-07 | 불필요한 계정 제거
- name: "U-07 | 블랙리스트 계정별 상태 조회"
  ansible.builtin.command: getent passwd {{ item }}
  register: u07_blacklist_check
  changed_when: false
  failed_when: false
  loop: "{{ u07_unnecessary_accounts }}"

- name: "U-07 | 사람 계정(UID>=1000, 로그인 셸 보유) 목록 조회"
  ansible.builtin.shell: "set -o pipefail && awk -F: '$3>=1000 && $7 !~ /nologin|false/ {print $1}' /etc/passwd"
  args:
    executable: /bin/bash
  register: u07_human_accounts_raw
  changed_when: false
  failed_when: false

- name: "U-07 | lastlog 기반 미사용(threshold일 초과) 계정 조회"
  ansible.builtin.shell: "set -o pipefail && lastlog -b {{ u07_unused_login_days_threshold }} 2>/dev/null | awk 'NR>1{print $1}'"
  args:
    executable: /bin/bash
  register: u07_stale_raw
  changed_when: false
  failed_when: false

- name: "U-07 | 판정 기록"
  vars:
    u07_found: "{{ u07_blacklist_check.results | selectattr('rc', 'equalto', 0) | list }}"
    u07_risky: "{{ u07_found | selectattr('stdout', 'search', '/bin/(bash|sh)$') | list }}"
    u07_human_accounts: "{{ u07_human_accounts_raw.stdout_lines | default([]) }}"
    u07_stale_accounts: "{{ (u07_stale_raw.stdout_lines | default([])) | intersect(u07_human_accounts) | difference(u07_stale_check_exclude_accounts | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-07', 'item': '불필요한 계정 제거',
      'status': 'FAIL' if (u07_risky | length > 0 or u07_stale_accounts | length > 0) else 'PASS',
      'detail': '로그인 가능한 블랙리스트 계정: ' ~ (u07_risky | map(attribute='stdout') | join('; ') if u07_risky | length > 0 else '없음') ~
                ' / 존재하지만 로그인 제한된 계정: ' ~ ((u07_found | length - u07_risky | length) | string) ~ '개(참고, 업무영향 확인 후 제거 권고)' ~
                ' / ' ~ (u07_unused_login_days_threshold | string) ~ '일 이상 미로그인 사람 계정: ' ~ (u07_stale_accounts | join(', ') if u07_stale_accounts | length > 0 else '없음') ~
                ' (미사용 판정 제외 — SSM 접속용 필수 계정: ' ~ (u07_stale_check_exclude_accounts | default([]) | join(', ')) ~ ')'
    }] }}"

# U-08 | 관리자 그룹에 최소한의 계정 포함
- name: "U-08 | root 그룹 구성원 조회"
  ansible.builtin.shell: "set -o pipefail && getent group root | awk -F: '{print $4}'"
  args:
    executable: /bin/bash
  register: u08_raw
  changed_when: false
  failed_when: false

- name: "U-08 | 판정 기록"
  vars:
    u08_members: "{{ (u08_raw.stdout | default('')).split(',') | reject('equalto', '') | list }}"
    u08_unauthorized: "{{ u08_members | difference(u08_root_group_admin_whitelist | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-08', 'item': '관리자 그룹에 최소한의 계정 포함',
      'status': (
        'SKIP' if u08_root_group_admin_whitelist is none else
        ('PASS' if u08_unauthorized | length == 0 else 'FAIL')
      ),
      'detail': (
        'root 그룹 구성원: ' ~ (u08_members | join(', ') if u08_members | length > 0 else '없음') ~
        (' — 기준값(화이트리스트) TODO, 참고용 목록만 보고' if u08_root_group_admin_whitelist is none
         else ' / 미인가 구성원: ' ~ (u08_unauthorized | join(', ') if u08_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# U-09 | 계정이 존재하지 않는 GID 금지
- name: "U-09 | 계정이 없는 그룹 조회(/etc/group ↔ /etc/passwd)"
  ansible.builtin.shell: |
    set -o pipefail
    gid_min=$(awk '$1=="GID_MIN"{print $2}' /etc/login.defs 2>/dev/null)
    awk -F: -v min="${gid_min:-1000}" 'NR==FNR {used[$4]=1; next}
      $3+0 >= min+0 && $3 != 65534 && !($3 in used) && $4 == "" {print $1}' /etc/passwd /etc/group
  args:
    executable: /bin/bash
  register: u09_raw
  changed_when: false
  failed_when: false

- name: "U-09 | 판정 기록"
  vars:
    u09_unauthorized: "{{ u09_raw.stdout_lines | default([]) | difference(u09_allowed_empty_groups | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-09', 'item': '계정이 존재하지 않는 GID 금지',
      'status': 'PASS' if u09_unauthorized | length == 0 else 'FAIL',
      'detail': '계정이 없는 사용자 생성 그룹(기본 그룹·보조 구성원 모두 없음): ' ~ (u09_unauthorized | join(', ') if u09_unauthorized | length > 0 else '없음')
    }] }}"

# U-10 | 동일한 UID 금지
- name: "U-10 | UID 중복 조회"
  ansible.builtin.shell: "set -o pipefail && awk -F: '{print $3}' /etc/passwd | sort | uniq -d"
  args:
    executable: /bin/bash
  register: u10_raw
  changed_when: false
  failed_when: false

- name: "U-10 | 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-10', 'item': '동일한 UID 금지',
      'status': 'PASS' if (u10_raw.stdout | default('') | length == 0) else 'FAIL',
      'detail': '중복 UID: ' ~ (u10_raw.stdout | default('없음', true))
    }] }}"

# U-11 | 사용자 shell 점검
- name: "U-11 | UID_MIN 조회"
  ansible.builtin.shell: set -o pipefail && awk '/^UID_MIN/{print $2}' /etc/login.defs
  args:
    executable: /bin/bash
  register: u11_uidmin_raw
  changed_when: false
  failed_when: false

- name: "U-11 | 로그인 shell 가진 시스템 계정 조회"
  vars:
    u11_uidmin: "{{ u11_uidmin_raw.stdout | default('1000', true) | trim | int }}"
  ansible.builtin.shell: >
    set -o pipefail &&
    awk -F: -v m="{{ u11_uidmin }}" '($3>0 && $3<m && $1!="root" && $7 ~ /(bash|sh)$/){print $1}' /etc/passwd
  args:
    executable: /bin/bash
  register: u11_raw
  changed_when: false
  failed_when: false

- name: "U-11 | 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-11', 'item': '사용자 shell 점검',
      'status': 'PASS' if (u11_raw.stdout | default('') | length == 0) else 'FAIL',
      'detail': '로그인 가능 시스템 계정: ' ~ (u11_raw.stdout | default('없음', true))
    }] }}"

# U-12 | 세션 종료 시간 설정
- name: "U-12 | TMOUT 설정 조회"
  ansible.builtin.shell: set -o pipefail && grep -rh '^\s*TMOUT=' /etc/profile /etc/profile.d/*.sh 2>/dev/null | head -1
  args:
    executable: /bin/bash
  register: u12_raw
  changed_when: false
  failed_when: false

- name: "U-12 | 판정 기록"
  vars:
    u12_value: "{{ (u12_raw.stdout | default('') | regex_search('[0-9]+')) | default('999999', true) | int }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-12', 'item': '세션 종료 시간 설정',
      'status': 'PASS' if (u12_raw.stdout | default('') | length > 0 and u12_value <= u12_tmout_max_seconds) else 'FAIL',
      'detail': u12_raw.stdout | default('TMOUT 미설정', true)
    }] }}"

# U-13 | 안전한 비밀번호 암호화 알고리즘 사용
- name: "U-13 | ENCRYPT_METHOD 조회"
  ansible.builtin.shell: set -o pipefail && grep -E '^\s*ENCRYPT_METHOD' /etc/login.defs
  args:
    executable: /bin/bash
  register: u13_raw
  changed_when: false
  failed_when: false

- name: "U-13 | 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-13', 'item': '안전한 비밀번호 암호화 알고리즘 사용',
      'status': 'PASS' if (u13_raw.stdout | default('') | upper | regex_replace('^\\s*ENCRYPT_METHOD\\s+', '') | trim) in u13_allowed_encrypt_methods else 'FAIL',
      'detail': u13_raw.stdout | default('ENCRYPT_METHOD 미설정(배포판 기본값 확인 필요)', true)
    }] }}"

# U-63 | sudo 명령어 접근 관리
- name: "U-63 | /etc/sudoers 소유자·권한 조회"
  ansible.builtin.stat:
    path: /etc/sudoers
  register: u63_raw

- name: "U-63 | 판정 기록"
  vars:
    u63_mode_ok: "{{ (u63_raw.stat.mode | default('0777') | int(base=8)) <= ('0640' | int(base=8)) }}"
    u63_owner_ok: "{{ u63_raw.stat.pw_name | default('') == 'root' }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-63', 'item': 'sudo 명령어 접근 관리',
      'status': 'PASS' if (u63_mode_ok and u63_owner_ok) else 'FAIL',
      'detail': 'owner=' ~ (u63_raw.stat.pw_name | default('?')) ~ ' mode=' ~ (u63_raw.stat.mode | default('?'))
    }] }}"
