---
# PostgreSQL 대상 D-XX 점검 — CNPG 파드(postgres 컨테이너) 내부 psql로 실행(로컬 소켓, 별도 Secret 불필요)

- name: "{{ db_conn.service }} | 파드 내부 쿼리 실행 준비"
  ansible.builtin.include_tasks: db_exec_prepare.yml

# D-01 | 기본 계정(postgres) 잠금 상태 (원문 OR 조건 — 잠금만으로도 양호, rolcanlogin으로
# MySQL account_locked와 동일 원칙 판정. 비밀번호 변경 여부는 두 엔진 다 검증 불가)
- name: "{{ db_conn.service }} | D-01 postgres 계정 비밀번호·잠금 상태 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d01_raw
    dbq_db: postgres
    dbq_sql: "SELECT r.rolcanlogin, (a.rolpassword IS NOT NULL) AS has_password FROM pg_roles r JOIN pg_authid a ON a.oid = r.oid WHERE r.rolname='postgres'"

- name: "{{ db_conn.service }} | D-01 판정 기록"
  vars:
    d01_row: "{{ d01_raw.query_result | default([]) | first | default({}) }}"
    d01_locked: "{{ d01_row.rolcanlogin is defined and d01_row.rolcanlogin == false }}"
    d01_changed: "{{ d01_row.has_password | default(false) == true }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-01', 'item': '기본 계정의 비밀번호, 정책 등을 변경하여 사용', 'target': db_conn.service,
      'status': 'FAIL' if d01_raw.query_result is not defined else ('PASS' if (d01_changed or d01_locked) else 'FAIL'),
      'detail': '조회 실패' if d01_raw.query_result is not defined else ('postgres — 초기 비밀번호 변경(비밀번호 설정 여부)=' ~ (d01_changed | string) ~ (' — 비밀번호 미설정(NULL, 초기 상태)' if not d01_changed else '') ~ ' / 잠금설정(rolcanlogin=false)=' ~ (d01_locked | string) ~ ' — 둘 중 하나 충족 시 양호' ~ ((' [구조적 FAIL — CNPG enableSuperuserAccess=false 구성상 오퍼레이터가 postgres 비밀번호를 NULL로 유지해 원격 superuser 로그인을 원천 차단하고, 오퍼레이터가 postgres로 클러스터를 관리해 잠금(NOLOGIN)도 불가. 비밀번호를 설정하려면 원격 superuser 접속을 열어야 해 보안이 오히려 약해지므로 인프라팀 조치로 해소할 수 없음. 초기 비밀번호 원격 대입 위험은 구조적으로 차단돼 있으나, 법적 기준이라 예외 처리하지 않고 미준수로 보고]') if not (d01_changed or d01_locked) else ''))
    }] }}"

# D-02 | 불필요 계정 제거
- name: "{{ db_conn.service }} | D-02 전체 Role 목록 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d02_raw
    dbq_db: postgres
    dbq_sql: "SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname NOT LIKE 'pg\\_%' AND rolname != 'postgres'"

- name: "{{ db_conn.service }} | D-02 판정 기록"
  vars:
    d02_query_ok: "{{ d02_raw.query_result is defined }}"
    d02_accounts: "{{ d02_raw.query_result | default([]) | selectattr('rolcanlogin', 'equalto', true) | map(attribute='rolname') | list }}"
    d02_locked: "{{ d02_raw.query_result | default([]) | rejectattr('rolcanlogin', 'equalto', true) | map(attribute='rolname') | list }}"
    d02_unauthorized: "{{ d02_accounts | difference((d02_unnecessary_account_whitelist | default([])) + dbms_operator_accounts.postgresql + dbms_dba_accounts) if d02_unnecessary_account_whitelist else [] }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-02', 'item': '데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용', 'target': db_conn.service,
      'status': 'SKIP' if d02_unnecessary_account_whitelist is none else ('PASS' if (d02_query_ok and d02_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        '전체 Role 목록(화이트리스트 TODO, 참고용): ' ~ (d02_accounts | join(', ') if d02_accounts | length > 0 else '없음') if d02_unnecessary_account_whitelist is none
        else ('조회 실패' if not d02_query_ok else '화이트리스트 외 로그인 가능 계정: ' ~ (d02_unauthorized | join(', ') if d02_unauthorized | length > 0 else '없음') ~ ' / 잠금된 계정(원문상 잠금 후 사용 허용 — 판정 제외): ' ~ (d02_locked | join(', ') if d02_locked | length > 0 else '없음'))
      )
    }] }}"

# D-03 | 비밀번호 사용기간·복잡도 (서비스 계정 제외, 전용 유저 계정에만 적용)
- name: "{{ db_conn.service }} | D-03 판정 기록(서비스 계정 — 법정 기준 미적용)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-03', 'item': '비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정', 'target': db_conn.service,
      'status': 'FAIL',
      'detail': '서비스 계정에 비밀번호 만료(90일)·복잡도 정책 미적용 — 자동 로테이션 없이 강제 만료 시 서비스 장애 위험(DBA 협의). 법적 근거 있는 기준이라 예외 처리하지 않고 미준수로 보고. 전용 유저 계정에는 이 정책을 적용 중(아래 별도 행 참고)'
    }] }}"

- name: "D-03 | passwordcheck 모듈 로드 여부 조회(PostgreSQL, 최초 커넥션에서 1회)"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d03_ext_raw
    dbq_db: postgres
    dbq_sql: "SELECT current_setting('shared_preload_libraries') AS shared_preload_libraries"
  when: >
    d03_user_accounts.postgresql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0)

- name: "D-03 | 전용 유저 계정 rolvaliduntil 조회(PostgreSQL, 최초 커넥션에서 1회)"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d03_user_raw
    dbq_db: postgres
    dbq_sql: >-
      SELECT rolname, rolvaliduntil,
        (rolvaliduntil IS NOT NULL AND rolvaliduntil <= now() + interval '{{ d03_password_max_days }} days') AS within_policy
      FROM pg_roles
  when: >
    d03_user_accounts.postgresql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0)

- name: "D-03 | dba_admin 비밀번호 자동 교체 이력 초기화(PostgreSQL, 최초 커넥션에서 1회)"
  ansible.builtin.set_fact:
    d03_rotated_at: ""
  when: >
    d03_user_accounts.postgresql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0)

- name: "D-03 | dba_admin 비밀번호 자동 교체 이력 조회(PostgreSQL, 최초 커넥션에서 1회)"
  ansible.builtin.set_fact:
    d03_rotated_at: "{{ (((query('kubernetes.core.k8s', kind='Secret', name=d03_rotation.secrets.postgresql, namespace=d03_rotation.namespace) | first | default({})).metadata | default({})).annotations | default({}))[d03_rotation.annotation] | default('') }}"
  when: >
    d03_user_accounts.postgresql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0)
  ignore_errors: true

- name: "D-03 | 전용 유저 계정 판정 기록(PostgreSQL, 최초 커넥션에서 1회)"
  vars:
    d03_query_ok: "{{ d03_user_raw is defined and d03_user_raw.query_result is defined and d03_ext_raw is defined and d03_ext_raw.query_result is defined }}"
    d03_preload_libs: "{{ (d03_ext_raw.query_result[0].values() | first) if (d03_query_ok and d03_ext_raw.query_result | length > 0) else '' }}"
    d03_ext_installed: "{{ d03_query_ok and ('passwordcheck' in (d03_preload_libs.split(',') | map('trim') | list)) }}"
    d03_all_roles: "{{ d03_user_raw.query_result | default([]) if d03_query_ok else [] }}"
    d03_found: "{{ d03_all_roles | selectattr('rolname', 'in', d03_user_accounts.postgresql) | list }}"
    d03_missing: "{{ d03_user_accounts.postgresql | difference(d03_found | map(attribute='rolname') | list) }}"
    d03_expiry_ok: "{{ (d03_found | selectattr('within_policy', 'equalto', true) | list | length) == d03_found | length }}"
    d03_rotation_days: "{{ ((now(utc=true) - (d03_rotated_at | regex_replace('([.][0-9]+)?(Z|[+-][0-9][0-9]:[0-9][0-9])?$', '') | to_datetime('%Y-%m-%dT%H:%M:%S'))).days) if (d03_rotated_at | default('') | length > 0) else -1 }}"
    d03_rotation_ok: "{{ d03_rotation_days | int >= 0 and d03_rotation_days | int <= d03_password_max_days | int }}"
    d03_rotation_desc: "{{ ('최근 교체 ' ~ d03_rotation_days ~ '일 전') if d03_rotation_days | int >= 0 else '교체 이력 없음' }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-03', 'item': '비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정', 'target': '전체(PostgreSQL 유저 계정)',
      'status': (
        'FAIL' if d03_user_accounts.postgresql | length == 0 else
        ('FAIL' if not d03_query_ok else
         ('FAIL' if (d03_missing | length > 0 or not (d03_expiry_ok or d03_rotation_ok) or not (d03_ext_installed or d03_rotation_ok)) else 'PASS'))
      ),
      'detail': (
        '전용 유저 계정 미생성 — 인프라팀 구현 대기(서비스 계정만 존재, 정책 적용대상 계정 없음)' if d03_user_accounts.postgresql | length == 0
        else ('조회 실패' if not d03_query_ok
        else ('계정 미발견: ' ~ (d03_missing | join(', ')) if d03_missing | length > 0
        else '사용기간 — DB 만료설정(rolvaliduntil ' ~ d03_password_max_days ~ '일 이내)=' ~ (d03_expiry_ok | string) ~ ' 또는 자동 교체(' ~ d03_rotation_desc ~ ', 기준 <= ' ~ d03_password_max_days ~ '일)=' ~ (d03_rotation_ok | string) ~
             ' / 복잡도 — passwordcheck 모듈 로드(shared_preload_libraries)=' ~ (d03_ext_installed | string) ~ ' 또는 자동 교체 생성규칙(12자·대소문자·숫자·특수문자 4종 보장)=' ~ (d03_rotation_ok | string)))
      )
    }] }}"
  when: check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(PostgreSQL 유저 계정)') | list | length == 0

# D-04 | 관리자 권한 최소 인원
- name: "{{ db_conn.service }} | D-04 SUPERUSER 보유 Role 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d04_raw
    dbq_db: postgres
    dbq_sql: "SELECT rolname FROM pg_roles WHERE rolsuper=true AND rolname != 'postgres'"

- name: "{{ db_conn.service }} | D-04 판정 기록"
  vars:
    d04_query_ok: "{{ d04_raw.query_result is defined }}"
    d04_admins: "{{ d04_raw.query_result | default([]) | map(attribute='rolname') | list }}"
    d04_unauthorized: "{{ d04_admins | difference((d04_admin_account_whitelist | default([])) + dbms_operator_accounts.postgresql) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-04', 'item': '데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용', 'target': db_conn.service,
      'status': 'SKIP' if d04_admin_account_whitelist is none else ('PASS' if (d04_query_ok and d04_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        'SUPERUSER 보유 Role(화이트리스트 TODO, 참고용): ' ~ (d04_admins | join(', ') if d04_admins | length > 0 else '없음') if d04_admin_account_whitelist is none
        else ('조회 실패' if not d04_query_ok else '화이트리스트 외 관리자 Role: ' ~ (d04_unauthorized | join(', ') if d04_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# D-05 | 비밀번호 재사용 제한 (원문 대상에 PostgreSQL 미기재, 네이티브 미지원)
- name: "{{ db_conn.service }} | D-05 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-05', 'item': '비밀번호 재사용에 대한 제약 설정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': '원문 대상 미기재 + PostgreSQL 네이티브 미지원(재사용 이력 자체를 저장하지 않음) — 해당없음'
    }] }}"

# D-06 | 계정 개별 부여(공용 계정 금지)
- name: "{{ db_conn.service }} | D-06 이 DB에 권한 있는 Role 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d06_raw
    dbq_db: "{{ db_conn.database | default('postgres') }}"
    # 이 DB 안 사용자 스키마 객체(테이블·뷰 등)의 소유자·권한 보유 Role — 카탈로그(pg_class.relacl)를
    # 직접 조회(information_schema 권한 뷰는 현재 Role 기준으로만 보여 누락될 수 있음)
    dbq_sql: >-
      SELECT DISTINCT r.rolname FROM pg_class c
      JOIN pg_namespace n ON n.oid = c.relnamespace
      CROSS JOIN LATERAL aclexplode(coalesce(c.relacl, acldefault('r', c.relowner))) a
      JOIN pg_roles r ON r.oid = a.grantee
      WHERE c.relkind IN ('r','p','v','m') AND n.nspname NOT IN ('pg_catalog','information_schema')
      AND n.nspname NOT LIKE 'pg\_%'

- name: "{{ db_conn.service }} | D-06 판정 기록"
  vars:
    d06_query_ok: "{{ d06_raw.query_result is defined }}"
    d06_users: "{{ d06_raw.query_result | default([]) | map(attribute='rolname') | list | unique }}"
    d06_expected: "{{ dbms_service_accounts | selectattr('database', 'equalto', db_conn.service) | map(attribute='account') | list }}"
    d06_mgmt: "{{ dbms_operator_accounts.postgresql + dbms_dba_accounts + ['postgres'] }}"
    d06_unexpected: "{{ d06_users | difference(d06_expected) | difference(d06_mgmt) }}"
    d06_expected_missing: "{{ d06_expected | difference(d06_users) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-06', 'item': 'DB 사용자 계정을 개별적으로 부여하여 사용', 'target': db_conn.service,
      'status': (
        'REVIEW' if d06_expected | length == 0 else
        ('FAIL' if not d06_query_ok else
         ('FAIL' if d06_unexpected | length > 0 else
          ('REVIEW' if d06_expected_missing | length > 0 else 'PASS')))
      ),
      'detail': (
        'dbms_service_accounts에 이 DB(' ~ db_conn.service ~ ')에 매핑된 계정 없음 — group_vars 매핑 확인 필요' if d06_expected | length == 0
        else ('조회 실패' if not d06_query_ok
        else ('이 DB에 권한 있는 계정: ' ~ (d06_users | join(', ') if d06_users | length > 0 else '없음') ~
              ' / 전용 계정(' ~ (d06_expected | join(', ')) ~ ')·관리 계정 외: ' ~ (d06_unexpected | join(', ') if d06_unexpected | length > 0 else '없음') ~
              (' / 전용 계정의 이 DB 권한 미확인 — 서비스가 다른 계정으로 접속 중인지 확인 필요' if d06_expected_missing | length > 0 else '')))
      )
    }] }}"

# D-08 | 안전한 암호화 알고리즘 사용 (scram-sha-256)
- name: "{{ db_conn.service }} | D-08 password_encryption 설정 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d08_raw
    dbq_db: postgres
    dbq_sql: "SELECT current_setting('password_encryption') AS password_encryption"

- name: "{{ db_conn.service }} | D-08 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-08', 'item': '안전한 암호화 알고리즘 사용', 'target': db_conn.service,
      'status': 'PASS' if (d08_raw.query_result is defined and 'scram-sha-256' in (d08_raw.query_result[0].values() | first)) else 'FAIL',
      'detail': d08_raw.query_result | default('조회 실패') | string | truncate(150)
    }] }}"

# D-09 | 로그인 실패 잠금 — PostgreSQL 네이티브 미지원
- name: "{{ db_conn.service }} | D-09 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-09', 'item': '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': 'PostgreSQL 네이티브 미지원 — connection pooler/외부 도구 필요(추가 설계 시 재검토)'
    }] }}"

# D-10 | 원격 DB 서버 접속 제한 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고

# D-11 | 시스템 테이블(pg_catalog) 접근 제한
- name: "{{ db_conn.service }} | D-11 pg_catalog PUBLIC 권한 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d11_raw
    dbq_db: postgres
    dbq_sql: >-
      SELECT grantee, table_name FROM information_schema.table_privileges
      WHERE table_schema='pg_catalog' AND grantee='PUBLIC' AND privilege_type != 'SELECT'
      AND NOT (table_name='pg_settings' AND privilege_type='UPDATE')

- name: "{{ db_conn.service }} | D-11 판정 기록"
  vars:
    d11_extra: "{{ d11_raw.query_result | default([]) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-11', 'item': '시스템 테이블 접근 제한', 'target': db_conn.service,
      'status': 'PASS' if (d11_raw.query_result is defined and d11_extra | length == 0) else 'FAIL',
      'detail': '조회 실패' if d11_raw.query_result is not defined else ('PUBLIC 과다 권한: ' ~ (d11_extra | string | truncate(150) if d11_extra | length > 0 else '없음'))
    }] }}"

# D-17 | Audit Table 접근 제한 (pgAudit 확장 로드 여부로 조건부 판정)
- name: "{{ db_conn.service }} | D-17 shared_preload_libraries 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d17_raw
    dbq_db: postgres
    dbq_sql: "SELECT current_setting('shared_preload_libraries') AS shared_preload_libraries"

- name: "{{ db_conn.service }} | D-17 판정 기록"
  vars:
    d17_libs: "{{ (d17_raw.query_result[0].values() | first) if d17_raw.query_result is defined else '' }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-17', 'item': 'Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한', 'target': db_conn.service,
      'status': 'PASS' if 'pgaudit' in d17_libs else 'FAIL',
      'detail': '조회 실패' if d17_raw.query_result is not defined else ('shared_preload_libraries=' ~ d17_libs ~ ' (pgAudit 미로드 시 감사기록 파이프라인 미구성으로 취약 판정)')
    }] }}"

# D-18 | PUBLIC Role 권한 제한 (원문 대상 "...Cubrid 등"의 "등"에 PostgreSQL 포함 확정,
#   PUBLIC 롤 개념이 원문 취지와 대응해 확장 적용 — 절대기준)
- name: "{{ db_conn.service }} | D-18 PUBLIC 권한 전체 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d18_raw
    dbq_db: "{{ db_conn.database | default('postgres') }}"
    dbq_sql: >
      SELECT table_schema, table_name, privilege_type FROM information_schema.table_privileges
      WHERE grantee='PUBLIC' AND table_schema NOT IN ('pg_catalog','information_schema')

- name: "{{ db_conn.service }} | D-18 판정 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-18', 'item': '응용프로그램 또는 DBA 계정의 Role이 Public으로 설정되지 않도록 조정', 'target': db_conn.service,
      'status': 'PASS' if (d18_raw.query_result is defined and d18_raw.query_result | length == 0) else 'FAIL',
      'detail': '조회 실패' if d18_raw.query_result is not defined else ('PUBLIC 권한 부여 현황(절대기준 — 있으면 FAIL): ' ~ (d18_raw.query_result | string | truncate(150)))
    }] }}"

# D-20 | 인가되지 않은 Object Owner 제한
- name: "{{ db_conn.service }} | D-20 테이블 소유자 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d20_raw
    dbq_db: "{{ db_conn.database | default('postgres') }}"
    dbq_sql: "SELECT DISTINCT tableowner FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema')"

- name: "{{ db_conn.service }} | D-20 판정 기록"
  vars:
    d20_query_ok: "{{ d20_raw.query_result is defined }}"
    d20_owners: "{{ d20_raw.query_result | default([]) | map(attribute='tableowner') | list }}"
    d20_unauthorized: "{{ d20_owners | difference(d20_admin_owner_whitelist | default([])) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-20', 'item': '인가되지 않은 Object Owner의 제한', 'target': db_conn.service,
      'status': 'SKIP' if d20_admin_owner_whitelist is none else ('PASS' if (d20_query_ok and d20_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        '테이블 소유자 목록(화이트리스트 TODO, 참고용): ' ~ (d20_owners | join(', ') if d20_owners | length > 0 else '없음') if d20_admin_owner_whitelist is none
        else ('조회 실패' if not d20_query_ok else '화이트리스트 외 소유자: ' ~ (d20_unauthorized | join(', ') if d20_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# D-21 | GRANT OPTION 부여 현황
- name: "{{ db_conn.service }} | D-21 GRANT OPTION 부여 현황 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d21_raw
    dbq_db: "{{ db_conn.database | default('postgres') }}"
    dbq_sql: "SELECT grantee, table_name FROM information_schema.role_table_grants WHERE is_grantable='YES'"

- name: "{{ db_conn.service }} | D-21 판정 기록"
  vars:
    d21_query_ok: "{{ d21_raw.query_result is defined }}"
    d21_grantees: "{{ d21_raw.query_result | default([]) | map(attribute='grantee') | list | unique }}"
    d21_unauthorized: "{{ d21_grantees | difference((d21_grant_option_admin_whitelist | default([])) + dbms_operator_accounts.postgresql) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-21', 'item': '인가되지 않은 GRANT OPTION 사용 제한', 'target': db_conn.service,
      'status': 'PASS' if (d21_query_ok and d21_unauthorized | length == 0) else 'FAIL',
      'detail': '조회 실패' if not d21_query_ok else ('GRANT OPTION 보유 계정: ' ~ (d21_grantees | join(', ') if d21_grantees | length > 0 else '없음') ~ ' / 화이트리스트(' ~ (d21_grant_option_admin_whitelist | join(', ')) ~ ') 외: ' ~ (d21_unauthorized | join(', ') if d21_unauthorized | length > 0 else '없음'))
    }] }}"

# D-25 | 주기적 보안 패치 적용 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고

- name: "{{ db_conn.service }} | 조회 실패 원인 기록"
  ansible.builtin.include_tasks: db_exec_errors.yml
