---
# DBMS 공통 : DB 파드 내부 쿼리 실행 준비

- name: "{{ db_conn.service }} | 이전 커넥션 쿼리 결과 초기화"
  ansible.builtin.set_fact:
    "{{ item }}": {}
  loop: [d01_raw, d02_raw, d03_user_raw, d03_policy_raw, d03_ext_raw, d04_raw, d05_raw, d06_raw,
         d08_raw, d09_version_raw, d09_raw, d11_raw, d18_raw, d20_raw, d21_raw, d25_version_raw, d26_raw]

- name: "{{ db_conn.service }} | 쿼리 실행 대상 DB 파드 조회"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ db_conn.namespace }}"
    label_selectors:
      - "{{ db_conn.pod_label_selector }}"
  register: dbq_pods_raw
  failed_when: false

- name: "{{ db_conn.service }} | 쿼리 실행 파드·컨테이너 결정"
  ansible.builtin.set_fact:
    dbq_pod: "{{ (dbq_pods_raw.resources | default([]) | selectattr('status.phase', 'equalto', 'Running') | map(attribute='metadata.name') | list | first) | default('', true) }}"
    dbq_container: "{{ 'mysqld' if db_conn.engine == 'mysql' else 'postgres' }}"
    dbq_errors: "{{ [] if (dbq_pods_raw.resources | default([]) | selectattr('status.phase', 'equalto', 'Running') | list | length > 0)
                    else ['라벨셀렉터(' ~ db_conn.pod_label_selector ~ ')로 Running 파드 없음' ~ ((' / ' ~ dbq_pods_raw.msg) if dbq_pods_raw.msg is defined else '')] }}"
