---
# MySQL 대상 D-XX 점검 — DB 파드(mysqld 컨테이너) 내부 mysql 클라이언트로 실행, 계정은 dba_admin

- name: "{{ db_conn.service }} | 파드 내부 쿼리 실행 준비"
  ansible.builtin.include_tasks: db_exec_prepare.yml

- name: "{{ db_conn.service }} | 자격증명 기본값 설정"
  ansible.builtin.set_fact:
    mysql_admin_user: ""
    mysql_admin_password: ""

- name: "{{ db_conn.service }} | K8s Secret에서 관리자(admin) 자격증명 조회"
  vars:
    mysql_admin_secret_data: "{{ (query('kubernetes.core.k8s', kind='Secret', name=dbms_admin_connections.mysql.secret_ref, namespace=dbms_admin_connections.mysql.namespace | default('default')) | first | default({})).data | default({}) }}"
  ansible.builtin.set_fact:
    mysql_admin_user: "{{ dbms_admin_connections.mysql.secret_username }}"
    mysql_admin_password: "{{ mysql_admin_secret_data[dbms_admin_connections.mysql.secret_password_key] | default('') | b64decode }}"
  when: dbms_admin_connections.mysql.secret_ref is not none
  ignore_errors: true

- name: "{{ db_conn.service }} | 관리자 자격증명 조회 실패 원인 기록"
  ansible.builtin.set_fact:
    dbq_errors: "{{ dbq_errors + ['관리자 Secret(' ~ dbms_admin_connections.mysql.secret_ref ~ '/' ~ dbms_admin_connections.mysql.secret_password_key ~ ') 조회 실패 — mgmt 서버의 Secret 조회 권한 또는 키 이름 확인 필요'] }}"
  when: mysql_admin_password | length == 0

# D-01 | 기본 계정 잠금 상태 (root@localhost)
- name: "{{ db_conn.service }} | D-01 root 계정(전체 호스트) 비밀번호·잠금 상태 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d01_raw
    dbq_sql: "SELECT user, host, account_locked, password_expired, plugin, (authentication_string <> '') AS has_password FROM mysql.user WHERE user='root'"

- name: "{{ db_conn.service }} | D-01 판정 기록"
  vars:
    d01_rows: "{{ d01_raw.query_result[0] if d01_raw.query_result is defined else [] }}"
    d01_unlocked: "{{ d01_rows | rejectattr('account_locked', 'equalto', 'Y') | list }}"
    d01_bad: "{{ (d01_unlocked | rejectattr('has_password', 'equalto', 1) | list) + (d01_unlocked | selectattr('has_password', 'equalto', 1) | rejectattr('password_expired', 'equalto', 'N') | list) }}"
    d01_desc_all: "{% for r in d01_rows %}{{ r.user }}@{{ r.host }}(비밀번호 설정={{ r.has_password == 1 }}, 임시비밀번호 만료={{ r.password_expired }}, 잠금={{ r.account_locked }}, 플러그인={{ r.plugin }}){{ ', ' if not loop.last }}{% endfor %}"
    d01_desc_bad: "{% for r in d01_bad %}{{ r.user }}@{{ r.host }}{{ ', ' if not loop.last }}{% endfor %}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-01', 'item': '기본 계정의 비밀번호, 정책 등을 변경하여 사용', 'target': db_conn.service,
      'status': (
        'FAIL' if d01_raw.query_result is not defined else
        ('PASS' if d01_rows | length == 0 else ('FAIL' if d01_bad | length > 0 else 'PASS'))
      ),
      'detail': (
        '조회 실패' if d01_raw.query_result is not defined else
        ('기본 계정(root) 미존재 — 모든 호스트에서 root 계정이 제거된 상태(초기 비밀번호 대입 위험 없음)' if d01_rows | length == 0
         else ('초기 비밀번호 미변경·미잠금 root 계정: ' ~ d01_desc_bad ~ ' / 전체 root 계정: ' ~ d01_desc_all if d01_bad | length > 0
         else '모든 root 계정이 초기 비밀번호 변경 또는 잠금 충족: ' ~ d01_desc_all) ~ ' — 계정별로 초기 비밀번호 변경(비밀번호 설정 + 임시비밀번호 만료 아님) 또는 잠금 중 하나 충족 시 양호')
      )
    }] }}"

# D-02 | 불필요 계정 제거
- name: "{{ db_conn.service }} | D-02 전체 계정 목록 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d02_raw
    dbq_sql: "SELECT user, host, account_locked FROM mysql.user WHERE user NOT IN ('root','mysql.sys','mysql.session','mysql.infoschema')"

- name: "{{ db_conn.service }} | D-02 판정 기록"
  vars:
    d02_query_ok: "{{ d02_raw.query_result is defined }}"
    d02_accounts: "{{ d02_raw.query_result | default([]) | first | default([]) }}"
    d02_locked: "{{ d02_accounts | selectattr('account_locked', 'equalto', 'Y') | map(attribute='user') | list | unique }}"
    d02_unauthorized: "{{ d02_accounts | rejectattr('account_locked', 'equalto', 'Y') | rejectattr('user', 'in', (d02_unnecessary_account_whitelist | default([])) + dbms_operator_accounts.mysql + dbms_dba_accounts) | list }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-02', 'item': '데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용', 'target': db_conn.service,
      'status': 'SKIP' if d02_unnecessary_account_whitelist is none else ('PASS' if (d02_query_ok and d02_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        '전체 계정(화이트리스트 TODO, 참고용): ' ~ (d02_accounts | string | truncate(150) if d02_accounts | length > 0 else '없음') if d02_unnecessary_account_whitelist is none
        else ('조회 실패' if not d02_query_ok else '화이트리스트 외 로그인 가능 계정: ' ~ (d02_unauthorized | map(attribute='user') | list | unique | join(', ') if d02_unauthorized | length > 0 else '없음') ~ ' / 잠금된 계정(원문상 잠금 후 사용 허용 — 판정 제외): ' ~ (d02_locked | join(', ') if d02_locked | length > 0 else '없음'))
      )
    }] }}"

# D-03 | 비밀번호 사용기간·복잡도 (서비스 계정 제외, 전용 유저 계정에만 적용)
- name: "{{ db_conn.service }} | D-03 판정 기록(서비스 계정 — 법정 기준 미적용)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-03', 'item': '비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정', 'target': db_conn.service,
      'status': 'FAIL',
      'detail': '서비스 계정에 비밀번호 만료(90일)·복잡도 정책 미적용 — 자동 로테이션 없이 강제 만료 시 서비스 장애 위험(DBA 협의). 법적 근거 있는 기준이라 예외 처리하지 않고 미준수로 보고. 전용 유저 계정에는 이 정책을 적용 중(아래 별도 행 참고)'
    }] }}"

- name: "D-03 | 전용 유저 계정 조회(MySQL, 최초 커넥션에서 1회)"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d03_user_raw
    dbq_sql: "SELECT user, Password_lifetime FROM mysql.user"
  when: >
    d03_user_accounts.mysql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(MySQL 유저 계정)') | list | length == 0)

- name: "D-03 | validate_password 전역 설정 조회(MySQL, 최초 커넥션에서 1회)"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d03_policy_raw
    dbq_sql: "SHOW VARIABLES WHERE Variable_name IN ('validate_password.length','validate_password.policy')"
  when: >
    d03_user_accounts.mysql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(MySQL 유저 계정)') | list | length == 0)

- name: "D-03 | dba_admin 비밀번호 자동 교체 이력 초기화(MySQL, 최초 커넥션에서 1회)"
  ansible.builtin.set_fact:
    d03_rotated_at: ""
  when: >
    d03_user_accounts.mysql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(MySQL 유저 계정)') | list | length == 0)

- name: "D-03 | dba_admin 비밀번호 자동 교체 이력 조회(MySQL, 최초 커넥션에서 1회)"
  ansible.builtin.set_fact:
    d03_rotated_at: "{{ (((query('kubernetes.core.k8s', kind='Secret', name=d03_rotation.secrets.mysql, namespace=d03_rotation.namespace) | first | default({})).metadata | default({})).annotations | default({}))[d03_rotation.annotation] | default('') }}"
  when: >
    d03_user_accounts.mysql | length > 0
    and (check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(MySQL 유저 계정)') | list | length == 0)
  ignore_errors: true

- name: "D-03 | 전용 유저 계정 판정 기록(MySQL, 최초 커넥션에서 1회)"
  vars:
    d03_query_ok: "{{ d03_user_raw is defined and d03_user_raw.query_result is defined }}"
    d03_all_accounts: "{{ d03_user_raw.query_result | default([]) | first | default([]) if d03_query_ok else [] }}"
    d03_found: "{{ d03_all_accounts | selectattr('user', 'in', d03_user_accounts.mysql) | list }}"
    d03_missing: "{{ d03_user_accounts.mysql | difference(d03_found | map(attribute='user') | list) }}"
    d03_lifetime_ok: "{{ d03_found | rejectattr('Password_lifetime', 'none') | selectattr('Password_lifetime', '>', 0) | selectattr('Password_lifetime', '<=', d03_password_max_days | int) | list | length == d03_found | length }}"
    d03_minlen: "{{ (d03_policy_raw.query_result | default([]) | first | default([]) | selectattr('Variable_name', 'equalto', 'validate_password.length') | map(attribute='Value') | list | first) | default('0', true) }}"
    d03_policy: "{{ (d03_policy_raw.query_result | default([]) | first | default([]) | selectattr('Variable_name', 'equalto', 'validate_password.policy') | map(attribute='Value') | list | first) | default('LOW', true) }}"
    d03_policy_ok: "{{ d03_policy | upper in ['MEDIUM', 'STRONG'] and d03_minlen | int >= d03_password_min_length }}"
    d03_rotation_days: "{{ ((now(utc=true) - (d03_rotated_at | regex_replace('([.][0-9]+)?(Z|[+-][0-9][0-9]:[0-9][0-9])?$', '') | to_datetime('%Y-%m-%dT%H:%M:%S'))).days) if (d03_rotated_at | default('') | length > 0) else -1 }}"
    d03_rotation_ok: "{{ d03_rotation_days | int >= 0 and d03_rotation_days | int <= d03_password_max_days | int }}"
    d03_rotation_desc: "{{ ('최근 교체 ' ~ d03_rotation_days ~ '일 전') if d03_rotation_days | int >= 0 else '교체 이력 없음' }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-03', 'item': '비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정', 'target': '전체(MySQL 유저 계정)',
      'status': (
        'FAIL' if d03_user_accounts.mysql | length == 0 else
        ('FAIL' if not d03_query_ok else
         ('FAIL' if (d03_missing | length > 0 or not (d03_lifetime_ok or d03_rotation_ok) or not (d03_policy_ok or d03_rotation_ok)) else 'PASS'))
      ),
      'detail': (
        '전용 유저 계정 미생성 — 인프라팀 구현 대기(서비스 계정만 존재, 정책 적용대상 계정 없음)' if d03_user_accounts.mysql | length == 0
        else ('조회 실패' if not d03_query_ok
        else ('계정 미발견: ' ~ (d03_missing | join(', ')) if d03_missing | length > 0
        else '사용기간 — DB 만료설정(Password_lifetime <= ' ~ d03_password_max_days ~ '일)=' ~ (d03_lifetime_ok | string) ~ ' 또는 자동 교체(' ~ d03_rotation_desc ~ ', 기준 <= ' ~ d03_password_max_days ~ '일)=' ~ (d03_rotation_ok | string) ~
             ' / 복잡도 — validate_password.length=' ~ d03_minlen ~ '/policy=' ~ d03_policy ~ '(기준 >= ' ~ d03_password_min_length ~ '자, MEDIUM 이상)=' ~ (d03_policy_ok | string) ~ ' 또는 자동 교체 생성규칙(12자·대소문자·숫자·특수문자 4종 보장)=' ~ (d03_rotation_ok | string)))
      )
    }] }}"
  when: check_results | selectattr('id', 'equalto', 'D-03') | selectattr('target', 'equalto', '전체(MySQL 유저 계정)') | list | length == 0

# D-04 | 관리자 권한 최소 인원
- name: "{{ db_conn.service }} | D-04 SUPER/GRANT 권한 보유 계정 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d04_raw
    dbq_sql: >-
      SELECT grantee FROM information_schema.user_privileges
      WHERE privilege_type IN ('SUPER','SYSTEM_USER') AND grantee NOT LIKE "'root'@%"
      AND grantee NOT IN ("'mysql.sys'@'localhost'", "'mysql.session'@'localhost'", "'mysql.infoschema'@'localhost'")

- name: "{{ db_conn.service }} | D-04 판정 기록"
  vars:
    d04_query_ok: "{{ d04_raw.query_result is defined }}"
    d04_admins: "{{ d04_raw.query_result | default([]) | first | default([]) | map(attribute='grantee') | map('regex_replace', \"^'([^']*)'@.*$\", '\\1') | list | unique }}"
    d04_unauthorized: "{{ d04_admins | difference((d04_admin_account_whitelist | default([])) + dbms_operator_accounts.mysql) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-04', 'item': '데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용', 'target': db_conn.service,
      'status': 'SKIP' if d04_admin_account_whitelist is none else ('PASS' if (d04_query_ok and d04_unauthorized | length == 0) else 'FAIL'),
      'detail': (
        'SUPER/SYSTEM_USER 보유 계정(화이트리스트 TODO, 참고용): ' ~ (d04_admins | join(', ') if d04_admins | length > 0 else '없음') if d04_admin_account_whitelist is none
        else ('조회 실패' if not d04_query_ok else '화이트리스트 외 관리자 권한 계정: ' ~ (d04_unauthorized | join(', ') if d04_unauthorized | length > 0 else '없음'))
      )
    }] }}"

# D-05 | 비밀번호 재사용 제한 (d05_applicable 로 게이트)
- name: "{{ db_conn.service }} | D-05 password_history 설정 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d05_raw
    dbq_sql: "SHOW VARIABLES LIKE 'password_history'"
  when: d05_applicable | bool

- name: "{{ db_conn.service }} | D-05 판정 기록"
  vars:
    d05_query_ok: "{{ d05_raw.query_result is defined and d05_raw.query_result[0] | length > 0 }}"
    d05_history: "{{ d05_raw.query_result[0][0].Value if d05_query_ok else '' }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-05', 'item': '비밀번호 재사용에 대한 제약 설정', 'target': db_conn.service,
      'status': (
        'N/A' if not (d05_applicable | bool) else
        ('SKIP' if d05_password_reuse_limit is none else
         ('FAIL' if not d05_query_ok else
          ('PASS' if (d05_history | int >= d05_password_reuse_limit) else 'FAIL')))
      ),
      'detail': (
        '원문 대상에 MySQL 미기재 — 적용여부 DBA 확인 대기(해당없음 처리 중)' if not (d05_applicable | bool)
        else ('조회 실패' if not d05_query_ok
        else 'password_history=' ~ d05_history ~ (' — 재사용제한 기준값(d05_password_reuse_limit) TODO' if d05_password_reuse_limit is none else ''))
      )
    }] }}"

# D-06 | 계정 개별 부여(공용 계정 금지)
- name: "{{ db_conn.service }} | D-06 이 DB에 권한 있는 계정 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d06_raw
    dbq_sql: "SELECT DISTINCT User AS user FROM mysql.db WHERE Db='{{ db_conn.service }}' UNION SELECT DISTINCT User FROM mysql.tables_priv WHERE Db='{{ db_conn.service }}'"

- name: "{{ db_conn.service }} | D-06 판정 기록"
  vars:
    d06_query_ok: "{{ d06_raw.query_result is defined }}"
    d06_users: "{{ d06_raw.query_result | default([]) | first | default([]) | map(attribute='user') | list | unique }}"
    d06_expected: "{{ dbms_service_accounts | selectattr('database', 'equalto', db_conn.service) | map(attribute='account') | list }}"
    d06_mgmt: "{{ dbms_operator_accounts.mysql + dbms_dba_accounts }}"
    d06_unexpected: "{{ d06_users | difference(d06_expected) | difference(d06_mgmt) }}"
    d06_expected_missing: "{{ d06_expected | difference(d06_users) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-06', 'item': 'DB 사용자 계정을 개별적으로 부여하여 사용', 'target': db_conn.service,
      'status': (
        'REVIEW' if d06_expected | length == 0 else
        ('FAIL' if not d06_query_ok else
         ('FAIL' if d06_unexpected | length > 0 else
          ('REVIEW' if d06_expected_missing | length > 0 else 'PASS')))
      ),
      'detail': (
        'dbms_service_accounts에 이 DB(' ~ db_conn.service ~ ')에 매핑된 계정 없음 — group_vars 매핑 확인 필요' if d06_expected | length == 0
        else ('조회 실패' if not d06_query_ok
        else ('이 DB에 권한 있는 계정: ' ~ (d06_users | join(', ') if d06_users | length > 0 else '없음') ~
              ' / 전용 계정(' ~ (d06_expected | join(', ')) ~ ')·관리 계정 외: ' ~ (d06_unexpected | join(', ') if d06_unexpected | length > 0 else '없음') ~
              (' / 전용 계정의 이 DB 권한 미확인 — 서비스가 다른 계정으로 접속 중인지 확인 필요' if d06_expected_missing | length > 0 else '')))
      )
    }] }}"

# D-08 | 안전한 암호화 알고리즘 사용 (caching_sha2_password)
- name: "{{ db_conn.service }} | D-08 인증 플러그인 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d08_raw
    dbq_sql: "SELECT user, host, plugin FROM mysql.user WHERE plugin NOT IN ('caching_sha2_password','sha256_password')"

- name: "{{ db_conn.service }} | D-08 판정 기록"
  vars:
    d08_weak: "{{ d08_raw.query_result | default([]) | first | default([]) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-08', 'item': '안전한 암호화 알고리즘 사용', 'target': db_conn.service,
      'status': 'PASS' if (d08_raw.query_result is defined and d08_weak | length == 0) else 'FAIL',
      'detail': '조회 실패' if d08_raw.query_result is not defined else ('취약 플러그인 사용 계정: ' ~ (d08_weak | string | truncate(150) if d08_weak | length > 0 else '없음'))
    }] }}"

# D-09 | 로그인 실패 잠금 — MySQL 8.0.19+ 에서만 네이티브 지원 (버전 게이트)
- name: "{{ db_conn.service }} | D-09 MySQL 버전 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d09_version_raw
    dbq_sql: "SELECT VERSION()"

- name: "{{ db_conn.service }} | D-09 버전 조회 실패 기록"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-09', 'item': '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정', 'target': db_conn.service,
      'status': 'FAIL',
      'detail': '조회 실패'
    }] }}"
  when: d09_version_raw.query_result is not defined

- name: "{{ db_conn.service }} | D-09 버전 8.0.19 미만이면 N/A 처리"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-09', 'item': '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': 'MySQL 8.0.19 미만 — FAILED_LOGIN_ATTEMPTS 네이티브 미지원. 버전: ' ~ (d09_version_raw.query_result | default('조회 실패') | string)
    }] }}"
  when: >
    d09_version_raw.query_result is defined and
    (d09_version_raw.query_result[0][0].values() | first) is version('8.0.19', '<')

- name: "{{ db_conn.service }} | D-09 잠금 설정 조회(8.0.19 이상)"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d09_raw
    dbq_sql: >-
      SELECT user, host FROM mysql.user
      WHERE user NOT IN ('mysql.sys','mysql.session','mysql.infoschema')
      AND (JSON_EXTRACT(User_attributes, '$.Password_locking.failed_login_attempts') IS NULL
           OR JSON_EXTRACT(User_attributes, '$.Password_locking.failed_login_attempts') = 0)
  when: >
    d09_version_raw.query_result is defined and
    (d09_version_raw.query_result[0][0].values() | first) is version('8.0.19', '>=')

- name: "{{ db_conn.service }} | D-09 판정 기록(8.0.19 이상)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-09', 'item': '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정', 'target': db_conn.service,
      'status': 'PASS' if (d09_raw.query_result is defined and (d09_raw.query_result | first | default([]) | length) == 0) else 'FAIL',
      'detail': '조회 실패' if d09_raw.query_result is not defined else ('잠금 미설정 계정: ' ~ (d09_raw.query_result | first | default([]) | string | truncate(150)))
    }] }}"
  when: >
    d09_version_raw.query_result is defined and
    (d09_version_raw.query_result[0][0].values() | first) is version('8.0.19', '>=')

# D-10 | 원격 DB 서버 접속 제한 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고

# D-11 | 시스템 테이블 접근 제한 (mysql.* 스키마, PUBLIC/일반 사용자 REVOKE 여부)
- name: "{{ db_conn.service }} | D-11 mysql 스키마 권한 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d11_raw
    dbq_sql: "SELECT grantee, table_schema FROM information_schema.schema_privileges WHERE table_schema='mysql' AND grantee NOT LIKE \"'root'@%\""

- name: "{{ db_conn.service }} | D-11 판정 기록"
  vars:
    d11_extra: "{{ d11_raw.query_result | default([]) | first | default([]) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-11', 'item': '시스템 테이블 접근 제한', 'target': db_conn.service,
      'status': 'PASS' if (d11_raw.query_result is defined and d11_extra | length == 0) else 'FAIL',
      'detail': '조회 실패' if d11_raw.query_result is not defined else ('비관리자 접근 권한: ' ~ (d11_extra | string | truncate(150) if d11_extra | length > 0 else '없음'))
    }] }}"

# D-17 | Audit Table 접근 제한 (감사 플러그인 활성화 여부로 실측 — 오픈소스 Audit Plugin은
# 후보만 있고 보안/버전 지원 검토 중이라 미도입 확정, 도입 전까지 자동 FAIL)
- name: "{{ db_conn.service }} | D-17 감사 플러그인 활성화 여부 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d17_raw
    dbq_sql: "SELECT PLUGIN_NAME, PLUGIN_STATUS FROM information_schema.PLUGINS WHERE PLUGIN_NAME LIKE '%audit%'"

- name: "{{ db_conn.service }} | D-17 판정 기록"
  vars:
    d17_plugins: "{{ d17_raw.query_result | default([]) | first | default([]) }}"
    d17_active: "{{ d17_plugins | selectattr('PLUGIN_STATUS', 'equalto', 'ACTIVE') | list }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-17', 'item': 'Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한', 'target': db_conn.service,
      'status': 'PASS' if d17_active | length > 0 else 'FAIL',
      'detail': '조회 실패' if d17_raw.query_result is not defined else (('활성 감사 플러그인: ' ~ (d17_active | map(attribute='PLUGIN_NAME') | join(', '))) if d17_active | length > 0 else '활성화된 감사 플러그인 없음 — 오픈소스 Audit Plugin 도입 검토 중(보안·버전 지원 확인 중), 도입 전까지 감사기록 파이프라인 미구성으로 취약 판정')
    }] }}"

# D-18 | PUBLIC Role — MySQL은 해당 개념 자체가 없음
- name: "{{ db_conn.service }} | D-18 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-18', 'item': '응용프로그램 또는 DBA 계정의 Role이 Public으로 설정되지 않도록 조정', 'target': db_conn.service,
      'status': 'N/A',
      'detail': 'MySQL은 PUBLIC 롤 개념이 없음(권한 모델이 user@host 단위) — PostgreSQL 대상 항목'
    }] }}"

# D-20 | 인가되지 않은 Object Owner 제한 — 원문상 PostgreSQL 서비스에만 적용
- name: "{{ db_conn.service }} | D-20 판정 기록(해당없음)"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-20', 'item': '인가되지 않은 Object Owner의 제한', 'target': db_conn.service,
      'status': 'N/A',
      'detail': '원문 적용대상이 PostgreSQL 서비스로 한정(MySQL 서비스는 제외 검토, spec 2.1절 근거)'
    }] }}"

# D-21 | GRANT OPTION 부여 현황
- name: "{{ db_conn.service }} | D-21 GRANT OPTION 부여 계정 조회"
  ansible.builtin.include_tasks: db_exec_query.yml
  vars:
    dbq_name: d21_raw
    dbq_sql: "SELECT grantee FROM information_schema.user_privileges WHERE is_grantable='YES'"

- name: "{{ db_conn.service }} | D-21 판정 기록"
  vars:
    d21_query_ok: "{{ d21_raw.query_result is defined }}"
    d21_grantees: "{{ d21_raw.query_result | default([]) | first | default([]) | map(attribute='grantee') | map('regex_replace', \"^'([^']*)'@.*$\", '\\1') | list | unique }}"
    d21_unauthorized: "{{ d21_grantees | difference((d21_grant_option_admin_whitelist | default([])) + dbms_operator_accounts.mysql) }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'D-21', 'item': '인가되지 않은 GRANT OPTION 사용 제한', 'target': db_conn.service,
      'status': 'PASS' if (d21_query_ok and d21_unauthorized | length == 0) else 'FAIL',
      'detail': '조회 실패' if not d21_query_ok else ('GRANT OPTION 보유 계정: ' ~ (d21_grantees | join(', ') if d21_grantees | length > 0 else '없음') ~ ' / 화이트리스트(' ~ (d21_grant_option_admin_whitelist | join(', ')) ~ ') 외: ' ~ (d21_unauthorized | join(', ') if d21_unauthorized | length > 0 else '없음'))
    }] }}"

# D-25 | 주기적 보안 패치 적용 — roles/dbms_common/tasks/k8s_pod_checks.yml 참고

- name: "{{ db_conn.service }} | 조회 실패 원인 기록"
  ansible.builtin.include_tasks: db_exec_errors.yml
