---
# DBMS 점검

- name: "DBMS 점검 대상 커넥션 존재 여부 확인"
  ansible.builtin.debug:
    msg: >-
      dbms_connections 가 비어있어 실제 DB 조회 대신 SKIP 행만 생성합니다.
      group_vars/all.yml 에 DB host/port/secret_ref 확정 후 재실행 필요.
  when: dbms_connections | length == 0

- name: "DBMS | 커넥션 없을 때 SKIP 행 생성"
  vars:
    dbms_coded_items:
      - {id: 'D-01', item: '기본 계정의 비밀번호, 정책 등을 변경하여 사용'}
      - {id: 'D-02', item: '데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용'}
      - {id: 'D-03', item: '비밀번호 사용 기간 및 복잡도를 기관의 정책에 맞도록 설정'}
      - {id: 'D-04', item: '데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용'}
      - {id: 'D-05', item: '비밀번호 재사용에 대한 제약 설정'}
      - {id: 'D-06', item: 'DB 사용자 계정을 개별적으로 부여하여 사용'}
      - {id: 'D-07', item: 'root 권한으로 서비스 구동 제한'}
      - {id: 'D-08', item: '안전한 암호화 알고리즘 사용'}
      - {id: 'D-09', item: '일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정'}
      - {id: 'D-10', item: '원격에서 DB 서버로의 접속 제한'}
      - {id: 'D-11', item: 'DBA 이외의 인가되지 않은 사용자가 시스템 테이블에 접근할 수 없도록 설정'}
      - {id: 'D-14', item: '데이터베이스의 주요 설정 파일, 비밀번호 파일 등과 같은 주요 파일들의 접근 권한이 적절하게 설정'}
      - {id: 'D-17', item: 'Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한'}
      - {id: 'D-18', item: '응용프로그램 또는 DBA 계정의 Role이 Public으로 설정되지 않도록 조정'}
      - {id: 'D-20', item: '인가되지 않은 Object Owner의 제한'}
      - {id: 'D-21', item: '인가되지 않은 GRANT OPTION 사용 제한'}
      - {id: 'D-25', item: '주기적 보안 패치 및 벤더 권고 사항 적용'}
      - {id: 'D-26', item: '데이터베이스의 접근, 변경, 삭제 등의 감사 기록이 기관의 감사 기록 정책에 적합하도록 설정'}
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': item.id, 'item': item.item, 'status': 'SKIP',
      'detail': 'DB 파드 미구축 또는 dbms_connections 미설정 — 접속 정보 확정 후 재실행 필요',
      'target': '해당없음(DB 미구축)'
    }] }}"
  loop: "{{ dbms_coded_items }}"
  loop_control:
    loop_var: item
    label: "{{ item.id }}"
  when: dbms_connections | length == 0

- name: "MySQL 대상 SQL 점검 실행"
  ansible.builtin.include_tasks: mysql.yml
  loop: "{{ dbms_connections | selectattr('engine', 'equalto', 'mysql') | list }}"
  loop_control:
    loop_var: db_conn
    label: "{{ db_conn.service }}"
  when: dbms_connections | length > 0

- name: "PostgreSQL 대상 SQL 점검 실행"
  ansible.builtin.include_tasks: postgresql.yml
  loop: "{{ dbms_connections | selectattr('engine', 'equalto', 'postgresql') | list }}"
  loop_control:
    loop_var: db_conn
    label: "{{ db_conn.service }}"
  when: dbms_connections | length > 0

- name: "파드 레벨 점검(D-07, D-14) 실행"
  ansible.builtin.include_tasks: k8s_pod_checks.yml
  loop: "{{ dbms_connections }}"
  loop_control:
    loop_var: db_conn
    label: "{{ db_conn.service }}"
  when: dbms_connections | length > 0
