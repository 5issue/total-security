---
# roles/log_patch_check — U-64(주기적 보안 패치), U-66(시스템 로깅) 점검

- name: "U-64 | 호스트 그룹별 비교 대상 AMI SSM 파라미터 결정"
  ansible.builtin.set_fact:
    u64_target_ami_param: "{{
      u64_eks_optimized_ami_ssm_param if 'eks_worker_nodes' in group_names
      else (u64_nat_latest_ami_ssm_param if 'nat_instances' in group_names else none)
    }}"

- name: "U-64 | 비교 대상 SSM 파라미터 미확정/미분류 시 SKIP"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-64', 'item': '주기적 보안 패치 및 벤더 권고사항 적용', 'target': inventory_hostname,
      'status': 'SKIP',
      'detail': (
        '인벤토리 그룹(eks_worker_nodes/nat_instances) 미분류 — inventory/hosts.ini 확인 필요' if ('eks_worker_nodes' not in group_names and 'nat_instances' not in group_names)
        else '최신 AMI 기준 SSM 파라미터 경로 미확정(u64_eks_optimized_ami_ssm_param/u64_nat_latest_ami_ssm_param) — 인프라팀 확인 대기'
      )
    }] }}"
  when: not u64_target_ami_param

- name: "U-64 | 대상 인스턴스 EC2 메타데이터 조회(현재 AMI ID)"
  amazon.aws.ec2_metadata_facts:
  ignore_errors: true
  when: u64_target_ami_param | default('') | length > 0

- name: "U-64 | 최신 AMI ID 조회(mgmt 서버 AWS CLI)"
  ansible.builtin.command:
    cmd: "aws ssm get-parameter --name {{ u64_target_ami_param }} --query Parameter.Value --output text"
  register: u64_latest_ami_raw
  delegate_to: localhost
  failed_when: false
  when: u64_target_ami_param | default('') | length > 0

- name: "U-64 | dnf 패치 이력 조회(참고용, 판정 미반영)"
  ansible.builtin.command: "dnf history list"
  register: u64_dnf_raw
  become: true
  changed_when: false
  failed_when: false
  when: u64_target_ami_param | default('') | length > 0

- name: "U-64 | 판정 기록"
  vars:
    u64_current_ami: "{{ ansible_ec2_ami_id | default('') }}"
    u64_latest_ami: "{{ (u64_latest_ami_raw.stdout | default('') | trim) if (u64_latest_ami_raw is defined and (u64_latest_ami_raw.rc | default(-1)) == 0) else '' }}"
    u64_lookup_ok: "{{ u64_current_ami | length > 0 and u64_latest_ami | length > 0 }}"
    u64_dnf_recent: "{{ (u64_dnf_raw.stdout_lines | default([]))[1:4] | join(' / ') if u64_dnf_raw is defined and u64_dnf_raw.stdout_lines | default([]) | length > 1 else '조회 실패 또는 이력 없음' }}"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-64', 'item': '주기적 보안 패치 및 벤더 권고사항 적용', 'target': inventory_hostname,
      'status': (
        'SKIP' if not u64_lookup_ok
        else ('PASS' if u64_current_ami == u64_latest_ami else 'FAIL')
      ),
      'detail': (
        '현재 AMI(' ~ (u64_current_ami | default('미확인')) ~ ') 또는 최신 AMI 조회 실패(SSM 파라미터=' ~ u64_target_ami_param ~ ')' if not u64_lookup_ok
        else '현재 AMI=' ~ u64_current_ami ~ ', 최신 AMI=' ~ u64_latest_ami ~ ' / 최근 dnf 이력: ' ~ u64_dnf_recent
      )
    }] }}"
  when: u64_target_ami_param | default('') | length > 0
