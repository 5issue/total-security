---
# u66_check.yml — U-66(정책에 따른 시스템 로깅 설정) 점검

- name: "U-66 | 미구현 로그 항목 존재 시 FAIL"
  ansible.builtin.set_fact:
    check_results: "{{ check_results + [{
      'id': 'U-66', 'item': '정책에 따른 시스템 로깅 설정', 'target': '전체(CloudWatch 로그그룹)',
      'status': 'FAIL',
      'detail': '미구현 확인된 필수 로그: ' ~ (u66_missing_log_categories | join(', ')) ~
                ' — 현재 ALB 액세스로그용 S3 버킷만 구현됨(인프라팀 구현 예정, 조치 필요 항목으로 보고)'
    }] }}"
  when: u66_missing_log_categories | default([]) | length > 0
  run_once: true

- name: "U-66 | 로그그룹 보관기간 점검 — mgmt 서버 AWS API 조회"
  ansible.builtin.include_role:
    name: log_patch_check
    tasks_from: log_retention_check
  vars:
    lrc_item_id: "U-66"
    lrc_item_name: "정책에 따른 시스템 로깅 설정"
    lrc_log_group_name: "{{ u66_log_group_name }}"
    lrc_target: "전체(CloudWatch 로그그룹)"
    lrc_min_days: "{{ u66_log_retention_min_days | default(365) }}"
  when: u66_missing_log_categories | default([]) | length == 0
  run_once: true
